services:
  caddy:
    container_name: caddy
    image: caddy:2.11
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
  api:
    image: librechat
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-6144}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - MODEL_PRICING_REFERENCE_MODEL_ID=${MODEL_PRICING_REFERENCE_MODEL_ID:-gpt-56-luna}
      - MODEL_PRICING_MULTIPLIER_ROUNDING_INCREMENT=${MODEL_PRICING_MULTIPLIER_ROUNDING_INCREMENT:-0.1}
      - MODEL_PRICING_MIN_MULTIPLIER=${MODEL_PRICING_MIN_MULTIPLIER:-0.1}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - type: bind
        source: ./charts/config/endpoint-costs.yaml
        target: /app/endpoint-costs.yaml
        read_only: true
    depends_on:
      - mongodb
      - rag_api
      - gateway-proxy
  gateway-proxy:
    container_name: gateway-proxy
    image: nginx:alpine
    restart: always
    env_file:
      - .env
    environment:
      - BEDROCK_REVERSE_PROXY=${BEDROCK_REVERSE_PROXY:-au-bedrock-exp.ctk.au.deloitte.com}
      - AZURE_OPENAI_HOST=${AZURE_OPENAI_HOST:-au-openai-exp.ctk.au.deloitte.com}
      - AZURE_OPENAI_GLOBAL_HOST=${AZURE_OPENAI_GLOBAL_HOST:?Set AZURE_OPENAI_GLOBAL_HOST to the global Azure OpenAI gateway hostname}
    volumes:
      - ./nginx-gateway-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
  rag_api:
    image: librechat-rag-api
    build:
      context: ./rag_api
      dockerfile: Dockerfile.lite
  admin-panel:
    image: librechat-admin-panel
    build:
      context: ./admin_panel
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /admin
    environment:
      - VITE_BASE_PATH=/admin
      - PORT=3000
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - API_SERVER_URL=http://api:3080
      - VITE_API_BASE_URL=${DOMAIN_CLIENT:-http://localhost:3080}
      - SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE}
      - ADMIN_SSO_ONLY=${ADMIN_SSO_ONLY}
volumes:
  caddy_data:
  caddy_config:
