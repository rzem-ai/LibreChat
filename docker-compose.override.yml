services:
  caddy:
    container_name: caddy
    image: caddy:2.11
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    # On startup: copy Deloitte GEL assets over the defaults, run citation patch, then launch normally.
    # deloitte/assets is mounted read-only; the copy targets the live client/dist/assets.
    command: >
      sh -c "set -eu; mkdir -p /app/client/dist/assets; cp -a /app/deloitte-assets/. /app/client/dist/assets/; node /app/patch-agent-instructions.js; npm run backend"
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      # Deloitte GEL assets — auto-injected at container start via command above
      - type: bind
        source: ./deloitte/assets
        target: /app/deloitte-assets
        read_only: true
      # Citation patches — runtime injection for agent instructions + file_search tool
      - type: bind
        source: ./config/patch-agent-instructions.js
        target: /app/patch-agent-instructions.js
        read_only: true
      - type: bind
        source: ./api/app/clients/tools/util/fileSearch.js
        target: /app/api/app/clients/tools/util/fileSearch.js
    depends_on:
      - gateway-proxy
  gateway-proxy:
    container_name: gateway-proxy
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx-gateway-proxy.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  caddy_data:
  caddy_config:
