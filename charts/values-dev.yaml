imageRegistry: 'dttaitsdev.azurecr.io'
branch: 'develop'

llmGateway:
  namespace: 'llm-gateway-ctnp'

serviceAccount:
  name: sa-librechat-dev

ingress:
  className: cilium
  host: 'librechat-dev.ctk.au.deloitte.com'
  annotations:
    ingress.cilium.io/loadbalancer-mode: 'shared'
    ingress.cilium.io/force-https: 'true'
    kubernetes.io/ingress.class: cilium
  tls:
    - secretName: ctk-au-deloitte-com
      secretStoreName: external-secret-store
      hosts:
        - 'librechat-dev.ctk.au.deloitte.com'

pods:
  librechat:
    replicas: 1
    securityContext:
      fsGroup: 1000
    initContainers:
      llm-gateway-proxy:
        restartPolicy: Always
        image:
          repository: 'tt-librechat/llm-gateway-proxy'
          pullPolicy: Always
          tag: 'develop@sha256:5e71af45f812b4f1a42b21cea6e38506a986bdc24d0ab1c0c3935d5222f9854f'
        env:
          TOKEN_PROXY_AZURE_AU_URL: 'http://azure-aus-east.llm-gateway-ctnp.svc.cluster.local:8080'
          TOKEN_PROXY_AZURE_GLOBAL_URL: 'http://foundry-eastus.llm-gateway-ctnp.svc.cluster.local:8080'
          TOKEN_PROXY_VERTEXAI_URL: 'http://vertexai-us-central1.llm-gateway-ctnp.svc.cluster.local:8080'
          TOKEN_PROXY_ANTHROPIC_URL: 'http://anthropic-eastus2.llm-gateway-ctnp.svc.cluster.local:8080'
          TOKEN_PROXY_BEDROCK_AU_URL: 'http://bedrock-ap-southeast-2.llm-gateway-ctnp.svc.cluster.local:8080'
          TOKEN_PROXY_MCP_URL: 'https://mcp-gw-dev.ctk.au.deloitte.com/mcp'
    containers:
      librechat:
        command:
          - /bin/sh
          - -c
          - >-
            mkdir -p /app/client/dist/assets && if [ -d /app/deloitte/assets ]; then
              cp -a /app/deloitte/assets/. /app/client/dist/assets/;
            elif [ -d /app/deloitte-assets ]; then
              cp -a /app/deloitte-assets/. /app/client/dist/assets/;
            fi && exec npm run backend
        image:
          tag: 'develop@sha256:75acfc483aaea02819dea8343c24fc532fd8c6b2c3583c0827b97bc9eedbd5dc'
        env:
          ADMIN_PANEL_URL: 'https://librechat-dev.ctk.au.deloitte.com/admin'
          ANTHROPIC_API_KEY: 'dummy' #anthropic API key set to dummy due to proxy
          ANTHROPIC_MODELS: 'claude-haiku-4-5,claude-sonnet-4-6,claude-opus-4-6,claude-sonnet-5,claude-opus-4-8'
          ANTHROPIC_REVERSE_PROXY: 'http://127.0.0.1:8081/anthropic'
          APP_TITLE: 'MyAssist (DEV)'
          BASE_URL_AZURE_AU: 'http://127.0.0.1:8081/azure-au'
          BASE_URL_AZURE_GLOBAL: 'http://127.0.0.1:8081/azure-global'
          BASE_URL_VERTEXAI: 'http://127.0.0.1:8081/vertexai'
          BEDROCK_AWS_ACCESS_KEY_ID: 'unused'
          BEDROCK_AWS_DEFAULT_REGION: 'ap-southeast-2'
          BEDROCK_AWS_SECRET_ACCESS_KEY: 'unused'
          BEDROCK_AWS_MODELS: 'au.anthropic.claude-sonnet-4-6,au.anthropic.claude-haiku-4-5-20251001-v1:0'
          BEDROCK_GATEWAY_URL: 'http://127.0.0.1:8081/bedrock'
          CUSTOM_FOOTER: '⚠️ WARNING: This is a development environment. Do not upload client or confidential data.'
          DOMAIN_CLIENT: 'https://librechat-dev.ctk.au.deloitte.com'
          DOMAIN_SERVER: 'https://librechat-dev.ctk.au.deloitte.com'
          EMBEDDINGS_MODEL: 'text-embedding-3-small'
          EMBEDDINGS_PROVIDER: 'openai'
          ENDPOINTS: 'agents,anthropic,bedrock,custom'
          KEY_VAULT_NAME: 'kv-int-librechat-dev'
          MCP_GATEWAY_OBO_SCOPE: 'api://3e5d28f1-91a3-4748-ad73-5fa544f1d3e2/access_as_user'
          MCP_GATEWAY_TOOLSETS: 'teams,research,news,kx,desc,gims'
          MCP_GATEWAY_URL: 'https://mcp-gw-dev.ctk.au.deloitte.com/mcp'
          MODEL_PRICING_MIN_MULTIPLIER: '0.1'
          MODEL_PRICING_MULTIPLIER_ROUNDING_INCREMENT: '0.1'
          MODEL_PRICING_REFERENCE_MODEL_ID: 'gpt-56-luna'
          MONGO_DB: 'mdb-librechat-database-dev'
          NODE_ENV: 'development'
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
          OPENID_CLIENT_ID: '2075976d-5147-47b2-89d2-4ad060d19f85'
          OPENID_ISSUER: 'https://login.microsoftonline.com/36da45f1-dd2c-4d1f-af13-5abe46b99921/v2.0/'
          OPENID_ON_BEHALF_FLOW_FOR_USERINFO_REQUIRED: 'true'
          OPENID_ON_BEHALF_FLOW_USERINFO_SCOPE: 'user.read'
          OPENID_REQUIRED_ROLE: ''
          OPENID_REUSE_TOKENS: 'true'
          OPENID_SCOPE: 'openid profile email offline_access https://librechat-dev.ctk.au.deloitte.com/access_user'
          RAG_API_URL: 'http://127.0.0.1:8000'
          #RAG_AZURE_OPENAI_API_VERSION: '2024-10-21'
          #RAG_AZURE_OPENAI_ENDPOINT: 'https://dttau-myassist-uat-models-openai-aueast.openai.azure.com'
          RAG_OPENAI_BASEURL: 'http://127.0.0.1:8081/azure-au'
          RAG_OPENAI_API_KEY: 'dummy' # openai API key set to dummy due to proxy
          RAG_PORT: '8000'
          REFRESH_TOKEN_EXPIRY: '86400000' # (ms) - 1 day refresh token expiration
          # ClearTrack Code Interpreter (ea-code-runtime)
          LIBRECHAT_CODE_BASEURL: 'https://code-runtime-dev.ctk.au.deloitte.com/v1'
          CODEAPI_AUTH_PROVIDER: 'librechat-jwt'
          CODEAPI_JWT_ALGORITHM: 'EdDSA'
          CODEAPI_JWT_KID: 'lc-codeapi-dev-2026-05'
          CODEAPI_JWT_ISSUER: 'librechat'
          CODEAPI_JWT_AUDIENCE: 'codeapi'
          CODEAPI_JWT_TTL_SECONDS: '300'
          CODEAPI_JWT_MINT_CACHE_SECONDS: '30'
          CODEAPI_JWT_SINGLE_TENANT_ID: 'legacy'
          # Azure Storage Container
          AZURE_CLIENT_ID: '9058562c-9eeb-4608-8613-51bec6324181'
          AZURE_STORAGE_ACCOUNT_NAME: 'stctspokenpdshared'
          AZURE_STORAGE_PUBLIC_ACCESS: 'false'
          AZURE_CONTAINER_NAME: 'stc-librechat-app-dev'
          #Langfuse Observability
          LANGFUSE_BASE_URL: 'https://langfuse-dev.ctk.au.deloitte.com'
          # OpenTelemetry Tracing
          OTEL_TRACING_ENABLED: 'true'
          OTEL_TRACES_SAMPLER_ARG: '1.0'
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: 'https://managed-ai-ctspoke-npd-dce-95rn.australiaeast-1.ingest.monitor.azure.com/dataCollectionRules/dcr-3991725585f24a5eabd0d6aa283d0e18/streams/Microsoft-OTLP-Traces/otlp/v1/traces'
          # Azure Monitor DCR only accepts OTLP/HTTP+protobuf
          OTEL_EXPORTER_OTLP_PROTOCOL: 'http/protobuf'
          # Wrap the OTLP exporter with an Azure AD bearer-token headers factory (managed identity via AZURE_CLIENT_ID)
          AZURE_MONITOR_AUTH_ENABLED: 'true'
          # Logging for debugging
          OTEL_LOG_LEVEL: 'INFO'
          OTEL_IOREDIS_TRACING_ENABLED: 'false'
          DEBUG_LOGGING: 'false'
          DEBUG_CONSOLE: 'false'
          AGENT_DEBUG_LOGGING: 'true'
          # Skill Security Scanner
          SKILL_SCANNER_URL: 'https://ai-registry-dev.ctk.au.deloitte.com/v1/scan?verbose=false'
          SKILL_SCANNER_TIMEOUT_MS: '30000'
          SKILL_SCANNER_MIN_SEVERITY: 'high'
          # AI Registry
          AI_REGISTRY_CLIENT_ID: "4aeebbdc-56f5-4329-b40e-3d0a243bf74a" # AI Registry DEV & UAT
          # In-cluster Valkey -- StatefulSet from charts/templates/valkey.yaml
          USE_REDIS: 'true'
          USE_REDIS_STREAMS: 'true'
          REDIS_URI: 'redis://librechat-valkey:6379'
          REDIS_KEY_PREFIX: 'librechat'
          REDIS_PING_INTERVAL: '300'
          STREAM_DELTA_COALESCE_MS: '25'
        secrets:
          # AZURE_API_KEY: librechat-azure-api-key
          MONGO_URI: librechat-dev-mdb-connection-string
          JWT_SECRET: librechat-jwt-secret-dev
          JWT_REFRESH_SECRET: librechat-jwt-refresh-secret-dev
          CREDS_KEY: librechat-creds-key-dev
          CREDS_IV: librechat-creds-iv-dev
          OPENID_CLIENT_SECRET: librechat-openid-client-secret-dev
          OPENID_SESSION_SECRET: librechat-openid-session-secret-dev
          # RAG_AZURE_OPENAI_API_KEY: librechat-azure-api-key
          # MEILI_MASTER_KEY: librechat-meili-master-key-dev
          # ClearTrack Code Interpreter (ea-code-runtime) — JWK signing key
          CODEAPI_JWT_PRIVATE_JWK_JSON: librechat-codeapi-jwt-private-jwk-dev
          #Langfuse Observability
          LANGFUSE_PUBLIC_KEY: librechat-langfuse-public-key-dev
          LANGFUSE_SECRET_KEY: librechat-langfuse-secret-key-dev
          REDIS_PASSWORD: librechat-valkey-password-dev
      rag-api:
        image:
          repository: 'tt-librechat/rag-api'
          pullPolicy: Always
          tag: 'develop@sha256:2f1afbb82b5d8f7840a88a03d516573e334dfd7bcbb51380e5e9dea1a889985a'
        env:
          PGVECTOR_CREATE_EXTENSION: 'False'
          VECTOR_DB_TYPE: 'pgvector'
          POSTGRES_USE_UNIX_SOCKET: 'False'
          POSTGRES_DB: 'pgdb_librechat_app_dev'
          POSTGRES_USER: 'id-int-librechat-dev'
          POSTGRES_AUTH_TYPE: 'ActiveDirectoryMsi'
          MANAGED_IDENTITY_CLIENT_ID: '9058562c-9eeb-4608-8613-51bec6324181'
          DB_HOST: 'psql-ctspoke-npd.postgres.database.azure.com'
          DB_PORT: '5432'
          RAG_HOST: '0.0.0.0'
          RAG_PORT: '8000'
          # RAG_AZURE_OPENAI_API_VERSION: '2024-10-21'
          # RAG_AZURE_OPENAI_ENDPOINT: 'https://dttau-myassist-uat-models-openai-aueast.openai.azure.com/'
          EMBEDDINGS_PROVIDER: 'openai'
          RAG_OPENAI_BASEURL: 'http://127.0.0.1:8081/azure-au'
          RAG_OPENAI_API_KEY: 'dummy' # openai API key set to dummy due to proxy
        secrets:
          # AZURE_OPENAI_API_KEY: librechat-azure-api-key
          # RAG_AZURE_OPENAI_API_KEY: librechat-azure-api-key
          JWT_SECRET: librechat-jwt-secret-dev
        service:
          enabled: true
          type: ClusterIP
          port: 8000
          targetPort: 8000
        ingress:
          enabled: false
          # meilisearch: # TODO: Enable meilisearch when we can have multi-container PVC
          #   image:
          #     pullPolicy: Always
          #     tag: 'develop@sha256:5cb7817994348e6ce9f2e0653199a75e501083ae32c80259dabbc656012bdb0f'
          #   env:
          #     MEILI_ENV: 'development'
          #   secrets:
          #     MEILI_MASTER_KEY: librechat-meili-master-key-dev
          #   persistence:
          #     enabled: true
          #     size: 10Gi
          #     accessModes:
          #       - ReadWriteOnce
          #     name: 'meilisearch-data'
          #     mountPath: /meili_data
          #     storageClass: 'managed-csi-standard-private'
  admin:
    replicas: 1
    containers:
      admin:
        # Image must be built with --build-arg VITE_BASE_PATH=/admin
        # The admin panel is a Vite SPA where the base path is baked in at build time.
        # CI must build this image with the VITE_BASE_PATH arg; otherwise asset paths
        # will be incorrect when routed through nginx at /admin.
        image:
          repository: 'tt-librechat/admin'
          pullPolicy: Always
          tag: 'develop@sha256:e24701594b581bc8ef99d6721149e735ad6d03002e5db246d51a43d34c5c67c4'
        env:
          PORT: '3000'
          ADMIN_SSO_ONLY: 'true'
          VITE_BASE_PATH: '/admin'
          VITE_API_BASE_URL: 'https://librechat-dev.ctk.au.deloitte.com'
          API_SERVER_URL: 'https://librechat-dev.ctk.au.deloitte.com'
          SESSION_COOKIE_SECURE: 'true'
        secrets:
          SESSION_SECRET: librechat-admin-panel-session-secret-dev
        service:
          enabled: true
          type: ClusterIP
          port: 3000
          targetPort: 3000
        ingress:
          enabled: true
          paths:
            - path: /admin
              pathType: Prefix

valkey:
  image:
    tag: 'develop@sha256:87ebb22a20d8ee2f450574f70068388acb9d2b5b60f74b9cf873c6be845102b3'
  persistence:
    storageClass: 'managed-csi-standard-private'
  passwordSecretName: 'librechat-valkey-password-dev'
