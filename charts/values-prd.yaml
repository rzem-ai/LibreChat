imageRegistry: 'dttaitsprd.azurecr.io'
branch: 'main'

serviceAccount:
  name: sa-librechat-prd

nodeSelector:
  app: myassist

tolerations:
  - key: sku
    operator: Equal
    value: myassist
    effect: NoSchedule

ingress:
  className: cilium
  host: 'myassist.ctk.au.deloitte.com'
  annotations:
    ingress.cilium.io/loadbalancer-mode: "shared"
    ingress.cilium.io/force-https: "true"
    kubernetes.io/ingress.class: cilium
  tls:
    - secretName: ctk-au-deloitte-com
      secretStoreName: external-secret-store
      hosts:
        - 'myassist.ctk.au.deloitte.com'

pods:
  librechat:
    replicas: 3
    securityContext:
      fsGroup: 1000
    initContainers:
      llm-gateway-proxy:
        restartPolicy: Always
        image:
          repository: 'tt-librechat/llm-gateway-proxy'
          pullPolicy: Always
          tag: 'main'
        env:
          TOKEN_PROXY_AZURE_AU_URL: 'http://azure-aus-east.llm-gateway-prd.svc.cluster.local:8080'
          TOKEN_PROXY_AZURE_US_URL: 'http://azure-eastus.llm-gateway-prd.svc.cluster.local:8080'
          TOKEN_PROXY_VERTEXAI_URL: 'http://vertexai-us-central1.llm-gateway-prd.svc.cluster.local:8080'
          TOKEN_PROXY_ANTHROPIC_URL: 'http://anthropic-eastus2.llm-gateway-prd.svc.cluster.local:8080'
          TOKEN_PROXY_MCP_URL: 'https://mcp-gateway.ctk.au.deloitte.com/mcp'
    containers:
      librechat:
        command:
          - /bin/sh
          - -c
          - >-
            mkdir -p /app/client/dist/assets && if [ -d /app/deloitte/assets ]; then
              cp -a /app/deloitte/assets/. /app/client/dist/assets/;
            elif [ -d /app/deloitte-assets ]; then
              cp -a /app/deloitte-assets/. /app/client/dist/assets/;
            fi && exec npm run backend
        image:
          tag: 'main'
        env:
          ADMIN_PANEL_URL: 'https://myassist-admin-panel.ctk.au.deloitte.com'
          ANTHROPIC_API_KEY: 'dummy' #anthropic API key set to dummy due to proxy
          ANTHROPIC_MODELS: 'claude-sonnet-4-5,claude-opus-4-5,claude-haiku-4-5,claude-sonnet-4-6,claude-opus-4-6,claude-opus-4-7'
          ANTHROPIC_REVERSE_PROXY: 'http://127.0.0.1:8081/anthropic'
          APP_TITLE: 'MyAssist 2.0'
          BASE_URL_AZURE_AU: 'http://127.0.0.1:8081/azure-au'
          BASE_URL_AZURE_US: 'http://127.0.0.1:8081/azure-us'
          BASE_URL_VERTEXAI: 'http://127.0.0.1:8081/vertexai'
          CUSTOM_FOOTER: '💬 Feedback? Submit a bug report or feature request here: https://forms.cloud.microsoft/e/E9AyvN4Ayx'
          DOMAIN_CLIENT: 'https://myassist.ctk.au.deloitte.com'
          DOMAIN_SERVER: 'https://myassist.ctk.au.deloitte.com'
          EMBEDDINGS_MODEL: 'text-embedding-3-small'
          EMBEDDINGS_PROVIDER: 'azure'
          ENDPOINTS: 'agents,anthropic,custom'
          KEY_VAULT_NAME: 'kv-int-librechat-prd'
          MCP_GATEWAY_OBO_SCOPE: 'api://32e2a3a5-ad52-446e-8a61-5a7ad6103099/access_as_user'
          MCP_GATEWAY_TOOLSETS: 'teams,research,news,kx,desc,gims'
          MCP_GATEWAY_URL: 'https://mcp-gateway.ctk.au.deloitte.com/mcp'
          MONGO_DB: 'mdb-librechat-database-prd'
          NODE_ENV: 'production'
          NODE_TLS_REJECT_UNAUTHORIZED: '0' # TODO: Review Node TLS setup. See: https://github.com/Deloitte-Australia/tt-librechat/issues/159
          OPENID_CLIENT_ID: 'b5494d82-9ae5-449e-8867-6804ccc2f5ef' # This is the Azure Client ID in Deloitte App Reg
          OPENID_ISSUER: 'https://login.microsoftonline.com/36da45f1-dd2c-4d1f-af13-5abe46b99921/v2.0/'
          OPENID_ON_BEHALF_FLOW_FOR_USERINFO_REQUIRED: 'true'
          OPENID_ON_BEHALF_FLOW_USERINFO_SCOPE: 'user.read'
          OPENID_REQUIRED_ROLE: ''
          OPENID_REUSE_TOKENS: 'true'
          OPENID_SCOPE: 'openid profile email offline_access https://myassist.ctk.au.deloitte.com/access_user'
          RAG_API_URL: 'http://127.0.0.1:8000'
          RAG_AZURE_OPENAI_API_VERSION: '2024-10-21'
          RAG_AZURE_OPENAI_ENDPOINT: 'https://dttau-myassist-prd-models-openai-aueast.openai.azure.com/' # TODO: Confirm in use
          RAG_OPENAI_BASEURL: 'http://127.0.0.1:8081/azure-au'
          RAG_PORT: '8000'
          RAG_USE_FULL_CONTEXT: 'true'
          # ClearTrack Code Interpreter (ea-code-runtime)
          LIBRECHAT_CODE_BASEURL: 'https://code-runtime.ctk.au.deloitte.com/v1' # TODO: Confirm
          CODEAPI_AUTH_PROVIDER: 'librechat-jwt'
          CODEAPI_JWT_ALGORITHM: 'EdDSA'
          CODEAPI_JWT_KID: 'lc-codeapi-prd-2026-05' # TODO: Confirm
          CODEAPI_JWT_ISSUER: 'librechat'
          CODEAPI_JWT_AUDIENCE: 'codeapi'
          CODEAPI_JWT_TTL_SECONDS: '300'
          CODEAPI_JWT_MINT_CACHE_SECONDS: '30'
          CODEAPI_JWT_SINGLE_TENANT_ID: 'legacy'
          # Azure Storage Container
          AZURE_CLIENT_ID: '1e6fa20b-2e41-4ae9-9357-171d834bb3b7' # Retrieved by asking Spark Bot for the Client ID (Application ID) of the managed identity named id-int-librechat-prd
          AZURE_STORAGE_ACCOUNT_NAME: 'stctspokeprdshared'
          AZURE_STORAGE_PUBLIC_ACCESS: 'false'
          AZURE_CONTAINER_NAME: 'stc-librechat-app-prd'
          #Langfuse Observability
          LANGFUSE_BASE_URL: 'https://langfuse.ctk.au.deloitte.com'
          # OpenTelemetry Tracing
          OTEL_TRACING_ENABLED: 'true'
          OTEL_TRACES_SAMPLER_ARG: '1.0'
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: 'https://managed-ai-ctspoke-npd-dce-95rn.australiaeast-1.ingest.monitor.azure.com/dataCollectionRules/dcr-3991725585f24a5eabd0d6aa283d0e18/streams/Microsoft-OTLP-Traces/otlp/v1/traces' # TODO: Confirm
          # Azure Monitor DCR only accepts OTLP/HTTP+protobuf
          OTEL_EXPORTER_OTLP_PROTOCOL: 'http/protobuf'
          # Wrap the OTLP exporter with an Azure AD bearer-token headers factory (managed identity via AZURE_CLIENT_ID)
          AZURE_MONITOR_AUTH_ENABLED: 'true'
          # Logging for debugging
          OTEL_LOG_LEVEL: 'DEBUG'
          OTEL_IOREDIS_TRACING_ENABLED: 'true'
          DEBUG_LOGGING: 'true'
          DEBUG_CONSOLE: 'true'
          AGENT_DEBUG_LOGGING: 'true'
        secrets:
          AZURE_API_KEY: librechat-azure-api-key # TODO: Can we delete?
          MONGO_URI: librechat-mdb-connection-string # TODO: Update this value when returned by Biplab
          JWT_SECRET: librechat-jwt-secret # Use LibreChat Credentials Generator
          JWT_REFRESH_SECRET: librechat-jwt-refresh-secret # Use LibreChat Credentials Generator
          CREDS_KEY: librechat-creds-key # Use LibreChat Credentials Generator
          CREDS_IV: librechat-creds-iv # Use LibreChat Credentials Generator
          OPENID_CLIENT_SECRET: librechat-openid-client-secret # Generate a secret in App Reg and store the "hint" here
          OPENID_SESSION_SECRET: librechat-openid-session-secret # Generate a random string
          RAG_AZURE_OPENAI_API_KEY: librechat-azure-api-key # TODO: Can we delete?
          MEILI_MASTER_KEY: librechat-meili-master-key # Use LibreChat Credentials Generator
          # ClearTrack Code Interpreter (ea-code-runtime) — JWK signing key
          CODEAPI_JWT_PRIVATE_JWK_JSON: librechat-codeapi-jwt-private-jwk
          #Langfuse Observability
          LANGFUSE_PUBLIC_KEY: librechat-langfuse-public-key # TODO: Need to deploy to langfuse to prod first, then create an API in the frontend.
          LANGFUSE_SECRET_KEY: librechat-langfuse-secret-key # TODO: Need to deploy to langfuse to prod first, then create an API in the frontend.
      rag-api:
        image:
          repository: 'tt-librechat/rag-api'
          pullPolicy: Always
          tag: 'main'
        env:
          PGVECTOR_CREATE_EXTENSION: 'False'
          VECTOR_DB_TYPE: 'pgvector'
          POSTGRES_USE_UNIX_SOCKET: 'False'
          POSTGRES_DB: 'pgdb_librechat_app_prd'
          POSTGRES_USER: 'id-int-librechat-prd'
          POSTGRES_AUTH_TYPE: 'ActiveDirectoryMsi'
          MANAGED_IDENTITY_CLIENT_ID: '1e6fa20b-2e41-4ae9-9357-171d834bb3b7' # Retrieved by asking Spark Bot for the Client ID (Application ID) of the managed identity named id-int-librechat-prd
          DB_HOST: 'psql-ctspoke-prd.postgres.database.azure.com'
          DB_PORT: '5432'
          RAG_HOST: '0.0.0.0'
          RAG_PORT: '8000'
          EMBEDDINGS_PROVIDER: 'azure'
          RAG_AZURE_OPENAI_API_VERSION: '2024-10-21'
          RAG_AZURE_OPENAI_ENDPOINT: 'https://dttau-myassist-uat-models-openai-aueast.openai.azure.com/' # TODO: Confirm in use
          RAG_OPENAI_BASEURL: 'http://127.0.0.1:8081/azure-au'
        secrets:
          AZURE_OPENAI_API_KEY: librechat-azure-api-key # TODO: Can we delete?
          RAG_AZURE_OPENAI_API_KEY: librechat-azure-api-key # TODO: Can we delete?
          JWT_SECRET: librechat-jwt-secret
        service:
          enabled: true
          type: ClusterIP
          port: 8000
          targetPort: 8000
        ingress:
          enabled: false
      meilisearch:
        image:
          pullPolicy: Always
          tag: 'main'
        env:
          MEILI_ENV: 'production'
        secrets:
          MEILI_MASTER_KEY: librechat-meili-master-key
        persistence:
          enabled: true
          size: 10Gi
          accessModes:
            - ReadWriteOnce
          name: 'meilisearch-data'
          mountPath: /meili_data
          storageClass: 'managed-csi-standard-private'

valkey:
  image:
    tag: 'main'
  persistence:
    storageClass: 'managed-csi-standard-private'
  passwordSecretName: 'librechat-valkey-password'
