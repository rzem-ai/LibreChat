imageRegistry: 'dttaitsprd.azurecr.io'
branch: 'main'

serviceAccount:
  name: sa-librechat-prd

ingress:
  className: cilium
  host: 'myassist.ctk.au.deloitte.com'
  annotations:
    ingress.cilium.io/loadbalancer-mode: "shared"
    ingress.cilium.io/force-https: "true"
    kubernetes.io/ingress.class: cilium
  tls:
    - secretName: ctk-au-deloitte-com
      secretStoreName: external-secret-store
      hosts:
        - 'myassist.ctk.au.deloitte.com'

pods:
  librechat:
    replicas: 3
    securityContext:
      fsGroup: 1000
    initContainers:
      llm-gateway-proxy:
        restartPolicy: Always
        image:
          repository: 'tt-librechat/llm-gateway-proxy'
          pullPolicy: Always
          tag: 'main'
        env:
          TOKEN_PROXY_AZURE_AU_URL: 'http://azure-aus-east.llm-gateway-ctnp.svc.cluster.local:8080' # TODO: update
          TOKEN_PROXY_AZURE_US_URL: 'http://azure-eastus.llm-gateway-ctnp.svc.cluster.local:8080' # TODO: update
          TOKEN_PROXY_VERTEXAI_URL: 'http://vertexai-us-central1.llm-gateway-ctnp.svc.cluster.local:8080' # TODO: update
          TOKEN_PROXY_ANTHROPIC_URL: 'http://anthropic-eastus2.llm-gateway-ctnp.svc.cluster.local:8080' # TODO: update
          TOKEN_PROXY_MCP_URL: 'https://mcp-gw-dev.ctk.au.deloitte.com/mcp' # TODO: update
    containers:
      librechat:
        command:
          - /bin/sh
          - -c
          - >-
            mkdir -p /app/client/dist/assets && if [ -d /app/deloitte/assets ]; then
              cp -a /app/deloitte/assets/. /app/client/dist/assets/;
            elif [ -d /app/deloitte-assets ]; then
              cp -a /app/deloitte-assets/. /app/client/dist/assets/;
            fi && exec npm run backend
        image:
          tag: 'main'
        env:
          ADMIN_PANEL_URL: 'https://myassist-admin-panel.ctk.au.deloitte.com'
          ANTHROPIC_API_KEY: 'dummy' #anthropic API key set to dummy due to proxy
          ANTHROPIC_MODELS: 'claude-sonnet-4-5,claude-opus-4-5,claude-haiku-4-5,claude-sonnet-4-6,claude-opus-4-6,claude-opus-4-7'
          ANTHROPIC_REVERSE_PROXY: 'http://127.0.0.1:8081/anthropic'
          APP_TITLE: 'MyAssist 2.0'
          BASE_URL_AZURE_AU: 'http://127.0.0.1:8081/azure-au'
          BASE_URL_AZURE_US: 'http://127.0.0.1:8081/azure-us'
          BASE_URL_VERTEXAI: 'http://127.0.0.1:8081/vertexai'
          CUSTOM_FOOTER: '💬 Feedback? Submit a bug report or feature request here: https://forms.cloud.microsoft/e/E9AyvN4Ayx'
          DOMAIN_CLIENT: 'https://myassist.ctk.au.deloitte.com'
          DOMAIN_SERVER: 'https://myassist.ctk.au.deloitte.com'
          EMBEDDINGS_MODEL: 'text-embedding-3-small'
          EMBEDDINGS_PROVIDER: 'azure'
          ENDPOINTS: 'agents,anthropic,custom'
          KEY_VAULT_NAME: 'kv-int-librechat-uat' # TODO: Confirm
          MCP_GATEWAY_OBO_SCOPE: 'api://3e5d28f1-91a3-4748-ad73-5fa544f1d3e2/access_as_user' # TODO: Confirm
          MCP_GATEWAY_TOOLSETS: 'teams,research,news,kx,desc,gims'
          MCP_GATEWAY_URL: 'https://mcp-gw-dev.ctk.au.deloitte.com/mcp' # TODO: Confirm
          MONGO_DB: 'mdb-librechat-database-uat' # TODO: Confirm
          NODE_ENV: 'production'
          NODE_TLS_REJECT_UNAUTHORIZED: '0' # TODO: Review Node TLS setup. See: https://github.com/Deloitte-Australia/tt-librechat/issues/159
          OPENID_CLIENT_ID: '66cc6e2e-670a-47c9-a362-94c86c46782a' # This is the Azure Client ID in Deloitte App Reg # TODO: Confirm
          OPENID_ISSUER: 'https://login.microsoftonline.com/36da45f1-dd2c-4d1f-af13-5abe46b99921/v2.0/' # TODO: Confirm
          OPENID_ON_BEHALF_FLOW_FOR_USERINFO_REQUIRED: 'true'
          OPENID_ON_BEHALF_FLOW_USERINFO_SCOPE: 'user.read'
          OPENID_REQUIRED_ROLE: ''
          OPENID_REUSE_TOKENS: 'true'
          OPENID_SCOPE: 'openid profile email offline_access https://myassist.ctk.au.deloitte.com/access_user'
          RAG_API_URL: 'http://127.0.0.1:8000'
          RAG_AZURE_OPENAI_API_VERSION: '2024-10-21'
          RAG_AZURE_OPENAI_ENDPOINT: 'https://dttau-myassist-uat-models-openai-aueast.openai.azure.com/' # TODO: Confirm
          RAG_OPENAI_BASEURL: 'http://127.0.0.1:8081/azure-au'
          RAG_PORT: '8000'
          RAG_USE_FULL_CONTEXT: 'true'
          # ClearTrack Code Interpreter (ea-code-runtime)
          LIBRECHAT_CODE_BASEURL: 'https://code-runtime-uat.ctk.au.deloitte.com/v1' # TODO: Confirm
          CODEAPI_AUTH_PROVIDER: 'librechat-jwt'
          CODEAPI_JWT_ALGORITHM: 'EdDSA'
          CODEAPI_JWT_KID: 'lc-codeapi-uat-2026-05' # TODO: Confirm
          CODEAPI_JWT_ISSUER: 'librechat'
          CODEAPI_JWT_AUDIENCE: 'codeapi'
          CODEAPI_JWT_TTL_SECONDS: '300'
          CODEAPI_JWT_MINT_CACHE_SECONDS: '30'
          CODEAPI_JWT_SINGLE_TENANT_ID: 'legacy'
          # Azure Storage Container
          AZURE_CLIENT_ID: '6fbe2a73-4566-43e3-a7f3-66276353afc3' # Retrieved by asking Spark Bot for the Client ID (Application ID) of the managed identity named id-int-librechat-uat # TODO: Confirm
          AZURE_STORAGE_ACCOUNT_NAME: 'stctspokenpdshared' # TODO: Confirm
          AZURE_STORAGE_PUBLIC_ACCESS: 'false'
          AZURE_CONTAINER_NAME: 'stc-librechat-app-uat' # TODO: Confirm
          #Langfuse Observability
          LANGFUSE_BASE_URL: 'https://langfuse.ctk.au.deloitte.com'
          # OpenTelemetry Tracing
          OTEL_TRACING_ENABLED: 'true'
          OTEL_TRACES_SAMPLER_ARG: '1.0'
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: 'https://managed-ai-ctspoke-npd-dce-95rn.australiaeast-1.ingest.monitor.azure.com/dataCollectionRules/dcr-3991725585f24a5eabd0d6aa283d0e18/streams/Microsoft-OTLP-Traces/otlp/v1/traces' # TODO: Confirm
          # Azure Monitor DCR only accepts OTLP/HTTP+protobuf
          OTEL_EXPORTER_OTLP_PROTOCOL: 'http/protobuf'
          # Wrap the OTLP exporter with an Azure AD bearer-token headers factory (managed identity via AZURE_CLIENT_ID)
          AZURE_MONITOR_AUTH_ENABLED: 'true'
          # Logging for debugging
          OTEL_LOG_LEVEL: 'DEBUG'
          OTEL_IOREDIS_TRACING_ENABLED: 'true'
          DEBUG_LOGGING: 'true'
          DEBUG_CONSOLE: 'true'
          AGENT_DEBUG_LOGGING: 'true'
        secrets: # TODO: Create all secrets
          AZURE_API_KEY: librechat-azure-api-key
          MONGO_URI: librechat-uat-mdb-connection-string
          JWT_SECRET: librechat-jwt-secret-uat
          JWT_REFRESH_SECRET: librechat-jwt-refresh-secret-uat
          CREDS_KEY: librechat-creds-key-uat
          CREDS_IV: librechat-creds-iv-uat
          OPENID_CLIENT_SECRET: librechat-openid-client-secret-uat
          OPENID_SESSION_SECRET: librechat-openid-session-secret-uat
          RAG_AZURE_OPENAI_API_KEY: librechat-azure-api-key
          MEILI_MASTER_KEY: librechat-meili-master-key-uat
          # ClearTrack Code Interpreter (ea-code-runtime) — JWK signing key
          CODEAPI_JWT_PRIVATE_JWK_JSON: librechat-codeapi-jwt-private-jwk-uat
          #Langfuse Observability
          LANGFUSE_PUBLIC_KEY: librechat-langfuse-public-key-uat
          LANGFUSE_SECRET_KEY: librechat-langfuse-secret-key-uat
      rag-api:
        image:
          repository: 'tt-librechat/rag-api'
          pullPolicy: Always
          tag: 'uat'
        env:
          PGVECTOR_CREATE_EXTENSION: 'False'
          VECTOR_DB_TYPE: 'pgvector'
          POSTGRES_USE_UNIX_SOCKET: 'False'
          POSTGRES_DB: 'pgdb_librechat_app_uat' # TODO: Confirm
          POSTGRES_USER: 'id-int-librechat-uat' # TODO: Confirm
          POSTGRES_AUTH_TYPE: 'ActiveDirectoryMsi'
          MANAGED_IDENTITY_CLIENT_ID: '6fbe2a73-4566-43e3-a7f3-66276353afc3' # Retrieved by asking Spark Bot for the Client ID (Application ID) of the managed identity named id-int-librechat-uat # TODO: Confirm
          DB_HOST: 'psql-ctspoke-npd.postgres.database.azure.com' # TODO: Confirm
          DB_PORT: '5432'
          RAG_HOST: '0.0.0.0'
          RAG_PORT: '8000'
          EMBEDDINGS_PROVIDER: 'azure'
          RAG_AZURE_OPENAI_API_VERSION: '2024-10-21'
          RAG_AZURE_OPENAI_ENDPOINT: 'https://dttau-myassist-uat-models-openai-aueast.openai.azure.com/' # TODO: Confirm
          RAG_OPENAI_BASEURL: 'http://127.0.0.1:8081/azure-au'
        secrets: # TODO: Create all secrets
          AZURE_OPENAI_API_KEY: librechat-azure-api-key
          RAG_AZURE_OPENAI_API_KEY: librechat-azure-api-key
          JWT_SECRET: librechat-jwt-secret-uat
        service:
          enabled: true
          type: ClusterIP
          port: 8000
          targetPort: 8000
        ingress:
          enabled: false
      meilisearch:
        image:
          pullPolicy: Always
          tag: 'uat'
        env:
          MEILI_ENV: 'production' # Use production to mimic PROD environment behaviour
        secrets:
          MEILI_MASTER_KEY: librechat-meili-master-key-uat # TODO: Create all secrets
        persistence:
          enabled: true
          size: 10Gi
          accessModes:
            - ReadWriteOnce
          name: 'meilisearch-data'
          mountPath: /meili_data
          storageClass: 'managed-csi-standard-private'

valkey:
  image:
    tag: 'main'
  persistence:
    storageClass: 'managed-csi-standard-private'
  passwordSecretName: 'librechat-valkey-password-main'# TODO: Create all secrets
