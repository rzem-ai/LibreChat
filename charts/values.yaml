imageRegistry: 'dttaitsprd.azurecr.io'
branch: ''

serviceAccount:
  name: sa-librechat-prd

ingress:
  className: cilium
  host: 'librechat.ctk.au.deloitte.com'
  annotations:
    ingress.cilium.io/loadbalancer-mode: "shared"
    ingress.cilium.io/force-https: "true"
    kubernetes.io/ingress.class: cilium
  tls:
    - secretName: ctk-au-deloitte-com
      secretStoreName: external-secret-store
      hosts:
        - 'librechat.ctk.au.deloitte.com'

image:
  repository: 'tt-librechat/librechat'
  pullPolicy: Always
  tag: 'main'

pods:
  librechat:
    replicas: 1
    containers:
      librechat:
        command:
          - /bin/sh
          - -c
          - exec npm run backend
        livenessProbe:
          httpGet:
            path: /health
            port: 3080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        image:
          repository: 'tt-librechat/librechat'
          pullPolicy: Always
          tag: 'main'
        containerSecurityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        # Runtime env vars — non-sensitive values here, secrets via External Secrets
        env:
          HOST: '0.0.0.0'
          PORT: '3080'
          NODE_ENV: 'production'
          ALLOW_EMAIL_LOGIN: 'false'
          ALLOW_REGISTRATION: 'false'
          ALLOW_SOCIAL_LOGIN: 'true'
          ALLOW_SOCIAL_REGISTRATION: 'false'
          OPENID_SCOPE: 'openid profile email'
          OPENID_CALLBACK_URL: '/oauth/openid/callback'
          OPENID_REQUIRED_ROLE_TOKEN_KIND: 'id'
          OPENID_USE_END_SESSION_ENDPOINT: 'true'
          OPENID_BUTTON_LABEL: 'Login with SSO'
          OPENID_IMAGE_URL: '/assets/favicon.svg'
          BASE_URL_AZURE_AU: 'http://127.0.0.1:8081/azure-au'
          BASE_URL_AZURE_US: 'http://127.0.0.1:8081/azure-us'
          BASE_URL_VERTEXAI: 'http://127.0.0.1:8081/vertexai'
          MCP_GATEWAY_URL: 'http://127.0.0.1:8081/mcp'
          MCP_GATEWAY_DOMAIN: '127.0.0.1'
          MCP_GATEWAY_DOMAIN_FALLBACK: 'localhost'
        service:
          enabled: true
          type: ClusterIP
          port: 80
          targetPort: 3080
        ingress:
          enabled: true
          paths:
            - path: /
              pathType: Prefix
      proxy:
        mountLibrechatConfig: false
        command:
          - /bin/sh
          - /etc/nginx/templates/proxy.sh
        image:
          registry: 'docker.io'
          repository: 'nginx'
          pullPolicy: Always
          tag: '1.29-alpine'
        livenessProbe:
          httpGet:
            path: /live
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        containerSecurityContext:
          runAsUser: 101
          runAsGroup: 101
          allowPrivilegeEscalation: false
        env:
          TOKEN_FILE_PATH: '/var/run/secrets/kubernetes.io/serviceaccount/token'
          TOKEN_PROXY_NGINX_PID_PATH: '/tmp/nginx/nginx.pid'
          TOKEN_PROXY_AZURE_AU_URL: 'http://azure-aus-east.llm-gateway-ctnp.svc.cluster.local:8080'
          TOKEN_PROXY_AZURE_US_URL: 'http://azure-eastus.llm-gateway-ctnp.svc.cluster.local:8080'
          TOKEN_PROXY_VERTEXAI_URL: 'http://vertexai-us-central1.llm-gateway-ctnp.svc.cluster.local:8080'
          TOKEN_PROXY_MCP_URL: 'https://mcp-gateway-uat.ctk.au.deloitte.com/mcp'
          TOKEN_PROXY_SYNC_SECONDS: '30'
        volumeMounts:
          - name: librechat-config
            mountPath: /etc/nginx/templates/proxy.conf
            subPath: proxy.conf
            readOnly: true
          - name: librechat-config
            mountPath: /etc/nginx/templates/proxy.sh
            subPath: proxy.sh
            readOnly: true
          - name: proxy-confd
            mountPath: /etc/nginx/conf.d
          - name: proxy-cache
            mountPath: /tmp/nginx
