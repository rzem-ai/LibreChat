imageRegistry: 'dttaitsprd.azurecr.io'
branch: ''

serviceAccount:
  name: sa-librechat-prd

ingress:
  className: cilium
  host: 'librechat.ctk.au.deloitte.com'
  annotations:
    ingress.cilium.io/loadbalancer-mode: "shared"
    ingress.cilium.io/force-https: "true"
    kubernetes.io/ingress.class: cilium
  tls:
    - secretName: ctk-au-deloitte-com
      secretStoreName: external-secret-store
      hosts:
        - 'librechat.ctk.au.deloitte.com'

image:
  repository: 'tt-librechat/librechat'
  pullPolicy: Always
  tag: 'main'

pods:
  librechat:
    replicas: 1
    containers:
      librechat:
        command:
          - /bin/sh
          - -c
          - exec npm run backend
        livenessProbe:
          httpGet:
            path: /health
            port: 3080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        image:
          repository: 'tt-librechat/librechat'
          pullPolicy: Always
          tag: 'main'
        containerSecurityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        # Runtime env vars — non-sensitive values here, secrets via External Secrets
        env:
          HOST: '0.0.0.0'
          PORT: '3080'
          NODE_ENV: 'production'
          ALLOW_EMAIL_LOGIN: 'false'
          ALLOW_REGISTRATION: 'false'
          ALLOW_SOCIAL_LOGIN: 'true'
          ALLOW_SOCIAL_REGISTRATION: 'false'
          APP_TITLE: 'MyAssist'
          HELP_AND_FAQ_URL: 'https://forms.cloud.microsoft/e/E9AyvN4Ayx'
          OPENID_CALLBACK_URL: '/oauth/openid/callback'
          OPENID_GRAPH_SCOPES: 'User.Read,User.ReadBasic.All' #People.Read GroupMember.Read.All scopes to be added once App Registration admins grant them to us
          OPENID_ON_BEHALF_FLOW_FOR_USERINFO_REQUIRED: 'true'
          OPENID_ON_BEHALF_FLOW_USERINFO_SCOPE: 'user.read'
          OPENID_REQUIRED_ROLE_TOKEN_KIND: 'id'
          OPENID_REUSE_TOKENS: 'true'
          # 86400000 ms = 24 hours - standardise token expiry for login and MCP OBO
          OPENID_REUSE_MAX_SESSION_AGE_MS: '86400000'
          SESSION_EXPIRY: '86400000'
          REFRESH_TOKEN_EXPIRY: '86400000'
          OPENID_USE_END_SESSION_ENDPOINT: 'true'
          OPENID_BUTTON_LABEL: 'Continue with SSO'
          OPENID_IMAGE_URL: '/assets/favicon.svg'
          MODEL_PRICING_MIN_MULTIPLIER: '0.1'
          MODEL_PRICING_MULTIPLIER_ROUNDING_INCREMENT: '0.1'
          MODEL_PRICING_REFERENCE_MODEL_ID: 'gpt-56-luna'
          RAG_API_URL: 'http://127.0.0.1:8000'
          RAG_USE_FULL_CONTEXT: 'false'
          # Deloitte Custom Change: bounds memory use for the trusted-tool attachment
          # upload feature. Max bytes read into memory + base64-encoded for a trusted
          # MCP attachment upload tool (e.g. SharePoint's sp_upload_file). Default
          # matches the app's own built-in default (7 MiB) — override per-environment as needed.
          MCP_ATTACHMENT_UPLOAD_MAX_BYTES: '7340032'
          USE_ENTRA_ID_FOR_PEOPLE_SEARCH: 'true'
          ENTRA_ID_INCLUDE_OWNERS_AS_MEMBERS: 'true'
          # OpenTelemetry Tracing
          OTEL_SERVICE_NAME: 'librechat'
          OTEL_TRACES_EXPORTER: 'otlp'
          # Only traces are exported; disable NodeSDK default metrics/logs pipelines.
          OTEL_METRICS_EXPORTER: 'none'
          OTEL_LOGS_EXPORTER: 'none'
          OTEL_EXPORTER_OTLP_PROTOCOL: 'http/protobuf'
          OTEL_TRACES_SAMPLER: 'parentbased_traceidratio'
          OTEL_TRACES_SAMPLER_ARG: '0.1'
          # Meilisearch Configuration # TODO: Enable meilisearch when we can have multi-container PVC
          SEARCH: 'false'
          # MEILI_NO_ANALYTICS: 'true'
          # MEILI_HOST: 'http://127.0.0.1:7700'
        service:
          enabled: true
          type: ClusterIP
          port: 80
          targetPort: 3080
        ingress:
          enabled: true
          paths:
            - path: /
              pathType: Prefix
      rag-api:
        image:
          repository: 'tt-librechat/rag-api'
          pullPolicy: Always
          tag: 'main'
        service:
          enabled: true
          type: ClusterIP
          port: 8000
          targetPort: 8000
        ingress:
          enabled: false
      # meilisearch: # TODO: Enable meilisearch when we can have multi-container PVC
      #   image:
      #     repository: 'tt-librechat/meilisearch'
      #     pullPolicy: Always
      #     tag: 'main'
      #   env:
      #     MEILI_NO_ANALYTICS: 'true'
      #     MEILI_HOST: '127.0.0.0:7700'
      #   service:
      #     enabled: false
      #     type: ClusterIP
      #     port: 7700
      #     targetPort: 7700
      #   ingress:
      #     enabled: false

# In-cluster Valkey (Redis-compatible). StatefulSet with AOF persistence
# and a PVC in charts/templates/valkey.yaml. Valkey is a drop-in Redis
# replacement -- LibreChat's ioredis clients work unchanged.
valkey:
  image:
    repository: 'tt-librechat/valkey'
    pullPolicy: Always
    tag: 'main'
  port: 6379
  persistence:
    size: 5Gi
    storageClass: ''
  passwordSecretName: 'librechat-valkey-password-prd'
