imageRegistry: 'dttaitsprd.azurecr.io'
branch: ''

serviceAccount:
  name: sa-librechat-prd

ingress:
  className: cilium
  host: 'librechat.ctk.au.deloitte.com'
  annotations:
    ingress.cilium.io/loadbalancer-mode: "shared"
    ingress.cilium.io/force-https: "true"
    kubernetes.io/ingress.class: cilium
  tls:
    - secretName: ctk-au-deloitte-com
      secretStoreName: external-secret-store
      hosts:
        - 'librechat.ctk.au.deloitte.com'

image:
  repository: 'tt-librechat/librechat'
  pullPolicy: Always
  tag: 'main'

pods:
  librechat:
    replicas: 1
    containers:
      librechat:
        command:
          - /bin/sh
          - -c
          - exec npm run backend
        livenessProbe:
          httpGet:
            path: /health
            port: 3080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        image:
          repository: 'tt-librechat/librechat'
          pullPolicy: Always
          tag: 'main'
        containerSecurityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        # Runtime env vars — non-sensitive values here, secrets via External Secrets
        env:
          HOST: '0.0.0.0'
          PORT: '3080'
          NODE_ENV: 'production'
          ALLOW_EMAIL_LOGIN: 'false'
          ALLOW_REGISTRATION: 'false'
          ALLOW_SOCIAL_LOGIN: 'true'
          ALLOW_SOCIAL_REGISTRATION: 'false'
          # OpenID Token Reuse Configuration
          OPENID_REUSE_TOKENS: 'true'
          OPENID_SCOPE: 'api://librechat/.default openid profile email offline_access'
          # OPENID_REUSE_MAX_SESSION_AGE_MS is not currently read from env (server uses a hard-coded 15m bound)
          # Caching Configuration
          OPENID_JWKS_URL_CACHE_ENABLED: 'true'
          OPENID_JWKS_URL_CACHE_TIME: '600000'  # 10 minutes in milliseconds
          # Azure-specific Configuration
          OPENID_ON_BEHALF_FLOW_FOR_USERINFO_REQUIRED: 'true'
          OPENID_ON_BEHALF_FLOW_USERINFO_SCOPE: 'user.read'
          # Logout Configuration
          OPENID_USE_END_SESSION_ENDPOINT: 'true'
          # Other
          OPENID_CALLBACK_URL: '/oauth/openid/callback'
          OPENID_REQUIRED_ROLE_TOKEN_KIND: 'id'
          OPENID_BUTTON_LABEL: 'Login with SSO'
          OPENID_IMAGE_URL: '/assets/favicon.svg'
        service:
          enabled: true
          type: ClusterIP
          port: 80
          targetPort: 3080
        ingress:
          enabled: true
          paths:
            - path: /
              pathType: Prefix
