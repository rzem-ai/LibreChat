imageRegistry: 'dttaitsprd.azurecr.io'
branch: ''

serviceAccount:
  name: sa-librechat-prd

ingress:
  className: cilium
  host: 'librechat.ctk.au.deloitte.com'
  annotations:
    ingress.cilium.io/loadbalancer-mode: "shared"
    ingress.cilium.io/force-https: "true"
    kubernetes.io/ingress.class: cilium
  tls:
    - secretName: ctk-au-deloitte-com
      secretStoreName: external-secret-store
      hosts:
        - 'librechat.ctk.au.deloitte.com'

image:
  repository: 'tt-librechat/librechat'
  pullPolicy: Always
  tag: 'main'

pods:
  librechat:
    replicas: 1
    containers:
      librechat:
        command:
          - /bin/sh
          - -c
          - export LLM_GATEWAY_X_SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" && exec npm run backend
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        image:
          repository: 'tt-librechat/librechat'
          pullPolicy: Always
          tag: 'main'
        containerSecurityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        # Runtime env vars — non-sensitive values here, secrets via External Secrets
        env:
          HOST: '0.0.0.0'
          PORT: '3080'
          NODE_ENV: 'production'
        service:
          enabled: true
          type: ClusterIP
          port: 80
          targetPort: 3080
        ingress:
          enabled: true
          paths:
            - path: /
              pathType: Prefix
