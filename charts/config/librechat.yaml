version: 1.3.9
cache: true

interface:
  agents:
    use: true
    create: true
    share: false
    public: false

endpoints:
  # ========================================
  # Built-in Anthropic (via nginx proxy)
  # Region: US (eastus2)
  # ========================================
  agents:
    recursionLimit: 25
    maxRecursionLimit: 50
    disableBuilder: false
    capabilities: ["deferred_tools", "execute_code", "file_search", "actions", "tools"]

  anthropic:
    streamRate: 25
    titleConvo: true
    titleModel: "claude-haiku-4-5"
    titleMethod: "completion"

  # ========================================
  # Custom endpoints (OpenAI-compatible format)
  # ========================================
  custom:
    # --- Azure AU (aus-east) ---
    - name: "Azure AU"
      apiKey: "dummy"
      baseURL: "${BASE_URL_AZURE_AU}"
      models:
        default:
          - "gpt-4o-mini"
          - "gpt-4o"
          - "gpt-41"
          - "gpt-41-nano"
          - "gpt-41-mini"
        fetch: false
      titleConvo: true
      titleModel: "gpt-4o-mini"
      modelDisplayLabel: "Azure AU"
      dropParams: ["stop", "user", "frequency_penalty", "presence_penalty"]
      headers:
        Content-Type: "application/json"

    # --- Azure US (eastus) ---
    - name: "Azure US"
      apiKey: "dummy"
      baseURL: "${BASE_URL_AZURE_US}"
      models:
        default:
          - "gpt-41"
          - "gpt-41-nano"
          - "gpt-41-mini"
          - "gpt-5-chat"
          - "gpt-5-mini"
          - "gpt-5-nano"
        fetch: false
      titleConvo: true
      titleModel: "gpt-41-mini"
      modelDisplayLabel: "Azure US"
      dropParams: ["stop", "user", "frequency_penalty", "presence_penalty"]
      headers:
        Content-Type: "application/json"

    # --- VertexAI / Google (us-central1) ---
    # OpenAI-compatible endpoint, model names use google/ prefix
    - name: "VertexAI"
      apiKey: "dummy"
      baseURL: "${BASE_URL_VERTEXAI}"
      models:
        default:
          - "google/gemini-2.5-flash"
          - "google/gemini-2.5-pro"
        fetch: false
      titleConvo: true
      titleModel: "google/gemini-2.5-flash"
      modelDisplayLabel: "VertexAI"
      dropParams: ["stop", "user", "frequency_penalty", "presence_penalty"]
      headers:
        Content-Type: "application/json"

mcpServers: # https://www.librechat.ai/docs/features/mcp
  cleartrack-gateway:
    type: streamable-http
    url: https://mcp-gateway-uat.ctk.au.deloitte.com/mcp
    headers:
      Authorization: "Bearer ${LLM_GATEWAY_LOCAL_IDENTITY_TOKEN_SESSION}"
    timeout: 3000

mcpSettings:
  allowedDomains:
    - mcp-gateway-uat.ctk.au.deloitte.com

speech: # https://www.librechat.ai/docs/configuration/librechat_yaml/object_structure/speech
  speechTab:
    conversationMode: true
    advancedMode: false
    speechToText: true
    textToSpeech: true
    # textToSpeech:
    #   engineTTS: "elevenlabs"
    #   voice: "Rachel"
    #   languageTTS: "en"
    #   automaticPlayback: false
    #   playbackRate: 1.0
    #   cacheTTS: true
  tts:
    elevenlabs:
      apiKey: '${TTS_API_KEY}'
      model: 'eleven_multilingual_v2'
      voices:
        - '5GZaeOOG7yqLdoTRsaa6'  # Rachel
        - 'DTLT09E2cxHF0DqjKVbc'  # Paul
        - 'aGkVQvWUZi16EH8aZJvT'  # Steve