version: 1.3.9
cache: true

interface:
  agents:
    use: true
    create: true
    share: false
    public: false

endpoints:
  # ========================================
  # Built-in Anthropic (via nginx proxy)
  # Region: US (eastus2)
  # ========================================
  agents:
    recursionLimit: 25
    maxRecursionLimit: 50
    disableBuilder: false
    capabilities: [ "deferred_tools", "execute_code", "file_search", "actions", "tools" ]

  anthropic:
    streamRate: 25
    titleConvo: true
    titleModel: "claude-haiku-4-5"
    titleMethod: "completion"

  azureOpenAI:
    titleModel: "gpt-5.1-2025-11-13"
    titleConvo: true
    summarize: true
    summaryModel: "gpt-5.1-2025-11-13"
    stream: true
    modelDisplayLabel: "Azure OpenAI"

    groups:
      - group: "azure-foundry-models"
        apiKey: '${AZURE_API_KEY}'
        instanceName: "dttau-myassist-uat-models-openai-aueast" # Derived from URL: https://dttau-myassist-uat-models-openai-aueast.openai.azure.com/
        version: "2025-01-01-preview"
        models:
          gpt-4.1-mini-2025-04-14:
            deploymentName: "gpt-4.1-mini-2025-04-14"
          gpt-4.1-2025-04-14:
            deploymentName: "gpt-4.1-2025-04-14"
          gpt-4.1-nano-2025-04-14:
            deploymentName: "gpt-4.1-nano-2025-04-14"
          gpt-4.1-nano-prompt-2025-04-14:
            deploymentName: "gpt-4.1-nano-prompt-2025-04-14"
          gpt-4o-2024-11-20:
            deploymentName: "gpt-4o-2024-11-20"
          gpt-4o-prompt-2024-11-20:
            deploymentName: "gpt-4o-prompt-2024-11-20"
          gpt-5.1-2025-11-13:
            deploymentName: "gpt-5.1-2025-11-13"
          gpt-5.2-2025-12-11:
            deploymentName: "gpt-5.2-2025-12-11"

  # ========================================
  # Custom endpoints (OpenAI-compatible format)
  # ========================================
  custom:
       # --- Azure AU (aus-east) ---
       - name: "Azure AU"
         apiKey: "dummy"
         baseURL: "${BASE_URL_AZURE_AU}"
         models:
           default:
             - "gpt-4o-mini"
             - "gpt-4o"
             - "gpt-41"
             - "gpt-41-nano"
             - "gpt-41-mini"
           fetch: false
         titleConvo: true
         titleModel: "gpt-4o-mini"
         modelDisplayLabel: "Azure AU"
         dropParams: ["stop", "user", "frequency_penalty", "presence_penalty"]
         headers:
           Content-Type: "application/json"
    
       # --- Azure US (eastus) ---
       - name: "Azure US"
         apiKey: "dummy"
         baseURL: "${BASE_URL_AZURE_US}"
         models:
           default:
             - "gpt-41"
             - "gpt-41-nano"
             - "gpt-41-mini"
             - "gpt-5-chat"
             - "gpt-5-mini"
             - "gpt-5-nano"
           fetch: false
         titleConvo: true
         titleModel: "gpt-41-mini"
         modelDisplayLabel: "Azure US"
         dropParams: ["stop", "user", "frequency_penalty", "presence_penalty"]
         headers:
           Content-Type: "application/json"

    # --- VertexAI / Google (us-central1) ---
    # OpenAI-compatible endpoint, model names use google/ prefix
    - name: "VertexAI US"
      apiKey: "dummy"
      baseURL: "${BASE_URL_VERTEXAI}"
      models:
        default:
          - "google/gemini-2.5-flash"
          - "google/gemini-2.5-pro"
        fetch: false
      titleConvo: true
      titleModel: "google/gemini-2.5-flash"
      modelDisplayLabel: "VertexAI US"
      dropParams: [ "stop", "user", "frequency_penalty", "presence_penalty" ]
      headers:
        Content-Type: "application/json"

mcpServers: # https://www.librechat.ai/docs/features/mcp
  cleartrack-gateway-new-appreg:
    # See documentation: https://github.com/Deloitte-Australia/ea-mcp-gateway/blob/feature/prototype/docs/MCP_Gateway_Wiki.md
    type: streamable-http
    url: https://mcp-gw-dev.ctk.au.deloitte.com/mcp
    oauth:
      authorization_url: https://mcp-gw-dev.ctk.au.deloitte.com/oauth/authorize
      token_url: https://mcp-gw-dev.ctk.au.deloitte.com/oauth/token
      client_id: "${CLEARTRACK_MCP_GATEWAY_CLIENT_ID}"
      client_secret: "${CLEARTRACK_MCP_GATEWAY_CLIENT_SECRET}"
      #redirect_uri: https://mcp-gw-dev.ctk.au.deloitte.com/oauth/callback
      scope: 'Channel.ReadBasic.All ChannelMember.Read.All Group.Read.All Team.ReadBasic.All User.Read.All Files.Read.All'
#    oauth_headers:
#      X-Custom-Header: 'custom_value'
  cleartrack-gateway-llm-appreg:
    # See documentation: https://github.com/Deloitte-Australia/ea-mcp-gateway/blob/feature/prototype/docs/MCP_Gateway_Wiki.md
    type: streamable-http
    url: https://mcp-gw-dev.ctk.au.deloitte.com/mcp
    oauth:
      authorization_url: https://mcp-gw-dev.ctk.au.deloitte.com/oauth/authorize
      token_url: https://mcp-gw-dev.ctk.au.deloitte.com/oauth/token
      client_id: "${CLEARTRACK_MCP_GATEWAY_CLIENT_ID_LLM}"
      client_secret: "${CLEARTRACK_MCP_GATEWAY_CLIENT_SECRET_LLM}"
      #redirect_uri: https://mcp-gw-dev.ctk.au.deloitte.com/oauth/callback
      scope: 'Channel.ReadBasic.All ChannelMember.Read.All Group.Read.All Team.ReadBasic.All User.Read.All Files.Read.All'
#    oauth_headers:
#      X-Custom-Header: 'custom_value'


mcpSettings:
  allowedDomains:
    - mcp-gw-dev.ctk.au.deloitte.com

speech: # https://www.librechat.ai/docs/configuration/librechat_yaml/object_structure/speech
  speechTab:
    conversationMode: true
    advancedMode: false
    speechToText: true
    textToSpeech: true
    # textToSpeech:
    #   engineTTS: "elevenlabs"
    #   voice: "Rachel"
    #   languageTTS: "en"
    #   automaticPlayback: false
    #   playbackRate: 1.0
    #   cacheTTS: true
  tts:
    elevenlabs:
      apiKey: '${TTS_API_KEY}'
      model: 'eleven_multilingual_v2'
      voices:
        - '5GZaeOOG7yqLdoTRsaa6'  # Rachel
        - 'DTLT09E2cxHF0DqjKVbc'  # Paul
