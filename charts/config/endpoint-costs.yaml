    # LLM Pricing Configuration for Cost Analysis
    # Prices are per 1M tokens (input/output) in USD
    providers:
      azure-openai:
        models:
            gpt-41:
                input_per_1m: 2
                output_per_1m: 8
            gpt-41-mini:
                input_per_1m: 0.4
                output_per_1m: 1.6
            gpt-41-nano:
                input_per_1m: 0.1
                output_per_1m: 0.4            
            gpt-5-chat:
                input_per_1m: 2
                output_per_1m: 8
            gpt-5-mini:
                input_per_1m: 0.4
                output_per_1m: 1.6
            gpt-5-nano:
                input_per_1m: 0.1
                output_per_1m: 0.4
            gpt-4o:
                input_per_1m: 2.5
                output_per_1m: 10
            gpt-4o-mini:
                input_per_1m: 0.15
                output_per_1m: 0.6
