{{- range $pod, $podConfig := .Values.pods }}
{{- range $container, $config := $podConfig.containers }}
{{- with $config.secrets }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "helm.fullname" $ }}-app-secrets-{{ $container }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: app-secret-store
    kind: SecretStore
  target:
    name: {{ include "helm.fullname" $ }}-app-store-secrets-{{ $container }}
    template:
      type: Opaque
      engineVersion: v2
  data:
    {{- range $name, $secretKey := . }}
    - secretKey: {{ $name | quote }}
      remoteRef:
        key: {{ $secretKey | quote }}
    {{- end }}

---
{{- end }}
{{- end }}
{{- end }}

{{- range .Values.ingress.tls }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}-tls-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .secretStoreName }}
    kind: SecretStore
  target:
    name: {{ .secretName }}
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: "{{ `{{ .app_tls | b64dec | pkcs12cert }}` }}"
        tls.key: "{{ `{{ .app_tls | b64dec | pkcs12key }}` }}"
  data:
    - secretKey: app_tls
      remoteRef:
        key: {{ .secretName }}
---
{{- end }}