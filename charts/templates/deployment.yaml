{{- range $pod, $podConfig := .Values.pods }}
{{- with $ -}}
{{- $persistenceEnabled := false }}
{{- if and $podConfig.persistence (hasKey $podConfig.persistence "enabled") $podConfig.persistence.enabled }}
  {{- $persistenceEnabled = true }}
{{- else }}
  {{- range $container, $config := $podConfig.containers }}
    {{- if and $config.persistence (hasKey $config.persistence "enabled") $config.persistence.enabled }}
      {{- $persistenceEnabled = true }}
    {{- end }}
  {{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm.fullname" . }}-{{ $pod }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    component: {{ $pod }}
spec:
  replicas: {{ $podConfig.replicas }}
  {{- if $podConfig.strategy }}
  strategy:
    {{- toYaml $podConfig.strategy | nindent 4 }}
  {{- else if $persistenceEnabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "helm.selectorLabels" . | nindent 6 }}
      component: {{ $pod }}
  template:
    metadata:
      labels:
        {{- include "helm.labels" . | nindent 8 }}
        azure.workload.identity/use: "true"
        app: workload
        component: {{ $pod }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with $podConfig.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      volumes:
        {{- range $container, $config := $podConfig.containers }}
        {{- if and $config.persistence (hasKey $config.persistence "enabled") $config.persistence.enabled }}
        - name: {{ $container }}-data
          persistentVolumeClaim:
            claimName: {{ $config.persistence.name | default (printf "%s-%s-data" $pod $container) }}
        {{- end }}
        {{- end }}
      {{- with $podConfig.initContainers }}
      initContainers:
        {{- range $container, $config := . }}
        - name: {{ $.Chart.Name }}-{{ $container }}
          {{- with $config.restartPolicy }}
          restartPolicy: {{ . }}
          {{- end }}
          {{- with $config.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ $.Values.imageRegistry }}/{{ $config.image.repository }}:{{ $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy }}
          {{- if $config.command }}
          command:
            {{- toYaml $config.command | nindent 12 }}
          {{- end }}
          {{- with $config.env }}
          env:
            {{- range $name, $value := . }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- with $config.secrets }}
          envFrom:
            - secretRef:
                name: {{ include "helm.fullname" $ }}-app-store-secrets-{{ $container }}
          {{- end }}
          {{- with $config.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $config.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- end }}
      containers:
        {{- range $container, $config := $podConfig.containers }}
        - name: {{ $.Chart.Name }}-{{ $container }}
          {{- with $config.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ $.Values.imageRegistry }}/{{ $config.image.repository }}:{{ $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy }}
          {{- if $config.command }}
          command:
            {{- toYaml $config.command | nindent 12 }}
          {{- end }}
          {{- if $config.service.enabled }}
          ports:
            - name: http-{{ $container }}
              containerPort: {{ $config.service.targetPort }}
          {{- end }}
          {{- with $config.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $config.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $config.env }}
          env:
            {{- range $name, $value := . }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- with $config.secrets }}
          envFrom:
            - secretRef:
                name: {{ include "helm.fullname" $ }}-app-store-secrets-{{ $container }}
          {{- end }}
          {{- with $config.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if and $config.persistence (hasKey $config.persistence "enabled") $config.persistence.enabled }}
            - name: {{ $container }}-data
              mountPath: {{ $config.persistence.mountPath | default "/data" }}
            {{- end }}
            {{- with $config.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
{{- end }}
---
{{- end }}
