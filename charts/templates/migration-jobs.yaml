# Deloitte Custom Change: Retention Update
# One-off Kubernetes Jobs for the data-retention migration/backfill scripts
# (see UPGRADING.md). Jobs render only when explicitly enabled in the
# environment values and remain inactive while suspended. Several scripts scan
# unindexed fields, so they must never run as always-on, every-deploy
# automation. Force=true,Replace=true deletes and recreates the otherwise
# immutable Job for the deliberate run.
{{- range $name, $job := .Values.migrationJobs }}
{{- if $job.enabled }}
{{- with $ }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "helm.fullname" . }}-migrate-{{ $name }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    component: migrate-{{ $name }}
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    argocd.argoproj.io/sync-wave: {{ $job.syncWave | quote }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  suspend: {{ $job.suspend }}
  manualSelector: true
  selector:
    matchLabels:
      {{- include "helm.selectorLabels" . | nindent 6 }}
      component: migrate-{{ $name }}
  template:
    metadata:
      labels:
        {{- include "helm.selectorLabels" . | nindent 8 }}
        component: migrate-{{ $name }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate-{{ $name }}
          image: "{{ .Values.imageRegistry }}/{{ .Values.pods.librechat.containers.librechat.image.repository }}:{{ .Values.pods.librechat.containers.librechat.image.tag }}"
          imagePullPolicy: {{ .Values.pods.librechat.containers.librechat.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - "npm run {{ $job.npmScript }}{{ if $job.dryRun }}:dry-run{{ end }}"
          env:
            {{- with .Values.pods.librechat.containers.librechat.env.MONGO_DB }}
            - name: MONGO_DB
              value: {{ . | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "helm.fullname" . }}-app-store-secrets-librechat
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
{{- end }}
{{- end }}
{{- end }}
