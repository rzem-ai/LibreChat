apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helm.fullname" . }}-config
  labels:
    {{- include "helm.labels" . | nindent 4 }}
data:
  librechat.yaml: |-
{{- .Files.Get "config/librechat.yaml" | nindent 4 }}
  proxy.conf: |-
{{- .Files.Get "config/proxy.conf" | nindent 4 }}
  proxy.sh: |-
{{- .Files.Get "config/proxy.sh" | nindent 4 }}

