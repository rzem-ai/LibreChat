{{- range $pod, $podConfig := .Values.pods }}
{{- range $container, $config := $podConfig.containers }}
{{- if and $config.persistence (hasKey $config.persistence "enabled") $config.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $config.persistence.name | default (printf "%s-%s-data" $pod $container) }}
  labels:
    {{- include "helm.labels" $ | nindent 4 }}
    component: {{ $container }}
spec:
  accessModes:
    {{- if $config.persistence.accessModes }}
    {{- toYaml $config.persistence.accessModes | nindent 4 }}
    {{- else }}
    - ReadWriteOnce
    {{- end }}
  resources:
    requests:
      storage: {{ $config.persistence.size | default "5Gi" }}
  {{- if $config.persistence.storageClass }}
  storageClassName: {{ $config.persistence.storageClass }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}