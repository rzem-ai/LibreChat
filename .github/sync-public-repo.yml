# ------------------------------------------------------------------------------
# Public Repository Sync Workflow
# ------------------------------------------------------------------------------
#
# Purpose
# -------
# Synchronises changes from the public GitHub repository into the current destination 
# repository by:
#   1. Fetching from the public upstream repository
#   2. Creating a sync branch in the destination repository
#   3. Merging upstream changes into the sync branch
#   4. Creating a Pull Request into the destination branch
#   5. Optionally enabling auto-merge
#
# This workflow always runs in the DESTINATION repository.
#
# Requirements
# ------------
#
# 1. Destination GitHub App
# -------------------------
# A GitHub App must be installed on the DESTINATION repository with:
#
#   Repository permissions:
#     - Contents: Read & write
#     - Pull requests: Read & write
#     - Workflows: Read & write
#
# NOTE:
# Workflows: write is required because synced changes may include files under:
#
#   .github/workflows/
#
# Required secrets:
#   - SYNC_DESTINATION_APP_CLIENT_ID
#   - SYNC_DESTINATION_APP_PRIVATE_KEY
#
#
# 2. Repository Variables
# -----------------------
# Required repository variables:
#
#   - SYNC_PUBLIC_SOURCE_OWNER
#   - SYNC_PUBLIC_SOURCE_REPO
#
# Optional repository variables:
#
#   - SYNC_PUBLIC_SOURCE_BRANCH
#       Default: main
#
#   - SYNC_DESTINATION_BRANCH
#       Default: main
#
#   - SYNC_AUTO_MERGE
#       true  = automatically merge PRs
#       false = require manual merge
#
# Notes
# -----
# - This workflow preserves commit history using git merge.
# - Merge conflicts create draft PRs for manual resolution.
# - The sync orchestration workflow itself is preserved locally.
# - Application workflows under .github/workflows are still synced normally.
#
# ------------------------------------------------------------------------------

name: Sync from public repo

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      SOURCE_OWNER: ${{ vars.SYNC_PUBLIC_SOURCE_OWNER || 'danny-avila' }}
      SOURCE_REPO: ${{ vars.SYNC_PUBLIC_SOURCE_REPO || 'librechat' }}

    steps:
      - name: Generate destination write token
        id: destination-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.SYNC_DESTINATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_DESTINATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout destination repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.destination-token.outputs.token }}
          ref: ${{ vars.SYNC_DESTINATION_BRANCH || 'main' }}
          persist-credentials: false
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add public source as upstream
        run: |
          SOURCE_BRANCH="${{ vars.SYNC_PUBLIC_SOURCE_BRANCH || 'main' }}"
          git remote add upstream "https://github.com/${SOURCE_OWNER}/${SOURCE_REPO}.git"
          git fetch upstream "$SOURCE_BRANCH"

      # Create a new sync branch from the destination branch, then merge the source branch into it
      # If conflicts occur, the conflicted state is committed and a draft PR is created for manual resolution
      - name: Create sync branch and merge
        run: |
          SOURCE_BRANCH="${{ vars.SYNC_PUBLIC_SOURCE_BRANCH || 'main' }}"
          DESTINATION_BRANCH="${{ vars.SYNC_DESTINATION_BRANCH || 'main' }}"
          SYNC_BRANCH="sync/${SOURCE_OWNER}-${SOURCE_REPO}-${SOURCE_BRANCH}-$(date +%Y%m%d-%H%M%S)"

          echo "SYNC_BRANCH=$SYNC_BRANCH" >> "$GITHUB_ENV"

          git checkout "$DESTINATION_BRANCH"
          git checkout -b "$SYNC_BRANCH"

          if ! git merge "upstream/$SOURCE_BRANCH" --no-edit --allow-unrelated-histories; then
            echo "MERGE_CONFLICT=true" >> "$GITHUB_ENV"

            echo "Merge conflicts detected:"
            git diff --name-only --diff-filter=U

            git add -A
            git commit -m "Sync from public upstream with merge conflicts"
          else
            echo "MERGE_CONFLICT=false" >> "$GITHUB_ENV"
          fi

      - name: Preserve sync orchestration workflow only
        run: |
          DESTINATION_BRANCH="${{ vars.SYNC_DESTINATION_BRANCH || 'main' }}"
          SYNC_WORKFLOW_FILE=".github/workflows/sync-public-repo.yml"

          git checkout "$DESTINATION_BRANCH" -- "$SYNC_WORKFLOW_FILE" || true

          if ! git diff --quiet; then
            git add "$SYNC_WORKFLOW_FILE"
            git commit -m "Preserve destination-owned public sync workflow"
          fi

      # Avoid pushing or creating a PR if the destination branch is already up to date
      - name: Check if sync branch has changes
        id: check-changes
        run: |
          DESTINATION_BRANCH="${{ vars.SYNC_DESTINATION_BRANCH || 'main' }}"

          if git diff --quiet "origin/$DESTINATION_BRANCH...HEAD"; then
            echo "HAS_CHANGES=false" >> "$GITHUB_OUTPUT"
            echo "No new changes from public source."
          else
            echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      - name: Show files being pushed
        if: steps.check-changes.outputs.HAS_CHANGES == 'true'
        run: |
          DESTINATION_BRANCH="${{ vars.SYNC_DESTINATION_BRANCH || 'main' }}"
          git diff --name-only "origin/$DESTINATION_BRANCH...HEAD"

      # Push the sync branch to the destination repository using the destination GitHub App token
      - name: Push sync branch
        if: steps.check-changes.outputs.HAS_CHANGES == 'true'
        run: |
          git remote set-url origin "https://x-access-token:${{ steps.destination-token.outputs.token }}@github.com/${{ github.repository }}.git"
          git push origin "HEAD:$SYNC_BRANCH"

      # Create a PR into the destination branch
      # Conflict PRs are created as draft PRs so they are not accidentally merged
      - name: Create pull request
        id: create-pr
        if: steps.check-changes.outputs.HAS_CHANGES == 'true'
        env:
          GH_TOKEN: ${{ steps.destination-token.outputs.token }}
        run: |
          DESTINATION_BRANCH="${{ vars.SYNC_DESTINATION_BRANCH || 'main' }}"
          SOURCE_BRANCH="${{ vars.SYNC_PUBLIC_SOURCE_BRANCH || 'main' }}"

          COMMITS=$(git log --oneline --no-merges "origin/${DESTINATION_BRANCH}..upstream/${SOURCE_BRANCH}" | head -50)

          CONFLICT_LINE=""
          if [ "$MERGE_CONFLICT" = "true" ]; then
            CONFLICT_LINE=$'\n- :warning: **This PR has merge conflicts that must be resolved manually.**'
          fi

          BODY=$(printf '%s\n' \
            "## Summary" \
            "This PR syncs the latest changes from \`${SOURCE_OWNER}/${SOURCE_REPO}:${SOURCE_BRANCH}\` into this repository via the \`${SYNC_BRANCH}\` branch." \
            "" \
            "## Details" \
            "- Source: \`${SOURCE_OWNER}/${SOURCE_REPO}:${SOURCE_BRANCH}\`" \
            "- PR branch: \`${SYNC_BRANCH}\`" \
            "- Target branch: \`${DESTINATION_BRANCH}\`" \
            "- Merge conflicts detected: **${MERGE_CONFLICT:-false}**" \
            "" \
            "## Changelog" \
            "```" \
            "${COMMITS}" \
            "```" \
            "" \
            "## Notes" \
            "- This PR is automatically refreshed weekly if upstream changes are detected." \
            "- No PR is created when there is no upstream delta.${CONFLICT_LINE}")

          if [ "$MERGE_CONFLICT" = "true" ]; then
            TITLE="Manual sync required: conflicts from ${SOURCE_OWNER}/${SOURCE_REPO}"
            DRAFT_FLAG="--draft"
          else
            TITLE="chore: sync ${SOURCE_OWNER}/${SOURCE_REPO}:${SOURCE_BRANCH} into ${DESTINATION_BRANCH}"
            DRAFT_FLAG=""
          fi

          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base "$DESTINATION_BRANCH" \
            --head "$SYNC_BRANCH" \
            --title "$TITLE" \
            --body "$BODY" \
            $DRAFT_FLAG)

          echo "PR_URL=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "MERGE_CONFLICT=${MERGE_CONFLICT:-false}" >> "$GITHUB_OUTPUT"

      # Optional auto-merge
      # Controlled by repository variable SYNC_AUTO_MERGE=true
      # Auto-merge is skipped for conflict PRs
      - name: Auto merge or enable auto merge
        if: steps.check-changes.outputs.HAS_CHANGES == 'true' && vars.SYNC_AUTO_MERGE == 'true' && steps.create-pr.outputs.MERGE_CONFLICT != 'true'
        env:
          GH_TOKEN: ${{ steps.destination-token.outputs.token }}
        run: |
          PR_URL="${{ steps.create-pr.outputs.PR_URL }}"

          if gh pr merge \
            --repo "${{ github.repository }}" \
            --auto \
            --merge \
            "$PR_URL"; then
            echo "Auto-merge enabled."
          else
            echo "Auto-merge could not be enabled. Trying immediate merge..."
            gh pr merge \
              --repo "${{ github.repository }}" \
              --merge \
              "$PR_URL"
          fi
