# Build and Push to ITS DEV ACR to develop branch, and promote the image from ITS DEV ACR to ITS PROD ACR to main branch
name: "CI: Image Build (DEV) and Promotion (PROD)"
on:
  workflow_dispatch:
    inputs:
      helmValuesFile:
        description: '(Environment) Helm values file to target'
        type: choice
        required: true
        default: 'values-dev.yaml'
        options:
          - values-dev.yaml # image tag 'develop'
          - values-uat.yaml # image tag 'uat'
          - values-prd.yaml # image tag 'main'
      actionType:
        description: 'Action type'
        type: choice
        required: true
        default: 'Build & push'
        options:
          - 'Build & push'
          - 'Promote'
          - 'Build, push & promote'
      incrementType:
        description: '(Semver - Git only) Increment type'
        type: choice
        required: true
        default: none
        options:
          - none
          - patch
          - minor
          - major
  pull_request:
    branches:
      - main
      - uat
      - develop
  push:
    branches:
      - main
      - uat
      - develop
    paths:
      - librechat.yaml
      - api/**
      - client/**
      - packages/**
      - llm_gateway_proxy/**
      - rag_api
      - rag_api/**
      - Dockerfile
      - Dockerfile.meilisearch
      - src/redis/**
      - package.json
# Limit to one concurrent workflow run per workflow, event, and ref
concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true
permissions:
  id-token: write
  actions: read
  contents: write
  pull-requests: write
  security-events: write
  issues: read
jobs:
  SemVer:
    if: >
      (( github.event_name == 'pull_request' || github.event_name == 'pull_request_target' ) && github.event.pull_request.base.ref == 'main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.incrementType != 'none')
    uses: Deloitte-Australia/ct-devops-resources/.github/workflows/generate-semver.yml@V2
    secrets: inherit
    with:
      targetBranch: ${{ github.event.pull_request.base.ref }}
      incrementType: ${{ github.event.inputs.incrementType }}
  CI:
    if: ${{ github.event.pull_request.base.ref != 'main' }}
    strategy:
      fail-fast: false # True: cancel all in-progress and queued jobs in the matrix if any job in the matrix fails. False: continue running all jobs even if one fails
      matrix:
        include:
          #####################################################################################
          # Single LibreChat image — built from root Dockerfile (monorepo, serves on port 3080)
          - imageNameAlias: librechat
            buildContext: .
            dockerFilePath: Dockerfile
            yamlKeyPath: '.pods.librechat.containers.librechat.image'
            submodule: false
          # LLM Gateway proxy image — built from llm_gateway_proxy Dockerfile (serves on port 8081)
          - imageNameAlias: llm-gateway-proxy
            buildContext: llm_gateway_proxy
            dockerFilePath: llm_gateway_proxy/Dockerfile
            yamlKeyPath: '.pods.librechat.initContainers.llm-gateway-proxy.image'
            submodule: false
          # RAG API image — built from rag_api submodule Dockerfile (serves on port 8000)
          - imageNameAlias: rag-api
            buildContext: rag_api
            dockerFilePath: rag_api/Dockerfile.lite
            yamlKeyPath: '.pods.librechat.containers.rag-api.image'
            submodule: true
          # Meilisearch image — derived from upstream image and published to ACR
          - imageNameAlias: meilisearch
            buildContext: .
            dockerFilePath: Dockerfile.meilisearch
            yamlKeyPath: '.pods.librechat.containers.meilisearch.image'
            submodule: false
            # buildArgs: |
            #   ARG1=value
            # unitTestScript: |
            #   echo "Running unit tests"
          # Valkey image — in-cluster Redis-compatible store (StatefulSet, AOF persistence)
          - imageNameAlias: valkey
            buildContext: src/redis
            dockerFilePath: src/redis/Dockerfile
            yamlKeyPath: '.valkey.image'
            submodule: false
          # Admin Panel image — built from admin_panel submodule Dockerfile with VITE_BASE_PATH=/admin
          # The admin panel is a Vite SPA where the base path must be baked in at build time.
          - imageNameAlias: admin-panel
            buildContext: admin_panel
            dockerFilePath: admin_panel/Dockerfile
            yamlKeyPath: '.pods.admin-panel.containers.admin-panel.image'
            buildArgs: VITE_BASE_PATH=/admin
            submodule: true
        #####################################################################################
    uses: Deloitte-Australia/ct-devops-resources/.github/workflows/build-and-promote.yml@V2
    secrets: inherit
    with:
      imageNameSuffix: ${{ matrix.imageNameAlias }}
      dockerfilePath: ${{ matrix.dockerFilePath }}
      buildContext: ${{ matrix.buildContext }}
      targetBranch: ${{ ( github.event_name == 'pull_request' || github.event_name == 'pull_request_target' ) && github.head_ref || github.ref_name }} # If the event is a pull request, use the base branch of the pull request. Otherwise, use the current branch
      buildArgs: ${{ matrix.buildArgs }}
      customBuildSetupScript: |
        ${{ matrix.customBuildSetupScript }}
        set -euo pipefail

        BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"

        case "${BRANCH}" in
          main|uat|develop)
            SUBMODULE_BRANCH="${BRANCH}"
            ;;
          *)
            SUBMODULE_BRANCH="develop"
            ;;
        esac

        git config submodule.rag_api.branch "${SUBMODULE_BRANCH}"
        git config submodule.admin_panel.branch "${SUBMODULE_BRANCH}"
        git submodule sync --recursive

        if [ "${{ matrix.submodule }}" = "true" ]; then
          git submodule update --init --remote --recursive -- "${{ matrix.buildContext }}"
          git -C "${{ matrix.buildContext }}" checkout -B "${SUBMODULE_BRANCH}" "origin/${SUBMODULE_BRANCH}"
        fi
        
        python3 - <<'PY'
        import re
        from pathlib import Path

        path = Path("librechat.yaml")
        content = path.read_text()
        content = re.sub(
          r'(?m)^[ \t]*x-id-token:\s*[\'"]?\$\{LLM_GATEWAY_LOCAL_IDENTITY_TOKEN_SESSION\}[\'"]?[ \t]*\n?',
          '',
          content,
        )

        if "fileStrategy:" not in content:
          match = re.search(r"^cache:\s*true(?:\s*#.*)?$", content, flags=re.MULTILINE)
          if match is None:
            raise SystemExit("Unable to inject fileStrategy: cache:true entry not found")
          content = content[:match.end()] + "\n\nfileStrategy: 'azure_blob'" + content[match.end():]

        path.write_text(content)
        PY
        if grep -q 'LLM_GATEWAY_LOCAL_IDENTITY_TOKEN_SESSION' librechat.yaml; then
          echo 'Unable to remove x-id-token headers from deployment config'
          exit 1
        fi
        grep -q '^fileStrategy:' librechat.yaml || { echo 'Unable to inject fileStrategy'; exit 1; }
      skipPromotionOnFail: false
      parentHelmValuesFile: 'values.yaml'
      helmFolderPath: 'charts'
      actionType: ${{ github.event.inputs.actionType }}
      yamlKeyPath: ${{ matrix.yamlKeyPath }}
      submodule: ${{ matrix.submodule }}
  UpdateValues:
    needs: [CI]
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    uses: Deloitte-Australia/ct-devops-resources/.github/workflows/update-helm.yml@V2
    secrets: inherit
    with:
      helmFolderPath: 'charts'
      helmValuesFile: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.helmValuesFile || '' }}
      targetBranch: ${{ github.ref_name }}
  PostPRComment:
    if: ${{ always() && ( github.event_name == 'pull_request' || github.event_name == 'pull_request_target' ) }}
    needs: [CI]
    runs-on: ubuntu-latest
    steps:
      - name: Determine Outcome
        id: outcome
        run: |
          # Keep track of the GitHub Summary path as env var
          echo "SUMMARY_PATH=$(echo $GITHUB_STEP_SUMMARY)" >> $GITHUB_ENV

          if [[ "${{ needs.CI.result }}" == "success" || "${{ needs.CI.result }}" == "skipped" ]]; then
            echo "## Build Pipeline Results ✅" >> $GITHUB_STEP_SUMMARY
            echo "The CI pipeline has successfully completed for \`${{ github.event.pull_request.head.ref }}\`." >> $GITHUB_STEP_SUMMARY
          else
            echo "## Build Pipeline Results ❌" >> $GITHUB_STEP_SUMMARY
            echo "The CI pipeline has failed for \`${{ github.event.pull_request.head.ref }}\`." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the actions logs for more details and resolve the issues." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Post or Update Comment
        uses: actions/github-script@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Find list of comments from Pull Request
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Find comment with title in the content
            const comment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('## Build Pipeline Results')
            });

            // Read the summary file
            const fs = require('fs');
            const summaryFile = fs.readFileSync('${{ env.SUMMARY_PATH }}', 'utf8');

            // Construct repository URL
            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;

            // Format content to be shown in PR comment
            let summaryContent = `${summaryFile}

            Run [\`#${context.runNumber}\`](${repoUrl}/actions/runs/${context.runId}), committed by @${{ github.actor }} on commit ${repoUrl}/commit/${context.payload.pull_request.head.sha}`;

            // Post Pull Request comment by updating or creating a new comment
            if (comment) {
              // Update comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
                body: summaryContent
              })
            } else {
              // Create comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summaryContent
              })
            }
