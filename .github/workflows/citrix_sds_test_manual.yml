name: Citrix SDS Workspace test

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to send to SDS API
        required: true
        default: provision
        type: choice
        options:
          - provision
          - destroy
      branch_name:
        description: Branch name to associate with the test app
        required: true
        default: Feat/citrix-sds
        type: string
      repo_name:
        description: Repository in owner/repo format
        required: true
        default: ${{ github.repository }}
        type: string
      commit_sha:
        description: Commit SHA to associate with the test app
        required: false
        default: ''
        type: string
      sharing:
        description: Sharing mode
        required: true
        default: Project Sharing
        type: string

concurrency:
  group: citrix-sds-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-sds-workspace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build payload
        env:
          ACTION: ${{ inputs.action }}
          BRANCH_NAME: ${{ inputs.branch_name }}
          REPO_NAME: ${{ inputs.repo_name }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          SHARING: ${{ inputs.sharing }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${COMMIT_SHA}" ]; then
            COMMIT_SHA="${GITHUB_SHA}"
          fi

          cat > payload.json <<EOF
          {
            "action": "${ACTION}",
            "appName": "run-app-${RUN_ID}",
            "branch": "${BRANCH_NAME}",
            "workflowRunId": "${RUN_ID}",
            "repo": "${REPO_NAME}",
            "commit": "${COMMIT_SHA}",
            "sharing": "${SHARING}"
          }
          EOF
          cat payload.json

      - name: Call Citrix SDS API
        env:
          CITRIX_SDS_URL: ${{ secrets.CITRIX_SDS_URL }}
          CITRIX_SDS_API_KEY: ${{ secrets.CITRIX_SDS_API_KEY }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            -X POST "${CITRIX_SDS_URL}/api/workspaces/apps" \
            -H "x-api-key: ${CITRIX_SDS_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @payload.json
