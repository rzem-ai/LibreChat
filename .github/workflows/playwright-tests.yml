name: Playwright Tests
on:
  # push:
  #   branches: [ develop ]
  # pull_request:
  #   branches: [ develop ]
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode'
        required: true
        default: 'e2e:ci'
        type: choice
        options:
          - e2e:ci
          - e2e:mock
          - live
      base_url:
        description: 'Target site (live mode only)'
        required: false
        default: 'https://librechat-dev.ctk.au.deloitte.com'
        type: string
permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event.inputs.test_mode != 'live' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Install dependencies
        run: npm ci

      # - name: Install Playwright browsers
      #   run: DEBUG=pw:install npx playwright install --with-deps chromium

      # - name: Install Playwright browsers II
      #   run: |
      #     # 1. Update your local OS package definitions
      #     sudo apt-get update

      #     # 2. Install the system dependencies explicitly 
      #     sudo npx playwright install-deps chromium

      #     # 3. Download the specific Chromium binary
      #     npx playwright install chromium

      - name: Run Playwright tests
        run: npm run ${{ github.event.inputs.test_mode }}

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/**
          retention-days: 30

  live:
    if: ${{ github.event.inputs.test_mode == 'live' }}
    # Self-hosted so the runner sits inside the network that can reach the
    # private dev host and the SSO provider.
    runs-on:
      group: AU ITS DevOps Build Servers

    # Holds the test-account secrets and any required approvers.
    environment: playwright-dev

    timeout-minutes: 30

    env:
      E2E_BASE_URL: ${{ github.event.inputs.base_url }}
      # Dedicated test account — never a personal login.
      E2E_USER: ${{ secrets.E2E_LIVE_USER }}
      E2E_PASS: ${{ secrets.E2E_LIVE_PASS }}
      # Drive the runner's preinstalled Edge; the bundled Chromium download
      # stalls behind TLS inspection on this build server.
      E2E_CHROMIUM_CHANNEL: msedge
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      # The build server sits behind TLS inspection, so Node must be told to
      # trust the interception CAs or every HTTPS download fails.
      - name: Trust corporate root certificates
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'corp-ca-bundle.pem'
          Get-Content deloitte/certificates/*.crt | Set-Content -Path $bundle -Encoding ascii
          "NODE_EXTRA_CA_CERTS=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: npm ci

      - name: Verify browser is available
        shell: pwsh
        run: |
          $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if (-not (Test-Path $edge)) { throw "Edge not found at $edge" }
          (Get-Item $edge).VersionInfo.ProductVersion

      - name: Verify credentials are wired up
        shell: pwsh
        run: |
          $missing = @()
          if (-not $env:E2E_USER) { $missing += 'E2E_LIVE_USER' }
          if (-not $env:E2E_PASS) { $missing += 'E2E_LIVE_PASS' }
          if ($missing) {
            throw "Empty secret(s): $($missing -join ', '). Check they are Environment *secrets* (not variables) under 'playwright-dev'."
          }
          Write-Host "Credentials present (user length: $($env:E2E_USER.Length), pass length: $($env:E2E_PASS.Length))"

      # Programmatic login instead of a hand-captured snapshot: a fresh session
      # every run, so nothing goes stale. Writes e2e/live-auth.json.
      - name: Capture live session
        run: node e2e/login-live.mjs

      - name: Run live smoke
        run: npx playwright test --config=e2e/playwright.config.live.ts

      - name: Upload live test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-live-report
          path: e2e/playwright-report/**
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload traces & screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-failures
          path: e2e/specs/.test-results/**
          retention-days: 7
          if-no-files-found: ignore

      # Self-hosted runners keep their working directory, so the live session
      # file must not survive the job.
      - name: Remove captured session
        if: always()
        shell: pwsh
        run: Remove-Item -Path e2e/live-auth.json -Force -ErrorAction SilentlyContinue