name: Deloitte Custom Changes CSV

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

permissions:
  contents: write
  pull-requests: write

env:
  EXCLUDED_PATH_PREFIXES: admin_panel/,charts/,deloitte/,rag_api/
  EXCLUDED_BRANCH_PREFIX: sync/
  EXCLUDED_AUTOGEN_BRANCH_PREFIX: track-changes/

jobs:
  update-csv:
    if: github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'sync/') && !startsWith(github.event.pull_request.head.ref, 'track-changes/')
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate using GitHub App
        id: auth
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.CSV_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSV_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.auth.outputs.token }}
          persist-credentials: false
      - name: Gather PR metadata
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const metadata = {
              number: pr.number,
              title: pr.title,
              url: pr.html_url,
              merged_at: pr.merged_at,
              files: files.map((file) => ({
                filename: file.filename,
                status: file.status,
                previous_filename: file.previous_filename ?? null
              }))
            };

            fs.writeFileSync('deloitte/pr-metadata.json', JSON.stringify(metadata, null, 2));

      - name: Update Deloitte custom changes CSV
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          csv_path = Path("deloitte/DeloitteCustomChanges.csv")
          metadata_path = Path("deloitte/pr-metadata.json")

          with metadata_path.open("r", encoding="utf-8") as file:
              metadata = json.load(file)

          rows = {}
          fieldnames = ["path_to_file", "filename", "type", "changes_made", "related_prs"]
          excluded_prefixes = []
          for value in os.getenv("EXCLUDED_PATH_PREFIXES", "").split(","):
              prefix = value.strip().lstrip("./")
              if not prefix:
                  continue
              if not prefix.endswith("/"):
                  prefix = f"{prefix}/"
              excluded_prefixes.append(prefix)

          def is_excluded(path):
              normalized_path = path.lstrip("./")
              return any(normalized_path.startswith(prefix) for prefix in excluded_prefixes)

          def to_change_type(status):
              normalized_status = (status or "").lower()
              if normalized_status == "added":
                  return "created new file"
              if normalized_status == "removed":
                  return "deleted existing file"
              if normalized_status == "renamed":
                  return "renamed existing file"
              return "modified existing file"

          if csv_path.exists():
              with csv_path.open("r", encoding="utf-8", newline="") as file:
                  for row in csv.DictReader(file):
                      path = row.get("path_to_file", "").strip()
                      if path:
                          rows[path] = {
                              "filename": Path(path).name,
                              "path_to_file": path,
                              "type": row.get("type", "modified existing file").strip() or "modified existing file",
                              "changes_made": row.get("changes_made", "").strip(),
                              "related_prs": row.get("related_prs", "").strip(),
                          }

          def build_description(file_data):
              status = (file_data.get("status") or "").lower()
              title = metadata["title"].strip()
              number = metadata["number"]
              timestamp = metadata.get("merged_at") or datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
              prefix_map = {
                  "added": "Added",
                  "modified": "Modified",
                  "removed": "Deleted",
                  "renamed": "Renamed",
                  "copied": "Copied",
                  "changed": "Changed",
              }
              prefix = prefix_map.get(status, "Updated")
              previous = file_data.get("previous_filename")
              if status == "renamed" and previous:
                  return f"{prefix} in PR #{number} at {timestamp}: {title} (from {previous})."
              return f"{prefix} in PR #{number} at {timestamp}: {title}."

          pr_url = metadata["url"].strip()
          file_updates = {}
          for file_data in metadata.get("files", []):
              path = (file_data.get("filename") or "").strip()
              if path and not is_excluded(path):
                  file_updates[path] = file_data

          for path, file_data in file_updates.items():
              status = (file_data.get("status") or "").lower()
              previous_path = (file_data.get("previous_filename") or "").strip()

              # If a file was renamed, migrate any prior row from the old path to the new path.
              if status == "renamed" and previous_path and previous_path in rows:
                  previous_row = rows.pop(previous_path)
                  existing_new = rows.get(path)
                  if existing_new:
                      existing_prs = [value.strip() for value in existing_new["related_prs"].split(" | ") if value.strip()]
                      previous_prs = [value.strip() for value in previous_row.get("related_prs", "").split(" | ") if value.strip()]
                      for pr in previous_prs:
                          if pr not in existing_prs:
                              existing_prs.append(pr)
                      existing_new["related_prs"] = " | ".join(existing_prs)
                  else:
                      previous_row["path_to_file"] = path
                      rows[path] = previous_row

              description = build_description(file_data)
              change_type = to_change_type(file_data.get("status"))
              existing = rows.get(path)

              if existing:
                  existing["type"] = change_type

                  previous_description = existing.get("changes_made", "").strip()
                  if previous_description and description and description not in previous_description:
                      existing["changes_made"] = f"{previous_description} | {description}"
                  else:
                      existing["changes_made"] = description or previous_description

                  existing_prs = [value.strip() for value in existing["related_prs"].split(" | ") if value.strip()]
                  if pr_url not in existing_prs:
                      existing_prs.append(pr_url)
                  existing["related_prs"] = " | ".join(existing_prs)
              else:
                  rows[path] = {
                      "filename": Path(path).name,
                      "path_to_file": path,
                      "type": change_type,
                      "changes_made": description,
                      "related_prs": pr_url,
                  }

          sorted_rows = [rows[path] for path in sorted(rows, key=lambda p: rows[p]["path_to_file"].casefold())]
          csv_path.parent.mkdir(parents=True, exist_ok=True)
          with csv_path.open("w", encoding="utf-8", newline="") as file:
              writer = csv.DictWriter(file, fieldnames=fieldnames, lineterminator="\n")
              writer.writeheader()
              writer.writerows(sorted_rows)
          PY

      - name: Prepare CSV change state
        id: csv-state
        run: |
          rm -f deloitte/pr-metadata.json
          if git diff --quiet -- deloitte/DeloitteCustomChanges.csv; then
            echo "No CSV changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create CSV update pull request
        if: steps.csv-state.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.auth.outputs.token }}
          base: develop
          branch: track-changes/deloitte-csv-pr-${{ github.event.pull_request.number }}
          delete-branch: true
          commit-message: 'chore(deloitte): update custom changes CSV for PR #${{ github.event.pull_request.number }}'
          title: 'chore(deloitte): update custom changes CSV for PR #${{ github.event.pull_request.number }}'
          body: |
            Automated CSV update generated after merge of [#${{ github.event.pull_request.number }}](https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}).
            
            This PR updates:
            - deloitte/DeloitteCustomChanges.csv
          add-paths: |
            deloitte/DeloitteCustomChanges.csv
