name: CodeQL

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'uat'
      - 'develop'
  workflow_dispatch:

# Limit to one concurrent workflow run per workflow and per branch at a time
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  CodeQL:
    uses: Deloitte-Australia/ct-devops-resources/.github/workflows/codeql.yml@main
