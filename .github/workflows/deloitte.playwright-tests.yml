name: Playwright CI/Mock
on:
  pull_request:
    branches: [develop, uat, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      run_ci:
        description: 'Run e2e:ci'
        required: true
        default: true
        type: boolean
      run_mock:
        description: 'Run e2e:mock'
        required: true
        default: true
        type: boolean
permissions:
  contents: read

jobs:
  ci:
    # Runs on push/PR (once enabled) and whenever the dispatch input isn't
    # explicitly set to false.
    if: ${{ github.event.inputs.run_ci != 'false' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      MCP_GATEWAY_URL: http://127.0.0.1:65535
      MCP_GATEWAY_OBO_SCOPE: api://e2e/mcp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 24.17.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        run: npm run e2e:ci

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-ci
          path: e2e/playwright-report/**
          retention-days: 30

  mock:
    # Runs after ci regardless of whether ci ran or was skipped, but not if it failed.
    needs: ci
    if: ${{ !cancelled() && needs.ci.result != 'failure' && github.event.inputs.run_mock != 'false' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      MCP_GATEWAY_URL: http://127.0.0.1:65535
      MCP_GATEWAY_OBO_SCOPE: api://e2e/mcp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        run: npm run e2e:mock

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-mock
          path: e2e/playwright-report/**
          retention-days: 30