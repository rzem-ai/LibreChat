name: Playwright CI/Mock
on:
  schedule:
    # Every Wednesday at 19:00 AEST (09:00 UTC)
    - cron: '0 9 * * 3'
  workflow_dispatch:
    inputs:
      run_ci:
        description: 'Run e2e:ci'
        required: true
        default: false
        type: boolean
      run_mock:
        description: 'Run e2e:mock'
        required: true
        default: true
        type: boolean
permissions:
  contents: read

env:
  MCP_GATEWAY_URL: ${{ vars.MCP_GATEWAY_URL || 'http://127.0.0.1:65535' }}
  MCP_GATEWAY_OBO_SCOPE: ${{ vars.MCP_GATEWAY_OBO_SCOPE || 'api://e2e/mcp' }}

jobs:
  ci:
    # Opt-in only: must be explicitly enabled via manual dispatch.
    if: ${{ inputs.run_ci == true }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 24.17.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        run: npm run e2e:ci

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-ci
          path: e2e/playwright-report/**
          retention-days: 30

  mock:
    # Independent of the ci job; runs on schedule and by default on dispatch.
    if: ${{ github.event_name == 'schedule' || inputs.run_mock == true }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        run: npm run e2e:mock

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-mock
          path: e2e/playwright-report/**
          retention-days: 30