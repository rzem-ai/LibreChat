name: Terrascan

on:
  pull_request:
  workflow_dispatch:

# Limit to one concurrent workflow run per workflow and per branch at a time
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  Terrascan:
    uses: Deloitte-Australia/ct-devops-resources/.github/workflows/terrascan.yml@main
    secrets: inherit
