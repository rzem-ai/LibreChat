name: MCP Request (Deloitte)
description: File a new MCP request
title: "[MCPs]: Add <MCP Name> MCP"
labels: ["✨ enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill this out! Use this form to submit a new MCP request. If an existing MCP request already exists, please edit that request.
  - type: textarea
    id: name
    attributes:
      label: MCP Name
      description: Please provide the MCP name.
      placeholder: MCP Name
    validations:
      required: true
  - type: textarea
    id: use_cases
    attributes:
      label: MCP Use Cases
      description: Please explain what the MCP would be used for.
      placeholder: This MCP will allow users to...
    validations:
      required: true
  - type: textarea
    id: user_quotes
    attributes:
      label: User Quotes
      description: Please include the name, email, quotes and date from users requesting this MCP.
      placeholder: user, email, quotes, date
    validations:
      required: true

