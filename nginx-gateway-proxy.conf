# ===========================================
# Anthropic Gateway Proxy (port 8080)
# Translates x-api-key → x-id-token
# ===========================================
server {
    listen 8080;

    location / {
        proxy_set_header x-id-token $http_x_api_key;
        proxy_set_header anthropic-version "2023-06-01";
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Host us-anthropic-exp.ctk.au.deloitte.com;
        proxy_set_header x-api-key "";

        proxy_pass https://us-anthropic-exp.ctk.au.deloitte.com;
        proxy_ssl_server_name on;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}

# ===========================================
# Azure OpenAI Gateway Proxy (port 8081)
# Used by RAG API for embeddings
# Translates Authorization: Bearer <token> → x-id-token
# ===========================================
server {
    listen 8081;

    location / {
        set $token "";
        if ($http_authorization ~* "^Bearer (.+)$") {
            set $token $1;
        }

        proxy_set_header x-id-token $token;
        proxy_set_header Authorization "";
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Host au-openai-exp.ctk.au.deloitte.com;

        proxy_pass https://au-openai-exp.ctk.au.deloitte.com/openai/v1/;
        proxy_ssl_server_name on;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}