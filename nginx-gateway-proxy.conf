# ===========================================
# Anthropic Gateway Proxy (port 8080)
# Translates x-api-key → x-id-token
# ===========================================
server {
    listen 8080;

    location / {
        proxy_set_header x-id-token $http_x_api_key;
        proxy_set_header anthropic-version "2023-06-01";
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Host us-anthropic-exp.ctk.au.deloitte.com;
        proxy_set_header x-api-key "";

        proxy_pass https://us-anthropic-exp.ctk.au.deloitte.com;
        proxy_ssl_server_name on;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}

# ===========================================
# OpenAI Embeddings Proxy (port 8081)
# Routes RAG API embeddings through Deloitte
# AU gateway — no external API key needed.
# Strips "Bearer " prefix from Authorization
# and passes the JWT as x-id-token.
# ===========================================
server {
    listen 8081;
    client_max_body_size 25M;

    location / {
        set $bearer_token "";
        if ($http_authorization ~ "^Bearer (.+)$") {
            set $bearer_token $1;
        }

        proxy_set_header x-id-token $bearer_token;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Host au-openai-exp.ctk.au.deloitte.com;
        proxy_set_header Authorization "";

        proxy_pass https://au-openai-exp.ctk.au.deloitte.com/openai/v1/;
        proxy_ssl_server_name on;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
