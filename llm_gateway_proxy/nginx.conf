# Custom nginx.conf for the LLM Gateway proxy sidecar.
#
# This file replaces the default nginx.conf in order to load the njs module
# (ngx_http_js_module) at the top level, which is required before the http{} block.
# The njs module enables the azure_proxy.js handler that rewrites Azure AU/US
# requests from plain OpenAI format to the Azure OpenAI deployment path format.

load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /dev/stderr notice;
pid        /run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  # Match the 300s proxy_read_timeout used by all other proxy locations.
  # Without this, ngx.fetch (used by the Azure AU/US njs handler) applies its
  # default 60s timeout, which would cut off long-running SSE streaming responses.
  js_fetch_timeout 300s;

  # Import the njs azure proxy script.
  # azure_proxy.azureProxy handles Azure AU and Azure US locations,
  # extracting the model name from the request body and constructing
  # the correct /openai/deployments/{model}/chat/completions?api-version=... path.
  js_import azure_proxy from /etc/nginx/azure_proxy.js;

  include /etc/nginx/conf.d/*.conf;
}
