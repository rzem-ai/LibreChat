server {
  listen 8081;
  set $token_proxy_token "${TOKEN_PROXY_TOKEN}";

  location = /live {
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /health {
    default_type text/plain;

    if ($token_proxy_token = "") {
      return 503 "token unavailable\n";
    }

    return 200 "ok\n";
  }

  location /azure-au/ {
    if ($token_proxy_token = "") {
      return 503;
    }

    rewrite ^/azure-au/(.*)$ /$1 break;
    proxy_set_header x-sa-token "$token_proxy_token";
    proxy_set_header Authorization "Bearer $token_proxy_token";
    proxy_pass ${TOKEN_PROXY_AZURE_AU_URL};
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
  }

  location /azure-us/ {
    if ($token_proxy_token = "") {
      return 503;
    }

    rewrite ^/azure-us/(.*)$ /$1 break;
    proxy_set_header x-sa-token "$token_proxy_token";
    proxy_set_header Authorization "Bearer $token_proxy_token";
    proxy_pass ${TOKEN_PROXY_AZURE_US_URL};
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
  }

  location /vertexai/ {
    if ($token_proxy_token = "") {
      return 503;
    }

    rewrite ^/vertexai/(.*)$ /$1 break;
    proxy_set_header x-sa-token "$token_proxy_token";
    proxy_set_header Authorization "Bearer $token_proxy_token";
    proxy_pass ${TOKEN_PROXY_VERTEXAI_URL};
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
  }

  location /mcp {
    if ($token_proxy_token = "") {
      return 503;
    }

    proxy_set_header x-sa-token "$token_proxy_token";
    proxy_set_header Host $proxy_host;
    proxy_pass ${TOKEN_PROXY_MCP_URL};
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
  }
}