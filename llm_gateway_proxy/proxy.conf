# DNS resolver — populated at startup from /etc/resolv.conf by proxy.sh.
# Required by ngx.fetch() (njs) to resolve cluster-internal hostnames such as
# *.llm-gateway-ctnp.svc.cluster.local. valid=10s re-resolves every 10 seconds
# to handle kube-dns TTLs; ipv6=off avoids AAAA lookup failures in clusters
# where IPv6 is not configured.
resolver ${NGINX_RESOLVER} valid=10s ipv6=off;

# Verbose log format: includes request line, status, timing, upstream details,
# and the most useful diagnostic headers from both request and response.
log_format token_proxy_verbose '$remote_addr - [$time_local] "$request" '
                               'status=$status upstream_status=$upstream_status '
                               'request_time=$request_time upstream_time=$upstream_response_time '
                               'upstream_addr=$upstream_addr bytes_sent=$body_bytes_sent request_length=$request_length '
                               'content_type_in="$http_content_type" '
                               'content_type_out="$sent_http_content_type" '
                               'req_content_length="$http_content_length" '
                               'ua="$http_user_agent" '
                               'ref="$http_referer" '
                               'x_request_id="$http_x_request_id" '
                               'x_forwarded_for="$http_x_forwarded_for"';

server {
  listen 8081;
  access_log /dev/stdout token_proxy_verbose;

  # info level: captures r.log() calls from njs (which emit at info/notice).
  # This is the key change that makes all [azure_proxy] INFO lines visible.
  error_log /dev/stderr info;

  set $token_proxy_token "${TOKEN_PROXY_TOKEN}";

  # Upstream base URLs exposed as nginx variables so the njs azure_proxy handler can read them.
  # These are substituted from environment variables at container startup by proxy.sh (envsubst).
  set $token_proxy_azure_au_url "${TOKEN_PROXY_AZURE_AU_URL}";
  set $token_proxy_azure_us_url "${TOKEN_PROXY_AZURE_US_URL}";

  # Buffer the request body so the njs handler can read it.
  # Up to 1 MB is kept in memory; larger bodies may be written to a temp file.
  client_body_buffer_size 1m;
  client_max_body_size 10m;

  location = /live {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /health {
    access_log off;
    default_type text/plain;

    if ($token_proxy_token = "") {
      return 503 "token unavailable\n";
    }

    return 200 "ok\n";
  }

  # Azure AU (aus-east) — handled by njs azure_proxy.
  # The njs handler extracts the model name from the JSON request body and rewrites
  # the upstream path to the Azure OpenAI deployment format:
  #   /openai/deployments/{model}/chat/completions?api-version=2025-01-01-preview
  location /azure-au/ {
    client_body_in_single_buffer on;
    js_content azure_proxy.azureProxy;
  }

  # Azure US (eastus) — same njs handler, uses token_proxy_azure_us_url variable.
  location /azure-us/ {
    client_body_in_single_buffer on;
    js_content azure_proxy.azureProxy;
  }

  location /vertexai/ {
    if ($token_proxy_token = "") {
      return 503;
    }

    rewrite ^/vertexai/(.*)$ /$1 break;
    proxy_set_header x-sa-token "$token_proxy_token";
    proxy_pass ${TOKEN_PROXY_VERTEXAI_URL};
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
  }

  location /anthropic/ {
    if ($token_proxy_token = "") {
      return 503;
    }

    proxy_set_header x-sa-token "$token_proxy_token";
    proxy_pass ${TOKEN_PROXY_ANTHROPIC_URL};
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
  }

  location /mcp {
    if ($token_proxy_token = "") {
      return 503;
    }

    proxy_set_header x-sa-token "$token_proxy_token";
    proxy_set_header Host $proxy_host;
    proxy_pass ${TOKEN_PROXY_MCP_URL};
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
  }
}
