log_format token_proxy '$remote_addr - [$time_local] "$request" '
                      'status=$status upstream_status=$upstream_status '
                      'request_time=$request_time upstream_time=$upstream_response_time '
                      'upstream_addr=$upstream_addr bytes=$body_bytes_sent '
                      'ref="$http_referer" ua="$http_user_agent"';

server {
  listen 8081;
  access_log /dev/stdout token_proxy;
  error_log /dev/stderr warn;

  set $token_proxy_token "${TOKEN_PROXY_TOKEN}";

  # Upstream base URLs exposed as nginx variables so the njs azure_proxy handler can read them.
  # These are substituted from environment variables at container startup by proxy.sh (envsubst).
  set $token_proxy_azure_au_url "${TOKEN_PROXY_AZURE_AU_URL}";
  set $token_proxy_azure_us_url "${TOKEN_PROXY_AZURE_US_URL}";

  # Buffer the full request body in memory before njs reads it.
  # LibreChat chat completion requests are small JSON payloads (well under 1 MB).
  client_body_buffer_size 1m;
  client_max_body_size 10m;

  location = /live {
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /health {
    default_type text/plain;

    if ($token_proxy_token = "") {
      return 503 "token unavailable\n";
    }

    return 200 "ok\n";
  }

  # Azure AU (aus-east) — handled by njs azure_proxy.
  # The njs handler extracts the model name from the JSON request body and rewrites
  # the upstream path to the Azure OpenAI deployment format:
  #   /openai/deployments/{model}/chat/completions?api-version=2025-01-01-preview
  location /azure-au/ {
    js_content azure_proxy.azureProxy;
  }

  # Azure US (eastus) — same njs handler, uses token_proxy_azure_us_url variable.
  location /azure-us/ {
    js_content azure_proxy.azureProxy;
  }

  location /vertexai/ {
    if ($token_proxy_token = "") {
      return 503;
    }

    rewrite ^/vertexai/(.*)$ /$1 break;
    proxy_set_header x-sa-token "$token_proxy_token";
    proxy_pass ${TOKEN_PROXY_VERTEXAI_URL};
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
  }

  location /anthropic/ {
    if ($token_proxy_token = "") {
      return 503;
    }

    proxy_set_header x-sa-token "$token_proxy_token";
    proxy_pass ${TOKEN_PROXY_ANTHROPIC_URL};
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
  }

  location /mcp {
    if ($token_proxy_token = "") {
      return 503;
    }

    proxy_set_header x-sa-token "$token_proxy_token";
    proxy_set_header Host $proxy_host;
    proxy_pass ${TOKEN_PROXY_MCP_URL};
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
  }
}