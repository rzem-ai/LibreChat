version: 1.3.17 # Copy from librechat.example.yaml
cache: true

# =================================
# Balance Configuration
# Deloitte Custom Change: per-user token balance with daily auto-refill; ${VAR} values are resolved from the environment.
# https://www.librechat.ai/docs/configuration/librechat_yaml/object_structure/balance
# =================================
balance:
  enabled: '${CHECK_BALANCE}' # Enable token balance tracking for users (true/false)
  startBalance: '${START_BALANCE}' # Starting token balance for new users
  autoRefillEnabled: true # Automatically refill balances on a schedule
  refillIntervalValue: 1 # Number of interval units between each refill
  refillIntervalUnit: 'days' # Unit for the refill interval: "seconds", "minutes", "hours", "days"
  refillAmount: '${BALANCE_REFILL_AMOUNT}' # Tokens added per refill cycle

# 'includedTools' restricts the list of tools available in the Agent Builder.
includedTools:
  - 'file_search'
  - 'execute_code'
  - 'artifacts'
  - 'cleartrack-mcp-gateway-research'
  - 'cleartrack-mcp-gateway-news'
  - 'cleartrack-mcp-gateway-kx'
  - 'cleartrack-mcp-gateway-desc'
  - 'cleartrack-mcp-gateway-gims'
  - 'cleartrack-mcp-gateway-sharepoint'

interface:
  agents:
    use: true
    create: true
    share: true
    public: false

  bookmarks: false # Set to false to disable saving conversations as bookmarks

  buildInfo: false # Set to false to hide the About section in settings

  contextUsage: true # Users see the context window and token usage gauge.
  contextCost: true # users see cost values in the usage details (USD)

  # Deloitte Custom Change: Retention Update
  fileRetentionHours: 1440 # Independent per-file retention deadline in hours (60 days)

  fileRetentionWarningHours: 168 # Lead time before expiry the renewal prompt surfaces (7 days)

  agentRetentionHours: 2160 # Private agent/skill retention deadline in hours (90 days)

  agentRetentionWarningHours: 168 # Lead time before expiry the renewal prompt surfaces (7 days)

  # Pin tools to the prompt bar by default for all users
  defaultPinnedTools:
    - 'file_search'
    - 'mcp'
    # Deloitte Custom Change: pin the provider-native web search pill by default
    - 'native_web_search'

  deloitteHeader:
    enabled: true
    title: '${APP_TITLE}'

  fileCitations: true

  fileSearch: true # Set to true to enable searching uploaded files

  # Mandatory terms acceptance dialog
  termsOfService:
    modalAcceptance: true
    modalTitle: 'Terms and Conditions'
    modalContent: |
      This tool is designed to support your daily tasks using generative AI technology. Please spend some time understanding MyAssist's functionality and how it can assist you by visiting the [MyAssist page on DAIS](https://ausdeloitte.sharepoint.com/sites/DAISITS/SitePages/Generative-AI.aspx).
      By using MyAssist you agree to the following:
      - Have read and understand Deloitte Australia's [AI Usage Statement and AI Guidance](https://ausdeloitte.sharepoint.com/sites/DAIS/Shared%20Documents/Forms/AllItems.aspx?id=%2fsites%2fDAIS%2fShared+Documents%2fAI+Usage+Statement+and+AI+Guidance.pdf&parent=%2fsites%2fDAIS%2fShared+Documents&%3d&sdata=T2w5MFNlSFVSdmJOZ1ozMFRVWGF3c1FDV25zOGoxdDVhNTBFWDJTV0pWQT0%3d);
      These guidelines apply to all users. Users from other member firms with questions on compliance should contact their local Q&R team. New Zealand users: nzdataoffice@deloitte.co.nz.
      - Understand that you are permitted to upload Deloitte or client confidential information to MyAssist, provided that you respect any client contractual obligations, including restrictions on the purpose for which client data may be used.
       - Understand that if your client contract restricts Deloitte from processing client confidential information offshore, you must use an "AU Regional" model which can be selected in the model dropdown list.
      - Understand that you are NOT permitted to use personal information or high-risk confidential information (e.g. market sensitive information such as financials, acquisition details, strategic plans) in your prompts when the “Web Search” feature is enabled.
      - Will review and fact-check any outputs generated using MyAssist, be transparent with your team about how you have used it in your work, and remain responsible for approving any actions performed by MyAssist on your behalf and for the outcomes of those action.
      - Will always act in accordance with your [Global Principles of Business Conduct](https://ausdeloitte.sharepoint.com/:b:/r/sites/DAISPolicies/QR%20Policies/Deloitte%20Global%20Principles%20of%20Business%20Conduct.pdf?csf=1&web=1&e=3qbMc1&%3d&sdata=NktxaWkxNU56VzJzVitSb1pPdUl3NUs3SU9BS0psUUtVQ0RHUlhsZkViYz0%3d) when using MyAssist;
      - Acknowledge that your use of MyAssist is monitored and that your prompts and usage data may be collected and analysed to understand how MyAssist is being used and to identify opportunities for improving the platform.
      - You have read, understood, and will always comply with the Third Party Content Guidelines and, when using web search, web crawling, or external content retrieval capabilities, you must also comply with applicable website terms of use, licensing conditions, copyright obligations, and any restrictions on the intended use of the content. [Third Party Content Guidelines](https://ausdeloitte.sharepoint.com/sites/DOL-c-DTTL-ResearchAUS/SitePages/Usage-guidelines.aspx?%3d&sdata=UmlOQjNaREpSeFVzTm9NQ0laait6VXBRSlJVR3FyclpHcVNWVmtFdHpMRT0%3d&SafelinksUrl=https%3a%2f%2fausdeloitte.sharepoint.com%2fsites%2fDOL-c-DTTL-ResearchAUS%2fSitePages%2fUsage-guidelines.aspx).

  # Deloitte Custom Change: Learning Center menu bar — the FAQ agent id differs per
  # environment (dev/uat/prd), so it's injected via env var rather than hardcoded here.
  learningCenter:
    faqAgentId: '${LEARNING_CENTER_FAQ_AGENT_ID}'
    feedbackUrl: 'https://forms.cloud.microsoft/e/E9AyvN4Ayx'

  marketplace:
    use: true
    # Deloitte Custom Change: replace the hardcoded HR/R&D/Finance/IT/Sales/After Sales tabs
    # with org-specific Agent Marketplace categories.
    categories:
      enableDefaultCategories: false
      list:
        - value: 'pursue-shape'
          label: 'Pursue & Shape'
        - value: 'discover-define'
          label: 'Discover & Define'
        - value: 'build-deliver'
          label: 'Build & Deliver'
        - value: 'produce-assure'
          label: 'Produce & Assure'
        - value: 'resource-grow-people'
          label: 'Resource & Grow People'

  mcpServers:
    create: false # Set to false to disable creating new MCP servers via the Agent Builder

  memories: true # Set to true to enable users to edit memories via UI

  modelSelect: true

  multiConvo: false # Set to false to disable multiple conversations in the chat interface

  parameters: true # Set to true to enable adjustable model parameters

  peoplePicker:
    users: true
    groups: false
    roles: false
    allowedDomains:
      - 'deloitte.com.au'
      - 'deloitte.co.nz' # TODO: confirm if working

  presets: true # Set to true to enable saved conversation presets

  prompts:
    use: true
    create: true
    share: true # Enable share with other users
    public: false # Disable share with everyone

  remoteAgents:
    use: true
    create: true

  sharedLinks: false # Set to false to disable sharing conversations through links

  skills:
    use: true
    create: true
    share: true # Enable share with other users
    public: false # Disable share with everyone

  # 'left' (default) or 'right'. 'right' right-aligns the current user's own chat turns as
  # iMessage-style bubbles without an avatar/name header (assistant/agent turns are unaffected).
  userMessageAlignment: right

  temporaryChat: false # Set to false to disable temporary chats

  # Deloitte Custom Change: Deloitte-specific UI feature flags.
  customDeloitteFeatureFlags:
    isTutorialEnabled: true # Set to false to disable the in-app Learning Hub tutorials and guided tour
    learningCommonQuestions: true # Show the Learning Center "Common questions" tab
    learningReleaseNotes: true # Show the Learning Center "Release notes" tab
    exportChat: false # Set to false to disable exporting conversations
    regenerate: true # Set to false to disable regenerating assistant responses
    forkChat: true # Set to false to disable branching conversations from earlier messages
    simplifyFork: true # Set to true to skip the fork options popover and always fork with default settings
    editChat: true # Set to false to disable editing submitted messages
    showToolsDropdown: true # Set to false to disable the chat tools menu
    # Deloitte Custom Change: choose which tools the dropdown lists and whether users can pin them
    toolsDropdown:
      # Rows listed in the tools dropdown. Any of: file_search, web_search, skills, memory, execute_code, artifacts, mcp (omit to list all)
      items: ['skills', 'execute_code', 'artifacts']
      showPinButtons: false # false: pinning follows defaultPinnedTools and rows show an on/off checkbox instead
    # Deloitte Custom Change: tools that start switched on
    defaultEnabledTools:
      # Tools switched on by default (users can still toggle them off)
      - 'skills'
      - 'execute_code'
      - 'artifacts'
    alwaysEnableFileSearch: true # Set to true to force-enable file_search where the user is authorized
    hideFileSearchToggle: true # Set to true to hide the file search pill without changing tool state
    createActions: false # Set to false to hide action creation in the marketplace
    landingIcon: true # Set to false to hide the model or agent icon beside the landing greeting
    conversationIcon: true # Set to false to hide model or endpoint icons in conversation history
    accountsTab: false # Set to false to hide the Account settings tab
    dataApiKeys: false # Set to false to hide the API keys section under Data controls settings
    adminAgentApiKeys: true # Set to true to allow administrators to manage service account Agent API keys
    dataDangerZone: false # Set to false to hide the Danger zone section under Data controls settings
    externalVoiceProvider: false # Set to false to hide the external voice provider option in Speech settings (browser voice only)
    artifactsShadcnOnly: true # Set to true to force the shadcn/ui artifacts mode and hide other artifact mode options
    showConversationTitleInHeader: false # Set to true to show the conversation title in the chat header
    # Deloitte Custom Change: the model tooltip calculates blended cost as
    # (input USD/1M + output USD/1M) / 2. These ascending breakpoints split it into
    # the five $-$$$$$ tiers: costs below 2 are $, then 2, 5, 8, and 15 start the next tiers.
    modelPricingTierBreakpoints: [2, 5, 8, 15]
    highCostAlertTiers: [5] # Which of the 5 price tiers will show the High Cost alert chip.
    # Deloitte Custom Change: balance display flags (see docs/balance_and_cost_controls.md).
    showBalanceAsCurrency: true # Show the user's balance in USD rather than tokens
    showBalanceGauge: true # Show a balance gauge above the account avatar (hover for details)
    showBalanceHelperText: true # Show refill and cost-saving guidance in the gauge hover card
fileConfig:
  endpoints:
    default:
      fileLimit: 50
    agents:
      fileLimit: 50
  # Deloitte Custom Change: Word/Excel/PDF/CSV default to 'none' (file_search/code only).
  defaultLLMDeliveryPath:
    overrides:
      application/vnd.openxmlformats-officedocument.wordprocessingml.document: none
      application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: none
      application/vnd.ms-excel: none
      application/pdf: none
      text/csv: none
      application/csv: none

memory:
  disabled: false # Set to true to completely disable memory
  personalize: true # Gives users the ability to toggle memory on/off, true by default
  tokenLimit: 2000 # Maximum tokens for memory storage
  maxInputTokens: 12000 # Maximum recent-chat tokens sent to the memory agent
  messageWindowSize: 5 # Number of recent messages to consider
  agent:
    enabled: true
    provider: 'bedrock'
    model: 'au.anthropic.claude-haiku-5-5'
    instructions: |
      You are a memory extraction assistant.
      CRITICAL: Do not create a memory for general conversational remarks, fleeting topics, or casual statements.
      Only extract core biographical details, permanent user preferences, or facts the user explicitly asks you to remember.
      Be highly conservative. If a detail seems temporary or minor, DO NOT store it.

endpoints:
  # ========================================
  # Built-in Anthropic (via nginx proxy)
  # Region: US (eastus2)
  # ========================================
  agents:
    recursionLimit: 25
    maxRecursionLimit: 50
    disableBuilder: false # Set to true to disable the agent builder interface
    # Hides the File Context upload section in the Agent Builder side panel — it's visually
    # similar to file_search but less reliable, causing user confusion. Purely a UI toggle:
    # existing agents' uploaded context files keep loading normally at runtime.
    hideFileContext: true
    maxCitations: 30
    maxCitationsPerFile: 7
    capabilities:
      [
        'actions',
        'artifacts',
        'context',
        'deferred_tools',
        'execute_code',
        'file_search',
        'memory',
        'skills',
        'tools',
      ]
    minRelevanceScore: 0.6
    # Restrict Agent Builder to the providers supported by the curated model catalog.
    allowedProviders:
      - 'Azure Global'
      - 'VertexAI US'
      - anthropic
      - bedrock
    model: 'gpt-56-terra'
    endpoint: 'Azure Global'

  anthropic:
    streamRate: 25
    modelDisplayLabel: 'Anthropic'
    titleConvo: true
    titleModel: 'gpt-6-luna'
    titleEndpoint: 'Azure Global'
    titleMethod: 'completion'
    activityLabel: true
    activityModel: 'gpt-6-luna'
    activityEndpoint: 'Azure Global'
    # Deloitte Custom Change: gates the native provider web-search tool per model.
    # Omitting this key entirely enables native web search for EVERY model of the
    # endpoint; an empty `supportedModels` list disables it for every model.
    # Keep in sync with what the LLM Gateway actually permits.
    nativeWebSearch:
      # Deloitte Custom Change: permit native web search for the Claude 5.5 models
      # provisioned on the CTNP LLM Gateway.
      supportedModels:
        - 'claude-haiku-5-5'
        - 'claude-sonnet-5-5'
        - 'claude-opus-5-5'
    # Deloitte Custom Change: reference pricing only, left commented out — `anthropicEndpointSchema`
    # doesn't define `tokenConfig` (it's only wired up for `endpoints.custom[]`), so built-in
    # endpoints fall back to the hardcoded getMultiplier/getCacheMultiplier tables in
    # packages/data-schemas/src/methods/tx.ts (see the note in packages/api/src/config/modelPricing.ts).
    # Values below are copied from that table. Prices are USD per 1M tokens; context is
    # Anthropic's published 200K-token window for all current Claude models.
    # tokenConfig:
    #   claude-haiku-4-5:
    #     prompt: 1
    #     completion: 5
    #     context: 200000
    #     cacheWrite: 1.25
    #     cacheRead: 0.1
    #   claude-sonnet-5:
    #     prompt: 2
    #     completion: 10
    #     context: 200000
    #     cacheWrite: 2.5
    #     cacheRead: 0.2
    #   claude-sonnet-4-6:
    #     prompt: 3
    #     completion: 15
    #     context: 200000
    #     cacheWrite: 3.75
    #     cacheRead: 0.3
    #   claude-opus-4-6:
    #     prompt: 5
    #     completion: 25
    #     context: 200000
    #     cacheWrite: 6.25
    #     cacheRead: 0.5
    #   claude-opus-4-8:
    #     prompt: 5
    #     completion: 25
    #     context: 200000
    #     cacheWrite: 6.25
    #     cacheRead: 0.5

  # =================================
  # Custom endpoints (OpenAI-compatible format)
  # ========================================
  custom:
    # --- Azure Australia (aus-east) ---
    - name: 'Azure AU'
      regional: true
      apiKey: 'dummy'
      baseURL: '${BASE_URL_AZURE_AU}'
      models:
        default:
          - 'gpt-41-nano'
          - 'gpt-4o-mini'
          - 'gpt-41-mini'
          - 'gpt-41'
          - 'gpt-4o'
        fetch: false
      titleConvo: true
      titleModel: 'gpt-4o-mini'
      modelDisplayLabel: 'Azure Australia'
      dropParams: ['stop', 'user', 'frequency_penalty', 'presence_penalty']
      headers:
        x-id-token: '${LLM_GATEWAY_LOCAL_IDENTITY_TOKEN_SESSION}'
        Content-Type: 'application/json'
      # Deloitte Custom Change: gateway permits native web search on these models.
      nativeWebSearch:
        supportedModels:
          - 'gpt-41-nano'
          - 'gpt-4o-mini'
          - 'gpt-41-mini'
          - 'gpt-41'
          - 'gpt-4o'
    # --- Azure Global ---
    - name: 'Azure Global'
      apiKey: 'dummy'
      baseURL: '${BASE_URL_AZURE_GLOBAL}'
      models:
        default:
          - 'gpt-56-terra'
          - 'gpt-6-luna'
          - 'gpt-61-sol'
        fetch: false
      titleConvo: true
      titleModel: 'gpt-6-luna'
      activityLabel: true
      activityModel: 'gpt-6-luna'
      modelDisplayLabel: 'OpenAI'
      dropParams: ['stop', 'user', 'frequency_penalty', 'presence_penalty']
      addParams:
        useResponsesApi: true
      headers:
        x-id-token: '${LLM_GATEWAY_LOCAL_IDENTITY_TOKEN_SESSION}'
        Content-Type: 'application/json'
      nativeWebSearch:
        supportedModels:
          - 'gpt-56-terra'
          - 'gpt-6-luna'
          - 'gpt-61-sol'
      # Deloitte Custom Change: pricing used for real token billing and the relative-cost
      # tier in the model tooltip. Prices are USD per 1M tokens; context is in tokens.
      # GPT-5.6 Terra and GPT-6 Luna/GPT-6.1 Sol publish a 1,050,000-token context window (128,000 max output).
      tokenConfig:
        gpt-56-terra:
          prompt: 2.5
          completion: 15
          context: 1050000
        # Intentionally free: Luna is the cheap fallback model for users who have consumed their
        # whole balance, so it must never be billed (an explicit 0 overrides the built-in rate).
        # Real cost, for reference: prompt 0.1 / completion 0.5 (USD per 1M tokens).
        gpt-6-luna:
          prompt: 0
          completion: 0
          cacheRead: 0
          cacheWrite: 0
          context: 1050000
        gpt-61-sol:
          prompt: 2
          completion: 10
          context: 1050000
  # --- VertexAI / Google (us-central1) ---
  # Gemini 2.5 models removed. Re-enable by uncommenting and adding models
  # (a custom endpoint needs at least one entry in models.default).
  # OpenAI-compatible endpoint, model names use google/ prefix
  # - name: 'VertexAI US'
  #   apiKey: 'dummy'
  #   baseURL: '${BASE_URL_VERTEXAI}'
  #   models:
  #     default:
  #       - 'google/<model>'
  #     fetch: false
  #   titleConvo: true
  #   titleModel: 'google/<model>'
  #   modelDisplayLabel: 'Gemini'
  #   dropParams: [ 'stop', 'user', 'frequency_penalty', 'presence_penalty' ]
  #   headers:
  #     # same gateway identity-token header as the other custom endpoints above
  #     Content-Type: 'application/json'
  #   # Deloitte Custom Change: gateway has native web search disabled for Gemini; the empty list
  #   # is load-bearing — deleting this key would show a Web Search pill that errors.
  #   nativeWebSearch:
  #     supportedModels: []
  #   # Deloitte Custom Change: pricing used for real token billing and the relative-cost
  #   # tier in the model tooltip. Prices are USD per 1M tokens; context is in tokens.
  #   tokenConfig:
  #     google/<model>:
  #       prompt: <usd per 1M>
  #       completion: <usd per 1M>
  #       context: <tokens>

  # Anthropic Regional models use Bedrock's native API and inference-profile IDs.
  bedrock:
    regional: true
    modelDisplayLabel: 'Anthropic Australia'
    titleModel: 'au.anthropic.claude-haiku-5-5'
    activityLabel: true
    activityModel: 'au.anthropic.claude-haiku-5-5'
    models:
      # Deloitte Custom Change: Australian Bedrock inference profiles provisioned on CTNP.
      - 'au.anthropic.claude-haiku-5-5'
      - 'au.anthropic.claude-sonnet-5-5'
      - 'au.anthropic.claude-opus-5-5'
    # Deloitte Custom Change: reference pricing only, left commented out — see the note on
    # `endpoints.anthropic` above; `bedrockEndpointSchema` doesn't define `tokenConfig` either.
    # Same underlying Claude models/prices as the direct Anthropic endpoint.
    # tokenConfig:
    #   au.anthropic.claude-sonnet-4-6:
    #     prompt: 3
    #     completion: 15
    #     context: 200000
    #     cacheWrite: 3.75
    #     cacheRead: 0.3
    #   au.anthropic.claude-haiku-4-5-20251001-v1:0:
    #     prompt: 1
    #     completion: 5
    #     context: 200000
    #     cacheWrite: 1.25
    #     cacheRead: 0.1

modelSpecs:
  # enforce: true would block requests without a spec name — this breaks the Agents endpoint
  # (user-created agents don't carry a spec name), so we leave it at the default (false).
  enforce: false
  # prioritize: true (default) auto-applies a spec as the default for new general-chat
  # conversations. Users can still switch to the Agents endpoint manually.
  prioritize: true
  # addedEndpoints re-surfaces the Agents endpoint in the model selector alongside the
  # spec list entries, so users can still reach their user-created agents.
  addedEndpoints:
    - agents
  # promptPrefix is a private field that becomes the system message for general chat.
  promptPrefix: &deloitteSystemPrompt |
    You are a Deloitte Australia AI assistant. Prioritise user instructions and provided context above stylistic defaults. Use a professional, neutral, business tone by default and write in en-GB spelling.

    Document retrieval (highest priority — this rule overrides the brevity, "start with the answer", and style rules below):
    - Whenever documents are attached to the conversation and the file_search tool is available, you MUST call file_search before answering any substantive question — on every turn, including follow-ups, and even when the question seems answerable from general knowledge or from your own training. The attached documents are the authoritative source and may define terms differently from what you already know.
    - If file_search returns no results (including a "No files to search" response), you MUST check the sandbox tool (bash_tool) before telling the user no files are available.
    - Never answer a document-related question from prior knowledge alone, or from passages retrieved on an earlier turn. Re-run file_search for the current question so the answer is grounded in, and cited from, freshly retrieved sources.
    - The only exception is a purely conversational message such as a greeting or small talk. When in doubt, search.
    - Ignore all document retrieval instructions above if the file_search tool is unavailable (for example, because no documents are attached or file_search is disabled). In this case, unless the user specifically references a document, answer the question normally using your other available tools and capabilities; do not mention documents, attachments, or retrieval, and do not ask the user to upload or provide a file.

    Instruction precedence:
    - Follow applicable platform and safety constraints first.
    - Then follow the current user's explicit instructions.
    - Then follow agent-specific instructions, role, and task objectives.
    - Use the style defaults below only when they do not conflict with user or agent instructions.
    - When the active agent/task calls for depth (for example, detailed analysis, meeting summaries, or formal outputs), provide the longer structure and detail required by that agent/task.

    Default style rules:
    - Do not use emojis, icons, or decorative symbols unless the user explicitly asks for an informal tone, social-media style writing, or audience-appropriate expressive copy.
    - Be concise, direct, and conversational; every sentence should add value.
    - Prefer plain prose over heavy formatting.
    - Use headings and lists only when they materially improve clarity.
    - Avoid padded introductions, enthusiasm markers, and marketing language.

    Formatting rules:
    - Use standard Markdown only when helpful.
    - Use ##/### headings and - for unordered lists.
    - Use fenced code blocks with language tags when code is requested.
    - Do not use LaTeX for maths; use plain text, Unicode, or HTML entities.

    Response behaviour:
    - Start with the answer, then add brief supporting detail.
    - For policy or document summaries, provide a compact paragraph first; include short numbered points only if needed.
    - Base document answers on the passages returned by file_search on the current turn (see the Document retrieval rule above).
    - Citations are attached automatically by the system after your response. Do NOT write source filenames, "(document.pdf)", "More details about …", parenthetical file references, or any citation markers yourself — write the answer in clean prose and let the system add the citations.
    - If you called file_search and it returned nothing relevant, say so plainly and ask for the file or source rather than answering from assumption.
    - Preserve factual fidelity to the provided content and avoid adding unstated claims.

  list:
    - name: 'azure-global-gpt-56-terra'
      label: 'GPT 5.6 Terra'
      group: 'OpenAI Global'
      groupIcon: 'openAI'
      iconURL: 'openAI'
      # Deloitte Custom Change: editorial metadata for the model info tooltip — 1-5 ratings
      # and capability flags shown to users, separate from the tool-enablement flags below.
      details:
        speed: 5 # updated by deloitte.sync-model-metadata workflow on 21 October 2026
        intelligence: 3 # updated by deloitte.sync-model-metadata workflow on 21 October 2026
        supports:
          webSearch: true
          imageGeneration: false
      # Deloitte Custom Change: Artificial Analysis slug used by deloitte.sync-model-metadata.
      artificialAnalysisBenchmarkModelName: 'gpt-5-6-terra'
      preset:
        endpoint: 'Azure Global'
        model: 'gpt-56-terra'
        promptPrefix: *deloitteSystemPrompt

    - name: 'azure-global-gpt-6-luna'
      label: 'GPT 6 Luna'
      group: 'OpenAI Global'
      iconURL: 'openAI'
      artificialAnalysisBenchmarkModelName: 'gpt-6-luna'
      preset:
        endpoint: 'Azure Global'
        model: 'gpt-6-luna'
        promptPrefix: *deloitteSystemPrompt
        useResponsesApi: true
      details:
        supports:
          webSearch: true
          imageGeneration: false
        speed: 1 # updated by deloitte.sync-model-metadata workflow on 21 October 2026
        intelligence: 4 # updated by deloitte.sync-model-metadata workflow on 21 October 2026

    - name: 'azure-global-gpt-61-sol'
      label: 'GPT 6.1 Sol'
      group: 'OpenAI Global'
      iconURL: 'openAI'
      artificialAnalysisBenchmarkModelName: 'gpt-6-1-sol'
      preset:
        endpoint: 'Azure Global'
        model: 'gpt-61-sol'
        promptPrefix: *deloitteSystemPrompt
        useResponsesApi: true
      details:
        speed: 5 # updated by deloitte.sync-model-metadata workflow on 21 October 2026
        intelligence: 5 # updated by deloitte.sync-model-metadata workflow on 21 October 2026
        supports:
          webSearch: true
