# MCP Servers configuration
# Each entry filters the gateway to a single toolset via the `toolsets` query param.
# See documentation: https://github.com/Deloitte-Australia/ea-mcp-gateway/blob/feature/prototype/docs/MCP_Gateway_Wiki.md
mcpServers:
  # https://www.librechat.ai/docs/features/mcp
  # Deloitte Custom Change: do NOT rename the `-research` (IBISWorld) and `-news` (AFR) keys to
  # match their `toolsets` values. The key is the stable server ID baked into saved agent tool IDs
  # (`<tool>_mcp_<serverKey>`), agents' `mcpServerNames`, and users' persisted connector selections.
  # Renaming makes handleTools skip those tools and useMCPSelect prune the selections, silently
  # breaking existing agents. Change only the `toolsets` query param, unless stored references are migrated.
  cleartrack-mcp-gateway-research:
    title: 'IBISWorld'
    parentGroup: 'ClearTrack MCP'
    type: streamable-http
    url: '${MCP_GATEWAY_URL}?toolsets=research'
    # Trust classifications from operator-managed ClearTrack gateways.
    trustedToolClassification: true
    obo:
      scopes: '${MCP_GATEWAY_OBO_SCOPE}'
    iconPath: '/assets/mcp/ibisworld.png' # same logo in both themes

  cleartrack-mcp-gateway-news:
    # see the note above: keep this key stable
    title: 'AFR News'
    parentGroup: 'ClearTrack MCP'
    type: streamable-http
    url: '${MCP_GATEWAY_URL}?toolsets=news'
    trustedToolClassification: true
    obo:
      scopes: '${MCP_GATEWAY_OBO_SCOPE}'
    iconPath: '/assets/mcp/afr.png' # same logo in both themes

  cleartrack-mcp-gateway-kx:
    title: 'KX and DPN'
    parentGroup: 'ClearTrack MCP'
    type: streamable-http
    url: '${MCP_GATEWAY_URL}?toolsets=kx'
    trustedToolClassification: true
    obo:
      scopes: '${MCP_GATEWAY_OBO_SCOPE}'
    iconPathLight: '/assets/mcp/kx-light.png'
    iconPathDark: '/assets/mcp/kx-dark.png'

  cleartrack-mcp-gateway-desc:
    title: 'DESC'
    parentGroup: 'ClearTrack MCP'
    type: streamable-http
    url: '${MCP_GATEWAY_URL}?toolsets=desc'
    trustedToolClassification: true
    obo:
      scopes: '${MCP_GATEWAY_OBO_SCOPE}'
    iconPathLight: '/assets/mcp/deloitte-light.png' # placeholder: no dedicated DESC logo yet
    iconPathDark: '/assets/mcp/deloitte-dark.png' # placeholder: no dedicated DESC logo yet

  cleartrack-mcp-gateway-gims:
    title: 'GIMS'
    parentGroup: 'ClearTrack MCP'
    type: streamable-http
    url: '${MCP_GATEWAY_URL}?toolsets=gims'
    trustedToolClassification: true
    obo:
      scopes: '${MCP_GATEWAY_OBO_SCOPE}'
    iconPathLight: '/assets/mcp/deloitte-light.png' # placeholder: no dedicated GIMS logo yet
    iconPathDark: '/assets/mcp/deloitte-dark.png' # placeholder: no dedicated GIMS logo yet

  cleartrack-mcp-gateway-sharepoint:
    title: 'SharePoint'
    parentGroup: 'ClearTrack MCP'
    type: streamable-http
    url: '${MCP_GATEWAY_URL}?toolsets=sharepoint'
    trustedToolClassification: true
    obo:
      scopes: '${MCP_GATEWAY_OBO_SCOPE}'
    # Deloitte Custom Change: Only this trusted tool may receive current-request attachment bytes.
    attachmentUploadTools:
      - sp_upload_file
    iconPathLight: '/assets/mcp/sharepoint-light.png'
    iconPathDark: '/assets/mcp/sharepoint-dark.png'
    limitedAccess: true
    # Deloitte Custom Change: restrict SharePoint to its Entra security group.
    allowedEntraGroupIds:
      - '00c0efc7-e8a7-448c-9480-834cbf1ebd60'
#    oauth_headers:
#      X-Custom-Header: "custom_value"

mcpSettings:
  allowedDomains:
    - mcp-gw-dev.ctk.au.deloitte.com
    - mcp-gateway.ctk.au.deloitte.com
  # Deloitte Custom Change: The trusted SharePoint gateway returns a short-lived download URL;
  # LibreChat validates and streams it server-side to Code Interpreter.
  codeFileAllowedDomains:
    - '*.sharepoint.com'
    # Required for the trusted SharePoint gateway download URL.
    - 'https://mcp-gw-dev.ctk.au.deloitte.com'
    - 'https://mcp-gateway.ctk.au.deloitte.com'

speech:
  # https://www.librechat.ai/docs/configuration/librechat_yaml/object_structure/speech
  speechTab:
    conversationMode: true
    advancedMode: false
    # Deloitte Custom Change: disable STT and TTS by default in response to user feedback.
    speechToText: false
    textToSpeech: false
    # textToSpeech:
    #   engineTTS: "elevenlabs"
    #   voice: "Rachel"
    #   languageTTS: "en"
    #   automaticPlayback: false
    #   playbackRate: 1.0
    #   cacheTTS: true
  tts:
    elevenlabs:
      apiKey: '${TTS_API_KEY}'
      model: 'eleven_multilingual_v2'
      voices:
        - '5GZaeOOG7yqLdoTRsaa6' # Rachel
        # - 'DTLT09E2cxHF0DqjKVbc' # Paul
