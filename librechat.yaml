version: 1.3.13 # Copy from librechat.example.yaml
cache: true

interface:
  agents:
    use: true
    create: true
    share: false
    public: false

  bookmarks: true

  # Pin tools to the prompt bar by default for all users
  defaultPinnedTools:
    - 'file_search'
    - 'skills'
    - 'execute_code'
    - 'mcp'

  deloitteHeader:
    enabled: true
    title: "${APP_TITLE}"

  fileCitations: true

  fileSearch: true

  # Mandatory terms acceptance dialog
  termsOfService:
    modalAcceptance: true
    modalTitle: 'Terms and Conditions'
    modalContent: |
      This tool is designed to support your daily tasks using generative AI technology. Please spend some time understanding MyAssist's functionality and how it can assist you by visiting the [MyAssist page on DAIS](https://ausdeloitte.sharepoint.com/sites/DAISITS/SitePages/Generative-AI.aspx).
      By using MyAssist you agree to the following:
      - Have read and understand Deloitte Australia's [AI Usage Statement and AI Guidance](https://ausdeloitte.sharepoint.com/sites/DAIS/Shared%20Documents/Forms/AllItems.aspx?id=%2fsites%2fDAIS%2fShared+Documents%2fAI+Usage+Statement+and+AI+Guidance.pdf&parent=%2fsites%2fDAIS%2fShared+Documents&&sdata=UmRNR3M3eDB4d3RhT0N0YlloQmh5OUIrTFc5RGswR1NsNFhYV0xaSjc0TT0%3d);
      These guidelines apply to all users. Users from other member firms with questions on compliance should contact their local Q&R team. New Zealand users: nzdataoffice@deloitte.co.nz.
      - Understand that you are permitted to upload Deloitte or client confidential information to MyAssist, provided that you respect any client contractual obligations, including restrictions on the purpose for which client data may be used.
      - Understand that if your client contract restricts Deloitte from processing client confidential information offshore, you must enable “AU-hosted models” via the toggle in any MyAssist app;
      - Understand that you are NOT permitted to use personal information or high-risk confidential information (e.g. market sensitive information such as financials, acquisition details, strategic plans) in your prompts when the “Web Search” feature is enabled.
      - Will review and fact check any outputs generated using MyAssist and be transparent with your team about how you have used MyAssist in your work;
      - Will always act in accordance with your [Global Principles of Business Conduct](https://ausdeloitte.sharepoint.com/:b:/r/sites/DAISPolicies/QR%20Policies/Deloitte%20Global%20Principles%20of%20Business%20Conduct.pdf?csf=1&web=1&e=3qbMc1) when using MyAssist;
      - Acknowledge that your use of MyAssist is monitored and that your prompts and usage data may be collected and analysed to understand how MyAssist is being used and to identify opportunities for improving the platform.
      - Have read, understood, and will always comply with the [Third Party Content Guidelines](https://ausdeloitte.sharepoint.com/sites/DOL-c-DTTL-ResearchAUS/SitePages/Usage-guidelines.aspx#genai-third-party-content-guidelines).
 
  marketplace:
    use: true

  modelSelect: true

  multiConvo: true

  parameters: true

  presets: true

  prompts:
    use: true
    create: true
    share: false # Enable share with other users
    public: false # Disable share with everyone

  peoplePicker:
    users: true
    groups: false
    roles: false
    allowedDomains:
      - 'deloitte.com.au'
      - 'deloitte.co.nz'

  remoteAgents:
    use: true
    create: true

  skills:
    use: true
    create: true
    share: true # Enable share with other users
    public: false # Disable share with everyone

fileConfig:
  endpoints:
    default:
      fileLimit: 50
    agents:
      fileLimit: 50

endpoints:
  # ========================================
  # Built-in Anthropic (via nginx proxy)
  # Region: US (eastus2)
  # ========================================
  agents:
    recursionLimit: 25
    maxRecursionLimit: 50
    disableBuilder: false
    maxCitations: 30
    maxCitationsPerFile: 7
    capabilities: ["actions", "artifacts", "context", "deferred_tools", "execute_code", "file_search", "skills", "tools"]
    minRelevanceScore: 0.3
    # Default model for new agents — uses Azure AU custom endpoint (confirmed working)
    model: "gpt-4o-mini"
    endpoint: "Azure AU"

  anthropic:
    userProvide: false
    streamRate: 25
    titleConvo: true
    titleModel: "claude-haiku-4-5"
    titleMethod: "completion"

  # ========================================
  # Custom endpoints (OpenAI-compatible format)
  # ========================================
  custom:
    # --- Azure AU (aus-east) ---
    - name: "Azure AU"
      apiKey: "dummy"
      baseURL: "${BASE_URL_AZURE_AU}"
      models:
        default:
          - "gpt-4o-mini"
          - "gpt-4o"
          - "gpt-41"
          - "gpt-41-nano"
          - "gpt-41-mini"
        fetch: false
      titleConvo: true
      titleModel: "gpt-4o-mini"
      modelDisplayLabel: "Azure AU"
      dropParams: ["stop", "user", "frequency_penalty", "presence_penalty"]
      headers:
        x-id-token: "${LLM_GATEWAY_LOCAL_IDENTITY_TOKEN_SESSION}"
        Content-Type: "application/json"

    # --- Azure US (eastus) ---
    - name: "Azure US"
      apiKey: "dummy"
      baseURL: "${BASE_URL_AZURE_US}"
      models:
        default:
          - "gpt-5-chat"
          - "gpt-5-mini"
          - "gpt-5-nano"
        fetch: false
      titleConvo: true
      titleModel: "gpt-5-nano"
      modelDisplayLabel: "Azure US"
      dropParams: ["stop", "user", "frequency_penalty", "presence_penalty"]
      headers:
        x-id-token: "${LLM_GATEWAY_LOCAL_IDENTITY_TOKEN_SESSION}"
        Content-Type: "application/json"

    # --- VertexAI / Google (us-central1) ---
    # OpenAI-compatible endpoint, model names use google/ prefix
    - name: "VertexAI US"
      apiKey: "dummy"
      baseURL: "${BASE_URL_VERTEXAI}"
      models:
        default:
          - "google/gemini-2.5-flash"
          - "google/gemini-2.5-pro"
        fetch: false
      titleConvo: true
      titleModel: "google/gemini-2.5-flash"
      modelDisplayLabel: "VertexAI US"
      dropParams: ["stop", "user", "frequency_penalty", "presence_penalty"]
      headers:
        x-id-token: "${LLM_GATEWAY_LOCAL_IDENTITY_TOKEN_SESSION}"
        Content-Type: "application/json"

modelSpecs:
  # enforce: true would block requests without a spec name — this breaks the Agents endpoint
  # (user-created agents don't carry a spec name), so we leave it at the default (false).
  enforce: false
  # prioritize: true (default) auto-applies a spec as the default for new general-chat
  # conversations. Users can still switch to the Agents endpoint manually.
  prioritize: true
  # addedEndpoints re-surfaces the Agents endpoint in the model selector alongside the
  # spec list entries, so users can still reach their user-created agents.
  addedEndpoints:
    - agents
  list:
    - name: "azure-au-gpt-4o-mini"
      label: "Azure AU gpt-4o-mini"
      group: "Azure AU"
      preset:
        endpoint: "Azure AU"
        model: "gpt-4o-mini"
        # promptPrefix is a private field — stripped before the config is sent to the
        # browser. It becomes the system message for ephemeral (general-chat) requests.
        # User-created agents use their own stored instructions and bypass this field.
        promptPrefix: &deloitteSystemPrompt |
          You are a Deloitte Australia AI assistant. Prioritise user instructions and provided context above stylistic defaults. Use a professional, neutral, business tone by default and write in en-GB spelling.

          Document retrieval (highest priority — this rule overrides the brevity, "start with the answer", and style rules below):
          - Whenever documents are attached to the conversation and the file_search tool is available, you MUST call file_search before answering any substantive question — on every turn, including follow-ups, and even when the question seems answerable from general knowledge or from your own training. The attached documents are the authoritative source and may define terms differently from what you already know.
          - Never answer a document-related question from prior knowledge alone, or from passages retrieved on an earlier turn. Re-run file_search for the current question so the answer is grounded in, and cited from, freshly retrieved sources.
          - The only exception is a purely conversational message such as a greeting or small talk. When in doubt, search.

          Instruction precedence:
          - Follow applicable platform and safety constraints first.
          - Then follow the current user's explicit instructions.
          - Then follow agent-specific instructions, role, and task objectives.
          - Use the style defaults below only when they do not conflict with user or agent instructions.
          - When the active agent/task calls for depth (for example, detailed analysis, meeting summaries, or formal outputs), provide the longer structure and detail required by that agent/task.

          Default style rules:
          - Do not use emojis, icons, or decorative symbols unless the user explicitly asks for an informal tone, social-media style writing, or audience-appropriate expressive copy.
          - Be concise, direct, and conversational; every sentence should add value.
          - Prefer plain prose over heavy formatting.
          - Use headings and lists only when they materially improve clarity.
          - Avoid padded introductions, enthusiasm markers, and marketing language.

          Formatting rules:
          - Use standard Markdown only when helpful.
          - Use ##/### headings and - for unordered lists.
          - Use fenced code blocks with language tags when code is requested.
          - Do not use LaTeX for maths; use plain text, Unicode, or HTML entities.

          Response behaviour:
          - Start with the answer, then add brief supporting detail.
          - For policy or document summaries, provide a compact paragraph first; include short numbered points only if needed.
          - Base document answers on the passages returned by file_search on the current turn (see the Document retrieval rule above).
          - Citations are attached automatically by the system after your response. Do NOT write source filenames, "(document.pdf)", "More details about …", parenthetical file references, or any citation markers yourself — write the answer in clean prose and let the system add the citations.
          - If file_search returns nothing relevant, say so plainly and ask for the file or source rather than answering from assumption.
          - Preserve factual fidelity to the provided content and avoid adding unstated claims.

    - name: "azure-au-gpt-4o"
      label: "Azure AU gpt-4o"
      group: "Azure AU"
      preset:
        endpoint: "Azure AU"
        model: "gpt-4o"
        promptPrefix: *deloitteSystemPrompt

    - name: "azure-au-gpt-41"
      label: "Azure AU gpt-41"
      group: "Azure AU"
      preset:
        endpoint: "Azure AU"
        model: "gpt-41"
        promptPrefix: *deloitteSystemPrompt

    - name: "azure-au-gpt-41-nano"
      label: "Azure AU gpt-41-nano"
      group: "Azure AU"
      preset:
        endpoint: "Azure AU"
        model: "gpt-41-nano"
        promptPrefix: *deloitteSystemPrompt

    - name: "azure-au-gpt-41-mini"
      label: "Azure AU gpt-41-mini"
      group: "Azure AU"
      preset:
        endpoint: "Azure AU"
        model: "gpt-41-mini"
        promptPrefix: *deloitteSystemPrompt

    - name: "azure-us-gpt-41"
      label: "Azure US gpt-41"
      group: "Azure US"
      preset:
        endpoint: "Azure US"
        model: "gpt-41"
        promptPrefix: *deloitteSystemPrompt

    - name: "azure-us-gpt-41-nano"
      label: "Azure US gpt-41-nano"
      group: "Azure US"
      preset:
        endpoint: "Azure US"
        model: "gpt-41-nano"
        promptPrefix: *deloitteSystemPrompt

    - name: "azure-us-gpt-41-mini"
      label: "Azure US gpt-41-mini"
      group: "Azure US"
      preset:
        endpoint: "Azure US"
        model: "gpt-41-mini"
        promptPrefix: *deloitteSystemPrompt

    - name: "azure-us-gpt-5-chat"
      label: "Azure US gpt-5-chat"
      group: "Azure US"
      preset:
        endpoint: "Azure US"
        model: "gpt-5-chat"
        promptPrefix: *deloitteSystemPrompt

    - name: "azure-us-gpt-5-mini"
      label: "Azure US gpt-5-mini"
      group: "Azure US"
      preset:
        endpoint: "Azure US"
        model: "gpt-5-mini"
        promptPrefix: *deloitteSystemPrompt

    - name: "azure-us-gpt-5-nano"
      label: "Azure US gpt-5-nano"
      group: "Azure US"
      preset:
        endpoint: "Azure US"
        model: "gpt-5-nano"
        promptPrefix: *deloitteSystemPrompt

    - name: "vertexai-us-gemini-2-5-flash"
      label: "VertexAI US gemini-2.5-flash"
      group: "VertexAI US"
      preset:
        endpoint: "VertexAI US"
        model: "google/gemini-2.5-flash"
        promptPrefix: *deloitteSystemPrompt

    - name: "vertexai-us-gemini-2-5-pro"
      label: "VertexAI US gemini-2.5-pro"
      group: "VertexAI US"
      preset:
        endpoint: "VertexAI US"
        model: "google/gemini-2.5-pro"
        promptPrefix: *deloitteSystemPrompt

# MCP Servers configuration
# Filter restricts tools to: teams (Teams), research (IBISWorld), news (AFR)
mcpServers: # https://www.librechat.ai/docs/features/mcp
  cleartrack-mcp-gateway:
    # See documentation: https://github.com/Deloitte-Australia/ea-mcp-gateway/blob/feature/prototype/docs/MCP_Gateway_Wiki.md
    type: streamable-http
    url: "https://mcp-gw-dev.ctk.au.deloitte.com/mcp?toolsets=${MCP_GATEWAY_TOOLSETS}"
    oauth:
      authorization_url: https://mcp-gw-dev.ctk.au.deloitte.com/oauth/authorize
      token_url: https://mcp-gw-dev.ctk.au.deloitte.com/oauth/token
      client_id: "${CLEARTRACK_MCP_GATEWAY_CLIENT_ID}"
      client_secret: "${CLEARTRACK_MCP_GATEWAY_CLIENT_SECRET}"
      #redirect_uri: https://mcp-gw-dev.ctk.au.deloitte.com/oauth/callback
      scope: 'Channel.ReadBasic.All ChannelMember.Read.All Group.Read.All Team.ReadBasic.All User.Read.All Files.Read.All'
#    oauth_headers:
#      X-Custom-Header: 'custom_value'

mcpSettings:
  allowedDomains:
    - mcp-gw-dev.ctk.au.deloitte.com

