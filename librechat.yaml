# MCP Servers configuration
# Each entry filters the gateway to a single toolset via the `toolsets` query param.
# See documentation: https://github.com/Deloitte-Australia/ea-mcp-gateway/blob/feature/prototype/docs/MCP_Gateway_Wiki.md
mcpServers: # https://www.librechat.ai/docs/features/mcp
  cleartrack-mcp-gateway-research:
    title: 'IBISWorld'
    parentGroup: 'ClearTrack MCP'
    type: streamable-http
    url: '${MCP_GATEWAY_URL}?toolsets=research'
    obo:
      scopes: '${MCP_GATEWAY_OBO_SCOPE}'

  cleartrack-mcp-gateway-news:
    title: 'AFR News'
    parentGroup: 'ClearTrack MCP'
    type: streamable-http
    url: '${MCP_GATEWAY_URL}?toolsets=news'
    obo:
      scopes: '${MCP_GATEWAY_OBO_SCOPE}'

  cleartrack-mcp-gateway-kx:
    title: 'KX'
    parentGroup: 'ClearTrack MCP'
    type: streamable-http
    url: '${MCP_GATEWAY_URL}?toolsets=kx'
    obo:
      scopes: '${MCP_GATEWAY_OBO_SCOPE}'

  cleartrack-mcp-gateway-desc:
    title: 'DESC'
    parentGroup: 'ClearTrack MCP'
    type: streamable-http
    url: '${MCP_GATEWAY_URL}?toolsets=desc'
    obo:
      scopes: '${MCP_GATEWAY_OBO_SCOPE}'

  cleartrack-mcp-gateway-gims:
    title: 'GIMS'
    parentGroup: 'ClearTrack MCP'
    type: streamable-http
    url: '${MCP_GATEWAY_URL}?toolsets=gims'
    obo:
      scopes: '${MCP_GATEWAY_OBO_SCOPE}'

  cleartrack-mcp-gateway-sharepoint:
    title: 'SharePoint'
    parentGroup: 'ClearTrack MCP'
    type: streamable-http
    url: '${MCP_GATEWAY_URL}?toolsets=sharepoint'
    obo:
      scopes: '${MCP_GATEWAY_OBO_SCOPE}'
#    oauth_headers:
#      X-Custom-Header: "custom_value"

mcpSettings:
  allowedDomains:
    - mcp-gw-dev.ctk.au.deloitte.com

speech: # https://www.librechat.ai/docs/configuration/librechat_yaml/object_structure/speech
