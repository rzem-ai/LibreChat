# Template: Data Classification & Extraction
#
# Use this template for skills that classify, extract, or restructure data:
#   - Document redaction, contract analysis, tax statement parsing
#   - Schema extraction, entity recognition, PII handling
#
# Copy this file to: evals/<Skill Name>/eval_cases.yaml
# Then customise the cases below.
#
# Run with:
#   uv run eval-run --config "evals/<Skill Name>/eval_cases.yaml" --case case_1

adapter: _eval.adapters.librechat_adapter.LibreChatAdapter
invoke_method: invoke_text
num_runs: 3

cases:

  case_1:
    name: "TODO: Describe this test case"
    category: "Data Classification & Extraction"
    source_material: "documents/TODO_sample_input.md"
    chatbot_role: "TODO: Describe the agent's role"
    user_query: >-
      TODO: Write the user prompt that triggers this skill.
    expected_output: >-
      TODO: Describe the expected output.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "TODO: skill-name"

    metrics:
      - task_completion
      - faithfulness

    thresholds:
      task_completion: 0.7
      faithfulness: 0.7

    leading_questions:
      - name: "Schema Conformance"
        type: gating
        threshold: 0.7
        question: >-
          Does the output conform to the expected schema or structure?

      - name: "Classification Consistency"
        question: >-
          Are classification labels applied consistently across similar items?

      - name: "Sensitive Data Handling"
        type: gating
        threshold: 0.8
        question: >-
          Is sensitive data correctly identified and handled per policy?

      - name: "Edge Case Flagging"
        question: >-
          Are edge cases or ambiguous items flagged rather than silently classified?

      - name: "Data Fidelity"
        question: >-
          Does the extraction preserve the original data fidelity without distortion?
