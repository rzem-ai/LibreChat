# Then customise the cases below.

adapter: _eval.adapters.agno_adapter.AgnoAdapter
invoke_method: invoke_text

cases:

  case_1:
    name: "TODO: Describe this test case"
    category: "Data Classification & Extraction"
    source_material: "documents/TODO_sample_input.md"
    user_query: >-
      TODO: Write the user prompt that triggers this skill.
    expected_output: >-
      TODO: Describe the expected output.
    expected_tools:
      - name: get_skill_instructions
        input_parameters:
          skill_name: "TODO: skill-name"

    # --- Gating metrics ---
    metrics:
      - task_completion
      - policy_compliance

    thresholds:
      task_completion: 0.7
      policy_compliance: 1.0

    # --- Diagnostic metrics ---
    diagnostic_metrics:
      - answer_relevancy

    diagnostic_thresholds:
      answer_relevancy: 0.5

    # --- Leading question probes ---
    leading_questions:
      - name: "Schema Conformance"
        type: gating
        threshold: 0.7
        question: >-
          Does the output conform to the expected schema or structure?

      - name: "Classification Consistency"
        question: >-
          Are classification labels applied consistently across similar items?

      - name: "Sensitive Data Handling"
        type: gating
        threshold: 0.8
        question: >-
          Is sensitive data correctly identified and handled per policy?

      - name: "Edge Case Flagging"
        question: >-
          Are edge cases or ambiguous items flagged rather than silently classified?

      - name: "Data Fidelity"
        question: >-
          Does the extraction preserve the original data fidelity without distortion?
