# Template: Knowledge Retrieval & Q&A (RAG)
#
# Use this template for skills that answer questions from provided documents:
#   - Research assistants, industry analysis, PESTEL frameworks
#   - Document Q&A, evidence-based summaries
#
# Copy this file to: evals/<Skill Name>/eval_cases.yaml
# Then customise the cases below.

adapter: _eval.adapters.agno_adapter.AgnoAdapter
invoke_method: invoke_text

cases:

  case_1:
    name: "TODO: Describe this test case"
    category: "Knowledge Retrieval & Q&A"
    source_material: "documents/TODO_sample_input.md"
    user_query: >-
      TODO: Write the user prompt that triggers this skill.
    expected_output: >-
      TODO: Describe the expected output.
    expected_tools:
      - name: get_skill_instructions
        input_parameters:
          skill_name: "TODO: skill-name"

    # --- Gating metrics ---
    metrics:
      - faithfulness
      - answer_relevancy
      - tool_correctness

    thresholds:
      faithfulness: 0.7
      answer_relevancy: 0.7

    # --- Diagnostic metrics ---
    diagnostic_metrics:
      - contextual_recall
      - task_completion

    diagnostic_thresholds:
      contextual_recall: 0.5
      task_completion: 0.7

    # --- Leading question probes ---
    leading_questions:
      - name: "Source vs Inference"
        type: gating
        threshold: 0.7
        question: >-
          Does the output distinguish between information sourced from provided
          documents vs. inferred context?

      - name: "Citation Presence"
        question: >-
          Are citations or evidence references present for each key claim?

      - name: "Framework Coverage"
        question: >-
          When using a framework (e.g., PESTEL), are all framework categories
          addressed — and is each answer substantiated?

      - name: "Domain Terminology"
        question: >-
          Does the summary preserve domain-specific terminology rather than
          generalising it away?

      - name: "Gap Flagging"
        question: >-
          Are gaps in the source material explicitly flagged rather than
          silently filled?
