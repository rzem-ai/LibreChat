# Template: Knowledge Retrieval & Q&A
#
# Use this template for skills that answer questions from a knowledge source.
# Two patterns — pick the one that matches how the skill accesses knowledge:
#
#  PATTERN A — Document Q&A (source provided inline)
#    The user supplies source material alongside their query.
#    Use invoke_text (single-turn) or invoke_sequential with attach_source: true.
#    Set source_material to the reference document.
#    Typical skills: Research Assistant, PESTEL Analyst, Evidence-based Q&A.
#
#  PATTERN B — KB-backed RAG (agent retrieves from knowledge base)
#    The user asks a question; the agent retrieves from a pre-loaded vector store.
#    Use invoke_sequential WITHOUT source_material and WITHOUT attach_source.
#    Omit source_material entirely — the agent owns its retrieval context.
#    Use retrieval metrics (contextual_precision, contextual_recall, contextual_relevancy)
#    alongside faithfulness and answer_relevancy.
#    Typical skills: Policy Q&A, HR Handbook Assistant, Product Knowledge Bot.
#
# Copy this file to: evals/skills/<Skill Name>/eval_cases.yaml
# Then customise the cases below.
#
# Run with:
#   uv run eval-run --config "evals/skills/<Skill Name>/eval_cases.yaml" --case case_1

adapter: _eval.adapters.librechat_adapter.LibreChatAdapter
invoke_method: invoke_text
num_runs: 3

cases:

  # -----------------------------------------------------------------------
  # PATTERN A — Document Q&A (source provided inline)
  # -----------------------------------------------------------------------

  case_1:
    name: "TODO: Document Q&A — single-turn"
    category: "Knowledge Retrieval & Q&A"
    source_material: "documents/TODO_sample_input.md"
    chatbot_role: "TODO: Describe the agent's role"
    user_query: >-
      TODO: Write the user prompt that triggers this skill.
    expected_output: >-
      TODO: Describe the expected output structure and key content.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "TODO: skill-name"

    metrics:
      - faithfulness
      - task_completion
      - hallucination

    thresholds:
      faithfulness: 0.7
      task_completion: 0.7
      hallucination: 0.7

    leading_questions:
      - name: "Source vs Inference"
        type: gating
        threshold: 0.7
        question: >-
          Does the output distinguish between information sourced from provided
          documents vs. inferred context?

      - name: "Citation Presence"
        question: >-
          Are citations or evidence references present for each key claim?

      - name: "Gap Flagging"
        question: >-
          Are gaps in the source material explicitly flagged rather than
          silently filled?

  # -----------------------------------------------------------------------
  # PATTERN B — KB-backed RAG (agent retrieves from knowledge base)
  # No source_material — the agent owns its retrieval context.
  # retrieval_context is populated automatically via include_retrieval: true.
  # -----------------------------------------------------------------------

  case_2:
    name: "TODO: KB Q&A — single-turn RAG"
    category: "Knowledge Retrieval & Q&A"
    invoke_method: invoke_sequential
    # No source_material — agent retrieves from its knowledge base
    chatbot_role: "TODO: Describe the agent's role"
    expected_output: >-
      TODO: Describe the expected answer — specific facts, figures, or
      policy details the response must contain.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "TODO: skill-name"

    turns:
      - content: >-
          TODO: Write the question the user would ask.
        # No attach_source — the agent retrieves its own context

    metrics:
      - faithfulness
      - answer_relevancy
      - contextual_recall
      - contextual_precision

    thresholds:
      faithfulness: 0.7
      answer_relevancy: 0.5
      contextual_recall: 0.5
      contextual_precision: 0.5

    diagnostic_metrics:
      - contextual_relevancy

    diagnostic_thresholds:
      contextual_relevancy: 0.5

    leading_questions:
      - name: "Answer Grounded in KB"
        type: gating
        threshold: 0.7
        question: >-
          Is the answer grounded in specific content from the knowledge base
          rather than general model knowledge?

      - name: "Specific Facts Present"
        question: >-
          Does the response include the specific TODO: [figure/policy/detail]
          from the knowledge base?

      - name: "Hallucination Check"
        question: >-
          Does the response avoid making claims that go beyond what the
          retrieved context supports?
