# Template: Tool-Orchestrated Workflow Execution
#
# Use this template for skills that primarily orchestrate tool calls:
#   - Process map generators, database diagram tools, PowerPoint generators
#   - Spreadsheet operations, code execution workflows
#
# Copy this file to: evals/<Skill Name>/eval_cases.yaml
# Then customise the cases below.
#
# Run with:
#   uv run eval-run --config "evals/<Skill Name>/eval_cases.yaml" --case case_1

adapter: _eval.adapters.librechat_adapter.LibreChatAdapter
invoke_method: invoke_sequential  # tool workflows are usually multi-turn
num_runs: 3

cases:

  case_1:
    name: "TODO: Describe this test case"
    category: "Tool-Orchestrated Workflow Execution"
    invoke_method: invoke_sequential
    source_material: "documents/TODO_sample_input.md"
    chatbot_role: "TODO: Describe the agent's role"
    expected_output: >-
      TODO: Describe the expected output.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "TODO: skill-name"

    turns:
      - content: >-
          TODO: Initial user request triggering the workflow.
        attach_source: true
        turn_assertions:
          - type: expected_tools
            name: "Correct skill invoked"
            tools:
              - name: skill
                input_parameters:
                  skillName: "TODO: skill-name"
          - type: leading_question
            name: "TODO: Verify initial response"
            question: >-
              TODO: Does the response indicate the workflow has started?

      - content: >-
          TODO: User provides additional input or confirmation.
        turn_assertions:
          - type: leading_question
            name: "TODO: Verify output artefact"
            question: >-
              TODO: Does the response contain the expected artefact or result?

    metrics:
      - task_completion
      - faithfulness

    thresholds:
      task_completion: 0.7
      faithfulness: 0.7

    conversational_metrics:
      - conversation_completeness

    conversational_thresholds:
      conversation_completeness: 0.5

    leading_questions:
      - name: "Correct Skill Selection"
        type: gating
        threshold: 0.7
        question: >-
          Did the agent select the correct skill(s) without user disambiguation?

      - name: "Parameter Correctness"
        type: gating
        threshold: 0.7
        question: >-
          Were the tool input parameters populated correctly from context
          (e.g., skill_name, task type)?

      - name: "Minimal Tool Calls"
        question: >-
          Was the number of tool calls minimised — i.e., no redundant or
          retry calls?

      - name: "Dependency Order"
        question: >-
          If the task required chaining skills, were they invoked in the
          correct dependency order?

      - name: "No Irrelevant Tools"
        question: >-
          Did the agent avoid invoking tools that were irrelevant to the prompt?
