# Template: Content Generation & Transformation
#
# Use this template for skills that generate or transform written content:
#   - Meeting summaries, case studies, newsletters, reports
#   - Document drafting, rewriting, formatting
#
# Copy this file to: evals/<Skill Name>/eval_cases.yaml
# Then customise the cases below.
#
# Run with:
#   python -m _eval.run_eval --config "evals/<Skill Name>/eval_cases.yaml" --case case_1

adapter: _eval.adapters.agno_adapter.AgnoAdapter
invoke_method: invoke_text  # override per-case with invoke_file or invoke_multi_turn

cases:

  case_1:
    name: "TODO: Describe this test case"
    category: "Content Generation & Transformation"
    source_material: "documents/TODO_sample_input.md"
    user_query: >-
      TODO: Write the user prompt that triggers this skill.
    expected_output: >-
      TODO: Describe the expected output structure and content.
    expected_tools:
      - name: get_skill_instructions
        input_parameters:
          skill_name: "TODO: skill-name"

    # --- Gating metrics (block on failure) ---
    metrics:
      - hallucination
      - task_completion
      - tool_correctness
      - role_consistency
      - policy_compliance

    thresholds:
      hallucination: 0.5
      task_completion: 0.7
      role_consistency: 0.7
      policy_compliance: 1.0

    # --- Diagnostic metrics (non-blocking signal) ---
    diagnostic_metrics:
      - answer_relevancy
      - summarization
      - faithfulness

    diagnostic_thresholds:
      answer_relevancy: 0.5
      summarization: 0.5
      faithfulness: 0.5

    # --- Leading question probes ---
    leading_questions:
      - name: "Structural Template"
        type: gating
        threshold: 0.7
        question: >-
          Does the output follow the required structural template for its
          content type (e.g., case study sections, newsletter tone)?

      - name: "Claim Traceability"
        question: >-
          Are all claims traceable to a specific passage in the source material?

      - name: "Audience Tone Adaptation"
        question: >-
          Does the output adapt its register and tone for the stated audience
          (e.g., internal vs. client-facing)?

      - name: "Anonymisation Compliance"
        question: >-
          If anonymisation was required, are all sensitive references removed
          or masked?

      - name: "Disclaimer & Review Prompts"
        question: >-
          Does the content include all mandatory disclaimers and review prompts
          specified by the skill?
