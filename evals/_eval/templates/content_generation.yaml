# Template: Content Generation & Transformation
#
# Use this template for skills that generate or transform written content:
#   - Meeting summaries, case studies, newsletters, reports
#   - Document drafting, rewriting, formatting
#
# Copy this file to: evals/<Skill Name>/eval_cases.yaml
# Then customise the cases below.
#
# Run with:
#   uv run eval-run --config "evals/<Skill Name>/eval_cases.yaml" --case case_1

adapter: _eval.adapters.librechat_adapter.LibreChatAdapter
invoke_method: invoke_text  # override per-case with invoke_sequential for multi-turn
num_runs: 3

cases:

  # --- Single-turn case using invoke_text ---
  case_1:
    name: "TODO: Describe this test case"
    category: "Content Generation & Transformation"
    source_material: "documents/TODO_sample_input.md"
    chatbot_role: "TODO: Describe the agent's role"
    user_query: >-
      TODO: Write the user prompt that triggers this skill.
    expected_output: >-
      TODO: Describe the expected output structure and content.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "TODO: skill-name"

    metrics:
      - hallucination
      - task_completion
      - faithfulness

    thresholds:
      hallucination: 0.7
      task_completion: 0.7
      faithfulness: 0.7

    leading_questions:
      - name: "Structural Template"
        type: gating
        threshold: 0.7
        question: >-
          Does the output follow the required structural template for its
          content type (e.g., case study sections, newsletter tone)?

      - name: "Claim Traceability"
        question: >-
          Are all claims traceable to a specific passage in the source material?

      - name: "No Invented Content"
        type: gating
        threshold: 0.7
        question: >-
          Is the output free from claims not present in the source material?

      - name: "Audience Tone Adaptation"
        question: >-
          Does the output adapt its register and tone for the stated audience
          (e.g., internal vs. client-facing)?

      - name: "Conciseness"
        question: >-
          Is the output concise — not merely copy-pasting from the source?

  # --- Multi-turn case using invoke_sequential ---
  case_2:
    name: "TODO: Describe the multi-turn variant"
    category: "Content Generation & Transformation"
    invoke_method: invoke_sequential
    source_material: "documents/TODO_sample_input.md"
    chatbot_role: "TODO: Describe the agent's role"
    expected_output: >-
      TODO: Describe the expected multi-turn output.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "TODO: skill-name"

    turns:
      - content: >-
          TODO: First user message (usually the main request).
        attach_source: true
        turn_assertions:
          - type: expected_tools
            name: "Skill tool called"
            tools:
              - name: skill
                input_parameters:
                  skillName: "TODO: skill-name"
          - type: contains_any
            name: "TODO: Check for expected content"
            phrases: ["TODO: phrase1", "TODO: phrase2"]

      - content: >-
          TODO: Follow-up user message.
        turn_assertions:
          - type: leading_question
            name: "TODO: Verify follow-up response"
            question: >-
              TODO: Does the response address the follow-up appropriately?

    metrics:
      - hallucination
      - task_completion
      - faithfulness

    thresholds:
      hallucination: 0.7
      task_completion: 0.7
      faithfulness: 0.7

    conversational_metrics:
      - conversation_completeness

    conversational_thresholds:
      conversation_completeness: 0.5

    leading_questions:
      - name: "Structural Template"
        type: gating
        threshold: 0.7
        question: >-
          Does the output follow the required structural template?

      - name: "No Invented Content"
        type: gating
        threshold: 0.7
        question: >-
          Is all content grounded in the source material?

      - name: "Audience Tone Adaptation"
        question: >-
          Does the output adapt its register and tone for the stated audience?
