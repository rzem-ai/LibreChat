# Template: Governance / Control / Compliance
#
# Use this template for skills that review, audit, or enforce compliance:
#   - NDA reviewers, SOW reviewers, document quality checks
#   - RFP compliance, audit response generators
#
# Copy this file to: evals/<Skill Name>/eval_cases.yaml
# Then customise the cases below.
#
# Run with:
#   uv run eval-run --config "evals/<Skill Name>/eval_cases.yaml" --case case_1

adapter: _eval.adapters.librechat_adapter.LibreChatAdapter
invoke_method: invoke_text
num_runs: 3

cases:

  case_1:
    name: "TODO: Describe this test case"
    category: "Governance / Control / Compliance"
    source_material: "documents/TODO_sample_input.md"
    chatbot_role: "TODO: Describe the agent's role"
    user_query: >-
      TODO: Write the user prompt that triggers this skill.
    expected_output: >-
      TODO: Describe the expected output.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "TODO: skill-name"

    metrics:
      - task_completion
      - faithfulness
      - hallucination

    thresholds:
      task_completion: 0.7
      faithfulness: 0.7
      hallucination: 0.5

    leading_questions:
      - name: "Clause-Linked Violations"
        type: gating
        threshold: 0.7
        question: >-
          Are all flagged violations tied to specific clauses, rules, or criteria?

      - name: "Confirmed vs Potential"
        question: >-
          Does the agent distinguish between confirmed violations and potential risks?

      - name: "Actionable Specificity"
        question: >-
          Are findings expressed with sufficient specificity to be actionable?

      - name: "No False Assurance"
        type: gating
        threshold: 0.7
        question: >-
          Does the agent avoid false assurance (e.g., stating 'no issues found'
          without evidence of thorough review)?

      - name: "Severity Prioritisation"
        question: >-
          Are compliance gaps prioritised by severity or risk level?
