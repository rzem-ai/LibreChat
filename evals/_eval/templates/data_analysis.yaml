# Template: Data Analysis
#
# Use this template for skills that classify, extract, or assess structured
# information from documents:
#   - Contract extraction, clause identification, risk flagging
#   - Document redaction, schema extraction, entity recognition
#   - Compliance review, document quality checks, PII handling
#
# Copy this file to: evals/skills/<Skill Name>/eval_cases.yaml
# Then customise the cases below.
#
# Run with:
#   uv run eval-run --config "evals/skills/<Skill Name>/eval_cases.yaml" --case case_1

adapter: _eval.adapters.librechat_adapter.LibreChatAdapter
invoke_method: invoke_text
num_runs: 3

cases:

  # --- Single-turn case using invoke_text ---
  case_1:
    name: "TODO: Describe this test case"
    category: "Data Analysis"
    source_material: "documents/TODO_sample_input.md"
    chatbot_role: "TODO: Describe the agent's role"
    user_query: >-
      TODO: Write the user prompt that triggers this skill.
    expected_output: >-
      TODO: Describe the expected output — extracted fields, risk flags,
      classification labels, or structured findings.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "TODO: skill-name"

    metrics:
      - faithfulness
      - task_completion
      - hallucination

    thresholds:
      faithfulness: 0.7
      task_completion: 0.7
      hallucination: 0.3

    leading_questions:
      - name: "Schema Conformance"
        type: gating
        threshold: 0.7
        question: >-
          Does the output conform to the expected schema or structure?

      - name: "Extraction Completeness"
        type: gating
        threshold: 0.7
        question: >-
          Are all required fields or data points extracted without omission?

      - name: "Sensitive Data Handling"
        question: >-
          Is sensitive data correctly identified and handled per policy?

      - name: "Edge Case Flagging"
        question: >-
          Are edge cases or ambiguous items flagged rather than silently classified?

      - name: "Clause-Linked Findings"
        question: >-
          Are all flagged findings tied to specific clauses, sections, or
          criteria in the source document?

  # --- Multi-turn case using invoke_sequential ---
  case_2:
    name: "TODO: Describe the multi-turn variant"
    category: "Data Analysis"
    invoke_method: invoke_sequential
    source_material: "documents/TODO_sample_input.md"
    chatbot_role: "TODO: Describe the agent's role"
    expected_output: >-
      TODO: Describe the expected multi-turn output.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "TODO: skill-name"

    turns:
      - content: >-
          TODO: Initial extraction or classification request.
        attach_source: true
        turn_assertions:
          - type: expected_tools
            name: "Skill tool called"
            tools:
              - name: skill
                input_parameters:
                  skillName: "TODO: skill-name"
          - type: contains_any
            name: "TODO: Check for extracted content"
            phrases: ["TODO: phrase1", "TODO: phrase2"]

      - content: >-
          TODO: Follow-up — ask for clarification, a specific field, or
          a deeper analysis of a flagged item.
        turn_assertions:
          - type: leading_question
            name: "TODO: Verify follow-up accuracy"
            question: >-
              TODO: Does the response accurately address the follow-up
              without introducing new hallucinated details?

    metrics:
      - faithfulness
      - hallucination
      - conversation_completeness

    thresholds:
      faithfulness: 0.7
      hallucination: 0.3
      conversation_completeness: 0.5

    leading_questions:
      - name: "Schema Conformance"
        type: gating
        threshold: 0.7
        question: >-
          Does the final output conform to the expected schema or structure?

      - name: "No Invented Fields"
        type: gating
        threshold: 0.7
        question: >-
          Does the output avoid inventing fields or values not present in
          the source document?

      - name: "Follow-up Precision"
        question: >-
          Does the agent answer the follow-up with the same precision as the
          initial response, without drift or re-interpretation?
