# Case Study Drafting Assistant — Evaluation Cases
# Category: Content Generation & Transformation

adapter: _eval.adapters.librechat_adapter.LibreChatAdapter
invoke_method: invoke_text
num_runs: 3

cases:

  # --- Document 1: Financial Services Engagement (Qualification) ---

  case_1:
    name: "Qualification drafting from detailed engagement metadata"
    category: "Content Generation & Transformation"
    invoke_method: invoke_text
    source_material: "documents/financial_services_engagement.md"
    chatbot_role: "A Deloitte engagement professional drafting qualifications for internal use"
    user_query: >-
      Draft a qualification for this financial services engagement. Include all
      the required sections: Engagement Summary, Business Issue, Impact and Scope,
      and Delivery. Add any additional fields supported by the source material.
      Use the AU model guidance for the financial services context.
    expected_output: >-
      A formatted qualification with clear sections for Engagement Summary,
      Business Issue, Impact and Scope, and Delivery (each with at least 5
      sentences). Must include Project Name, LEP, Director, Client, Business
      Offering, Industry, Key Team Members, Engagement Fee, Start/End Dates,
      Keywords (including Qualwritingbot), disclaimer footer, and recommendations
      for reviewing with LEP/LCSP.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "case-study-drafting-assistant"

    metrics:
      - hallucination
      - task_completion
      - faithfulness

    thresholds:
      hallucination: 0.7
      task_completion: 0.7
      faithfulness: 0.7

    leading_questions:
      - name: "Required Sections Present"
        type: gating
        threshold: 0.7
        question: >-
          Does the qualification include all four required sections: Engagement
          Summary, Business Issue, Impact and Scope, and Delivery?

      - name: "No Fabricated Details"
        type: gating
        threshold: 0.7
        question: >-
          Are all claims traceable to the source material? Has the AI avoided
          inventing engagement details, client names (if anonymised), or outcome
          metrics not provided?

      - name: "Keywords Accuracy"
        question: >-
          Does the Keywords field include Qualwritingbot and other terms
          derived from the source material?

      - name: "Disclaimer Present"
        question: >-
          Is the qualification disclaimer about LEP/LCSP review and submission
          to kxquals@deloitte.com included?

      - name: "Professional Tone"
        question: >-
          Is the tone formal and professional, suitable for internal qualification
          tracking systems?

  case_2:
    name: "Qualification revision with additional context"
    category: "Content Generation & Transformation"
    invoke_method: invoke_sequential
    source_material: "documents/financial_services_engagement.md"
    chatbot_role: "A Deloitte engagement professional drafting qualifications"
    expected_output: >-
      An initial qualification, then after user provides additional information
      (specific risk management metrics, security certifications achieved),
      a revised qualification that incorporates the new details and clearly
      indicates what was changed.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "case-study-drafting-assistant"

    turns:
      - content: >-
          Draft a qualification for this financial services payment modernisation
          engagement. Please include all standard sections.
        attach_source: true
        turn_assertions:
          - type: expected_tools
            name: "Skill tool called"
            tools:
              - name: skill
                input_parameters:
                  skillName: "case-study-drafting-assistant"
          - type: contains_any
            name: "Has core structure"
            phrases: ["Engagement Summary", "Business Issue", "Impact", "Delivery"]
          - type: leading_question
            name: "Requests additional information"
            question: >-
              Does the response ask whether the user wants to add more
              information to strengthen the qualification?

      - content: >-
          Yes, please. We also achieved PCI-DSS Level 1 certification, implemented
          zero-trust security architecture, and reduced regulatory audit findings
          by 40%. Also, the team included 3 AWS Solutions Architects who delivered
          the cloud infrastructure.
        turn_assertions:
          - type: leading_question
            name: "Incorporates security metrics"
            question: >-
              Does the revised qualification mention PCI-DSS Level 1 certification
              and zero-trust security architecture?

          - type: leading_question
            name: "Updates team composition"
            question: >-
              Does the revision note the AWS Solutions Architects and their
              infrastructure contributions?

          - type: leading_question
            name: "Indicates changes made"
            question: >-
              Does the response explain where changes were incorporated
              (e.g., 'Updated Delivery section to include security outcomes')?

    metrics:
      - hallucination
      - task_completion
      - faithfulness
      - conversation_completeness

    thresholds:
      hallucination: 0.5
      task_completion: 0.5
      faithfulness: 0.5
      conversation_completeness: 0.5

    leading_questions:
      - name: "Seamless Integration"
        type: gating
        threshold: 0.5
        question: >-
          Does the revised qualification naturally integrate the new security
          and team details without appearing disjointed?

      - name: "No Loss of Original Content"
        type: gating
        threshold: 0.5
        question: >-
          Are the original engagement details and outcomes preserved while
          adding the new information?

  # --- Document 2: Government Services (Case Study) ---

  case_3:
    name: "Case study drafting from project details"
    category: "Content Generation & Transformation"
    invoke_method: invoke_text
    source_material: "documents/government_services_case_study.md"
    chatbot_role: "A Deloitte engagement professional drafting case studies for internal use"
    user_query: >-
      Draft a case study from this government modernisation project. Include
      sections for Summary, Problem Statement, Approach and Solution Delivered,
      Client Impact / Expected Outcomes, Additional Comments, Major Win Factors,
      and Project/Client Details. The content is for internal use only.
    expected_output: >-
      A structured case study with clear sections: Summary (concise overview),
      Problem Statement (citizen friction and system fragmentation), Approach
      and Solution Delivered (unified platform and integration details), Client
      Impact (numeric outcomes: 45% task reduction, 65% online volume increase,
      78% first-contact resolution), Major Win Factors (sponsorship, change
      management, architecture), Additional Comments, and Project/Client Details.
      Must include the internal-use-only disclaimer.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "case-study-drafting-assistant"

    metrics:
      - hallucination
      - task_completion
      - faithfulness

    thresholds:
      hallucination: 0.7
      task_completion: 0.7
      faithfulness: 0.7

    leading_questions:
      - name: "Structure Complete"
        type: gating
        threshold: 0.7
        question: >-
          Does the case study include all required sections: Summary, Problem
          Statement, Approach and Solution Delivered, Client Impact, Major Win
          Factors, and Additional Comments?

      - name: "Outcome Metrics Preserved"
        type: gating
        threshold: 0.7
        question: >-
          Are the specific outcome metrics (45% task reduction, 65% increase in
          online transactions, 78% first-contact resolution) accurately presented?

      - name: "Conciseness"
        question: >-
          Is the case study concise and narrative-driven rather than merely
          copying from the source material?

      - name: "Client Anonymisation"
        question: >-
          Is the client appropriately identified as 'Australian Federal Government
          Department' rather than revealing specific department name (if anonymity
          was intended)?

      - name: "Disclaimer Included"
        question: >-
          Does the case study include the internal-use-only disclaimer and
          reference to LEP/LCSP review?

  case_4:
    name: "Case study with follow-up for additional impact detail"
    category: "Content Generation & Transformation"
    invoke_method: invoke_sequential
    source_material: "documents/government_services_case_study.md"
    chatbot_role: "A Deloitte engagement professional drafting case studies"
    expected_output: >-
      An initial case study covering the core engagement, followed by a request
      for specific policy impact metrics, then a revised case study that
      incorporates the additional data showing how the platform improved
      policy decision-making and citizen equity outcomes.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "case-study-drafting-assistant"

    turns:
      - content: >-
          Draft a case study for this government services integration project.
          Focus on the citizen experience improvements and operational outcomes.
        attach_source: true
        turn_assertions:
          - type: expected_tools
            name: "Skill tool called"
            tools:
              - name: skill
                input_parameters:
                  skillName: "case-study-drafting-assistant"
          - type: contains_any
            name: "Has problem context"
            phrases: ["citizens", "friction", "disparate", "separate legacy systems"]
          - type: leading_question
            name: "Prompts for additional context"
            question: >-
              Does the response ask whether the user has additional impact
              information or metrics to strengthen the case study?

      - content: >-
          Yes—we also improved service delivery equity: wait times for remote
          applicants decreased from 21 days to 8 days (57% improvement), and
          we achieved 95% language accessibility in 12 languages, enabling
          non-English speakers to lodge applications autonomously. The analytics
          data is now feeding policy reviews.
        turn_assertions:
          - type: leading_question
            name: "Incorporates equity metrics"
            question: >-
              Does the revised case study mention the improvements for remote
              applicants (21 days to 8 days) and language accessibility
              (12 languages, 95% coverage)?

          - type: leading_question
            name: "Highlights policy impact"
            question: >-
              Does the revision note the analytics contribution to policy
              decision-making, as a strategic outcome?

          - type: leading_question
            name: "Maintains structure"
            question: >-
              Is the case study still well-structured and easy to read after
              incorporating the new equity and policy insights?

    metrics:
      - hallucination
      - task_completion
      - faithfulness
      - conversation_completeness

    thresholds:
      hallucination: 0.5
      task_completion: 0.5
      faithfulness: 0.5
      conversation_completeness: 0.5

    leading_questions:
      - name: "Equity Outcomes Prominent"
        type: gating
        threshold: 0.5
        question: >-
          Are the equity improvements (remote applicants, language accessibility)
          given appropriate prominence, not buried in the text?

      - name: "Grounded in Source"
        type: gating
        threshold: 0.5
        question: >-
          Are all claims grounded in the source material or user-provided details?
          Has the AI avoided inventing policy outcomes?

  # --- Document 3: Healthcare AI Project (Newsletter/Viva Engage) ---

  case_5:
    name: "Newsletter blurb drafting with energetic storytelling"
    category: "Content Generation & Transformation"
    invoke_method: invoke_text
    source_material: "documents/healthcare_ai_project.md"
    chatbot_role: "A Deloitte internal communications writer drafting newsletter stories"
    user_query: >-
      Draft a newsletter blurb for this healthcare AI success story. Make it
      engaging and celebratory—include a compelling headline, introduction,
      major achievements with storytelling, team recognition, and future
      implications. This is for internal Deloitte circulation only.
    expected_output: >-
      An engaging internal newsletter story with: an energetic headline, brief
      introduction explaining why the project matters, major achievements and
      impacts in storytelling style, specific team member recognition, and
      forward-looking implications about APAC healthcare positioning. Tone
      is uplifting and celebratory without overstating results. Names of team
      members (Michael, Sarah, Marcus, Priya, Robert) are included.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "case-study-drafting-assistant"

    metrics:
      - hallucination
      - task_completion
      - faithfulness

    thresholds:
      hallucination: 0.7
      task_completion: 0.7
      faithfulness: 0.7

    leading_questions:
      - name: "Engaging Tone"
        type: gating
        threshold: 0.7
        question: >-
          Does the newsletter have an energetic, celebratory tone appropriate
          for internal communication?

      - name: "Team Recognition"
        type: gating
        threshold: 0.7
        question: >-
          Are the team members (Michael, Sarah, Marcus, Priya, Robert) explicitly
          recognized by name?

      - name: "Outcomes Accurate"
        question: >-
          Are the key metrics (94% adoption, 28% time reduction, 23 medication
          interactions prevented) accurately presented?

      - name: "Storytelling Quality"
        question: >-
          Is the blurb written in an engaging narrative style rather than a
          dry list of facts?

      - name: "No Overstatement"
        question: >-
          Are achievements presented accurately without hyperbole or unsupported
          claims (e.g., 'revolutionary', 'game-changing')?

  case_6:
    name: "Newsletter revision with expanded team recognition"
    category: "Content Generation & Transformation"
    invoke_method: invoke_sequential
    source_material: "documents/healthcare_ai_project.md"
    chatbot_role: "A Deloitte internal communications writer"
    expected_output: >-
      An initial newsletter blurb, followed by a request to expand team
      recognition to include clinical partners, then a revised blurb that
      acknowledges both Deloitte team and healthcare partner contributions.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "case-study-drafting-assistant"

    turns:
      - content: >-
          Draft a newsletter blurb celebrating this healthcare AI implementation.
          Make it uplifting and suitable for internal Deloitte circulation.
        attach_source: true
        turn_assertions:
          - type: expected_tools
            name: "Skill tool called"
            tools:
              - name: skill
                input_parameters:
                  skillName: "case-study-drafting-assistant"
          - type: contains_any
            name: "Has team names"
            phrases: ["Michael", "Sarah", "Marcus", "Priya", "Robert"]
          - type: leading_question
            name: "Asks for additions"
            question: >-
              Does the response ask if the user wants to add more context
              or recognition?

      - content: >-
          Great! Can you also acknowledge the clinical partnership team from
          the healthcare group? They were instrumental in adoption—especially
          Dr. Patricia O'Brien (Chief Medical Officer) and the nursing leadership
          who championed the system with staff.
        turn_assertions:
          - type: leading_question
            name: "Includes partner recognition"
            question: >-
              Does the revised newsletter now recognize Dr. Patricia O'Brien
              and the nursing leadership team from the healthcare group?

          - type: leading_question
            name: "Balanced recognition"
            question: >-
              Are both Deloitte team and healthcare partner contributions
              appropriately recognized without one overshadowing the other?

          - type: leading_question
            name: "Maintains tone"
            question: >-
              Does the revised blurb maintain the celebratory, storytelling tone?

    metrics:
      - hallucination
      - task_completion
      - faithfulness
      - conversation_completeness

    thresholds:
      hallucination: 0.5
      task_completion: 0.5
      faithfulness: 0.5
      conversation_completeness: 0.5

    leading_questions:
      - name: "Partnership Collaboration"
        type: gating
        threshold: 0.5
        question: >-
          Does the revised narrative effectively highlight the partnership
          between Deloitte and the healthcare group?

      - name: "No Invented Names"
        type: gating
        threshold: 0.5
        question: >-
          Are only the names provided in the source or user input included?
          No fictional healthcare leaders or team members?

  # --- Document 4: Retail Supply Chain (Viva Engage Post) ---

  case_7:
    name: "Viva Engage post drafting with emoji and energy"
    category: "Content Generation & Transformation"
    invoke_method: invoke_text
    source_material: "documents/retail_supply_chain.md"
    chatbot_role: "A Deloitte internal social communications writer drafting Viva Engage posts"
    user_query: >-
      Draft a Viva Engage post celebrating this retail supply chain success.
      Use an engaging opening, emojis throughout, storytelling about the solution
      and achievements, team recognition, and a closing that encourages engagement.
      This is for internal Deloitte Viva Engage only.
    expected_output: >-
      An engaging Viva Engage-style post featuring: an engaging opening line,
      emojis throughout for visual interest, narrative description of the supply
      chain challenge and solution, major achievements (58% out-of-stock reduction,
      22% inventory cost savings, 8.5% sales uplift), specific team recognition
      (Jennifer Walsh and team), future implications, and a closing line
      encouraging recognition or comments. Tone is energetic without being
      unprofessional; suitable for internal social sharing.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "case-study-drafting-assistant"

    metrics:
      - hallucination
      - task_completion
      - faithfulness

    thresholds:
      hallucination: 0.7
      task_completion: 0.7
      faithfulness: 0.7

    leading_questions:
      - name: "Emoji Usage"
        type: gating
        threshold: 0.7
        question: >-
          Does the post include emojis throughout to make it visually engaging
          for Viva Engage?

      - name: "Achievement Specificity"
        type: gating
        threshold: 0.7
        question: >-
          Are the specific retail outcomes (58% out-of-stock reduction, 22%
          inventory savings, 8.5% sales uplift) clearly presented?

      - name: "Team Highlight"
        question: >-
          Is Jennifer Walsh specifically recognized as the engagement lead?

      - name: "Call to Action"
        question: >-
          Does the post include a closing that encourages recognition,
          congratulations, or engagement from readers?

      - name: "Social Tone"
        question: >-
          Is the tone energetic and celebratory, appropriate for a social
          platform, while remaining professional?

  case_8:
    name: "Viva Engage post with follow-up tone adjustment"
    category: "Content Generation & Transformation"
    invoke_method: invoke_sequential
    source_material: "documents/retail_supply_chain.md"
    chatbot_role: "A Deloitte internal social communications writer"
    expected_output: >-
      An initial Viva Engage post, followed by a tone adjustment request
      (more upbeat/celebratory or more focused on team), then a revised post
      that incorporates the feedback while maintaining the core message.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "case-study-drafting-assistant"

    turns:
      - content: >-
          Draft a Viva Engage post for this retail supply chain success story.
          Use emojis and make it celebratory.
        attach_source: true
        turn_assertions:
          - type: expected_tools
            name: "Skill tool called"
            tools:
              - name: skill
                input_parameters:
                  skillName: "case-study-drafting-assistant"
          - type: contains_any
            name: "Has retail achievement metrics"
            phrases: ["out-of-stock", "inventory", "sales"]
          - type: leading_question
            name: "Uses appropriate tone"
            question: >-
              Is the tone energetic and celebratory, suitable for Viva Engage?

      - content: >-
          Perfect! Can you adjust the tone to be even more upbeat? And can we
          emphasise the team's achievement in navigating the retail complexity—
          they dealt with 280 stores and supplier coordination across the board.
        turn_assertions:
          - type: leading_question
            name: "Increased energy level"
            question: >-
              Does the revised post have an even more celebratory, upbeat tone
              than the original?

          - type: leading_question
            name: "Emphasises team complexity"
            question: >-
              Does the revision highlight the team's achievement in coordinating
              across 280 stores and multiple suppliers?

          - type: leading_question
            name: "Maintains structure"
            question: >-
              Does the revised post still include emojis, achievements, team
              recognition, and engagement call-to-action?

    metrics:
      - hallucination
      - task_completion
      - faithfulness
      - conversation_completeness

    thresholds:
      hallucination: 0.5
      task_completion: 0.5
      faithfulness: 0.5
      conversation_completeness: 0.5

    leading_questions:
      - name: "Tone Escalation"
        type: gating
        threshold: 0.5
        question: >-
          Is the revised post noticeably more celebratory and energetic than
          the original while remaining professional?

      - name: "Operational Context Honoured"
        type: gating
        threshold: 0.5
        question: >-
          Does the revision acknowledge the complexity of coordinating 280 stores
          as a testament to the team's capabilities?
