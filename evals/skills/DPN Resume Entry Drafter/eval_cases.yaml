        question: >-
          Does the revised entry maintain the correct DPN structure with
          bold header, bold role, dates, industry, exactly 4 bullets,
          and exactly 5 skills?

      - name: "Third Person Maintained"
        type: gating
        threshold: 0.5
        question: >-
          Is the revised entry still entirely in third person with no
          personal pronouns or names?

      - name: "New Details Incorporated"
        question: >-
          Have the user-provided details (45 staff trained, 99.2% accuracy)
          been incorporated into the revised bullet points?
