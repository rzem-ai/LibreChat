          then bold Skills & Technologies Used with 5 items?

      - name: "No Hallucinated Details"
        type: gating
        threshold: 0.5
        question: >-
          Are all claims in the bullet points traceable to the source
          material without inventing additional project details?

      - name: "Past Tense Verbs"
        question: >-
          Does each of the four bullet points begin with a past tense
          action verb (e.g. Coordinated, Managed, Delivered)?

      - name: "Five Skills Selected"
        question: >-
          Are exactly five skills listed, selected from the eight
          provided in the source material?

  case_8:
    name: "Minimal healthcare project → multi-turn expanding sparse input"
    category: "Content Generation & Transformation"
    invoke_method: invoke_sequential
    source_material: "documents/healthcare_minimal.md"
    chatbot_role: "A DPN Resume Entry Drafter that generates concise, third-person professional project summary entries for Deloitte People Network profiles"
    expected_output: >-
