      constraints and process.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "contract-analyser"

    turns:
      - content: >-
          Extract all obligations from this SOW — Delay Process, Change
          Process, Invoice Process, Subcontracting Limitations, and
          Obligation Tracker.
        attach_source: true
        turn_assertions:
          - type: expected_tools
            name: "Skill tool called"
            tools:
              - name: skill
                input_parameters:
                  skillName: "contract-analyser"
          - type: contains_any
            name: "Has invoice process"
            phrases: ["Invoice Process", "invoice", "Clause 2.2"]
          - type: contains_any
            name: "Has change process"
            phrases: ["Change Process", "Change Request", "Clause 3"]

      - content: >-
          Generate a summary of key issues with timeframes and notice
          requirements for each section.
        turn_assertions:
          - type: leading_question
            name: "Timeframes highlighted"
            question: >-
              Does the summary clearly highlight the shorter timeframes
              in this contract (2 Business Days for delay notification,
              7 Business Days for change response) compared to typical
              contracts?
          - type: contains_any
            name: "Contains tables"
            phrases: ["|", "Business Days", "calendar days"]

      - content: >-
          If I want to engage a new data engineering subcontractor not
          on the pre-approved list, what is the exact process and how
          long will it take?
        turn_assertions:
          - type: leading_question
            name: "Process steps cited"
            question: >-
              Does the response outline the process: submit request 15
              Business Days before start date, include subcontractor
              details/scope/qualifications/insurance, Client responds
              within 10 Business Days, and silence does not constitute
              consent?
          - type: leading_question
            name: "Clause references"
            question: >-
              Does the response cite Clause 5.2 specifically and note
              the distinction from the pre-approved list in Clause 5.1?

    metrics:
      - faithfulness
      - conversation_completeness

    thresholds:
      faithfulness: 0.5
      conversation_completeness: 0.5

    leading_questions:
      - name: "Accurate Process Description"
        type: gating
        threshold: 0.5
        question: >-
          Is the subcontracting approval process described accurately
          and completely based on the contract terms?

      - name: "No Speculation"
        type: gating
        threshold: 0.5
        question: >-
          Does the response avoid speculating about outcomes or adding
          information not present in the contract?

      - name: "Practical Guidance"
        question: >-
          Does the response provide practical, actionable guidance
          about the timeline and requirements?

