  case_7:
    name: "MSA full extraction — professional services with liquidated damages"
    category: "Data Classification & Extraction"
    source_material: "documents/msa_professional_services.md"
    chatbot_role: "A legal professional specialising in contract review for SoW and MSA documents"
    user_query: >-
      Review this Master Services Agreement and extract all obligations.
      I need the complete Delay Process, Change Process, Invoice Process,
      Subcontracting Limitations, and Obligation Tracker.
    expected_output: >-
      Five structured sections: (1) Delay Process citing Clauses 4.1–4.3
      with early warning obligation, formal notification within 3 Business
      Days, acknowledgement within 2 Business Days, meeting within 5 Business
      Days, Variation Order within 10 Business Days, liquidated damages of
      $5,000/day after 15 Business Days cumulative delay (capped at 10%),
      and Principal-caused delay provisions; (2) Change Process citing Clauses
      3.1–3.2 with acknowledgement within 2 Business Days, response within
      10 Business Days, signed Variation Order, escalation to Governance Board
      after 20 Business Days, and new SOW acceptance within 10 Business Days;
      (3) Invoice Process citing Clauses 2.2–2.3 with monthly arrears within
      10 Business Days of month end, statutory declaration for invoices over
      $100k, submission via Vendor Portal, payment within 28 calendar days,
      dispute within 10 Business Days, suspension right after 45 days, and
      interest at 2.5% above RBA rate plus Mermaid flowchart; (4) Subcontracting
      citing Clauses 5.1–5.4 with 25 Business Days notice, extensive
      documentation requirements, approval within 15 Business Days, quarterly
      register, annual reviews, and removal within 10/20 Business Days;
      (5) Obligation Tracker with all time-bound obligations.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "contract-analyser"

    metrics:
      - task_completion
      - faithfulness

    thresholds:
      task_completion: 0.5
      faithfulness: 0.5

    leading_questions:
      - name: "Liquidated Damages Captured"
        type: gating
        threshold: 0.5
        question: >-
          Does the Delay Process section accurately identify the liquidated
          damages provision: AUD $5,000 per Business Day after 15 cumulative
          days of Advisor-caused delay, capped at 10% of SOW value?

      - name: "Statutory Declaration Requirement"
        question: >-
          Does the Invoice Process capture the requirement for a statutory
          declaration accompanying invoices exceeding AUD $100,000?

      - name: "Suspension Right"
        question: >-
          Does the Invoice Process note the Advisor's right to suspend
          services after 45 calendar days of non-payment (with 10 Business
          Days' notice)?

      - name: "Subcontractor Register"
        question: >-
          Does the Subcontracting section capture the quarterly register
          maintenance obligation and annual performance review requirement?

      - name: "Governance Board Escalation"
        type: gating
        threshold: 0.5
        question: >-
          Does the Change Process correctly identify escalation to the
          Relationship Governance Board after 20 Business Days of
          failed negotiation?

  case_8:
    name: "MSA multi-turn — extraction, summary, and penalty question"
    category: "Data Classification & Extraction"
    invoke_method: invoke_sequential
    source_material: "documents/msa_professional_services.md"
    chatbot_role: "A legal professional specialising in contract review for SoW and MSA documents"
    expected_output: >-
      First turn: full obligation extraction with all five sections.
      Second turn: summary tables highlighting key timeframes and financial
      consequences. Third turn: detailed insight about the financial
      exposure from delays and non-compliance.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "contract-analyser"

    turns:
      - content: >-
          Analyse this MSA and provide the full obligation extraction —
          all five sections: Delay Process, Change Process, Invoice
          Process, Subcontracting Limitations, and Obligation Tracker.
        attach_source: true
        turn_assertions:
          - type: expected_tools
            name: "Skill tool called"
            tools:
              - name: skill
                input_parameters:
                  skillName: "contract-analyser"
          - type: contains_any
            name: "Has liquidated damages"
            phrases: ["liquidated damages", "$5,000", "5,000 per Business Day"]
          - type: contains_any
            name: "Has subcontracting details"
            phrases: ["25 Business Days", "Procurement Director", "Clause 5"]

      - content: >-
          Summarise the key issues identified and highlight all
          timeframes and notice periods required by each party.
        turn_assertions:
          - type: leading_question
            name: "Financial consequences highlighted"
            question: >-
              Does the summary highlight the financial consequences
              including liquidated damages, late payment interest, minimum
              commitment shortfall fee, and service suspension rights?
          - type: contains_any
            name: "Contains structured tables"
            phrases: ["|", "Timeframe", "Notice", "Business Days"]

      - content: >-
          What is the Advisor's maximum financial exposure if they
          cause delays on a $500,000 SOW? Include all penalty
          mechanisms in the contract.
        turn_assertions:
          - type: leading_question
            name: "Calculates LD cap"
            question: >-
              Does the response calculate that the liquidated damages
              cap is 10% of the SOW value ($50,000 on a $500,000 SOW)
              and explain the $5,000 per Business Day accrual?
          - type: leading_question
            name: "Identifies termination risk"
            question: >-
              Does the response note that beyond financial penalties,
              the Principal can terminate the SOW under Clause 7.2
              after 15 cumulative Business Days of delay?

    metrics:
      - faithfulness
      - conversation_completeness

    thresholds:
      faithfulness: 0.5
      conversation_completeness: 0.5

    leading_questions:
      - name: "Accurate Financial Analysis"
        type: gating
        threshold: 0.5
        question: >-
          Is the financial exposure calculation accurate and grounded
          in the specific penalty mechanisms stated in the contract?

      - name: "Complete Risk Picture"
        question: >-
          Does the response provide a complete picture of risk including
          both financial penalties and termination consequences?

      - name: "No Invented Penalties"
        type: gating
        threshold: 0.5
        question: >-
          Does the response avoid introducing penalty types or mechanisms
          that do not exist in the contract? Calculating specific amounts
          from stated formulae (e.g. applying the 10% cap to a SOW value)
          is acceptable and should not be considered invention.
