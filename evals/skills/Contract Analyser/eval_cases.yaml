# Contract Analyser — Evaluation Cases
# Category: Data Classification & Extraction

adapter: _eval.adapters.librechat_adapter.LibreChatAdapter
invoke_method: invoke_text
num_runs: 3

cases:

  # ═══════════════════════════════════════════════════════════════════════════
  # Document 1: SOW — IT Infrastructure Modernisation
  # ═══════════════════════════════════════════════════════════════════════════

  case_1:
    name: "SOW full obligation extraction — IT consulting"
    category: "Data Classification & Extraction"
    source_material: "documents/sow_it_consulting.md"
    chatbot_role: "A legal professional specialising in contract review for SoW and MSA documents"
    user_query: >-
      Please analyse this Statement of Work and extract all obligations.
      I need the Delay Process, Change Process, Invoice Process,
      Subcontracting Limitations, and the full Obligation Tracker.
    expected_output: >-
      Five structured sections each beginning with '---': (1) Delay Process as
      numbered steps citing Clauses 4.1–4.3 covering notification within 5 Business
      Days, assessment within 10 Business Days, remediation plan within 15 Business
      Days, and termination after 40 Business Days; (2) Change Process as numbered
      steps citing Clauses 2.3(a)–(f) covering written Change Request, acknowledgement
      within 2 Business Days, response within 10 Business Days, signed Change Order,
      and escalation after 20 Business Days; (3) Invoice Process citing Clauses
      3.2–3.3 with requirements table and Mermaid flowchart showing monthly invoicing
      by 5th Business Day, payment within 30 days, dispute within 14 days, and late
      interest; (4) Subcontracting Limitations citing Clauses 5.1–5.2 covering prior
      written consent, 20 Business Days notice, deed of confidentiality, and revocation
      with 10 Business Days notice; (5) Obligation Tracker as a Markdown table with
      all time-bound obligations from the contract.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "contract-analyser"

    metrics:
      - task_completion
      - faithfulness

    thresholds:
      task_completion: 0.5
      faithfulness: 0.5

    leading_questions:
      - name: "Five Sections Present"
        type: gating
        threshold: 0.5
        question: >-
          Does the output contain all five required sections: Delay Process,
          Change Process, Invoice Process, Subcontracting Limitations, and
          Obligation Tracker?

      - name: "Section Separators"
        type: gating
        threshold: 0.5
        question: >-
          Does each section begin with a '---' separator as required by
          the skill format?

      - name: "Clause Citations"
        question: >-
          Are specific clause numbers cited for each obligation, step,
          or requirement extracted?

      - name: "Mermaid Flowchart"
        question: >-
          Does the Invoice Process section include a Mermaid flowchart
          that accurately represents the invoicing process with clause
          references?

      - name: "Obligation Tracker Format"
        question: >-
          Is the Obligation Tracker presented as a Markdown table with
          columns: ID, Document Name, Responsible Party, Category,
          Reference, Obligations, and Trigger?

  case_2:
    name: "SOW multi-turn — extraction then insights question"
    category: "Data Classification & Extraction"
    invoke_method: invoke_sequential
    source_material: "documents/sow_it_consulting.md"
    chatbot_role: "A legal professional specialising in contract review for SoW and MSA documents"
    expected_output: >-
      First turn: full obligation extraction with all five sections.
      Second turn: a summary table highlighting key timeframes and notice
      requirements. Third turn: a specific insight answering the question
      about termination rights with clause references.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "contract-analyser"

    turns:
      - content: >-
          Analyse this SOW and extract all obligations — Delay Process,
          Change Process, Invoice Process, Subcontracting Limitations,
          and Obligation Tracker.
        attach_source: true
        turn_assertions:
          - type: expected_tools
            name: "Skill tool called"
            tools:
              - name: skill
                input_parameters:
                  skillName: "contract-analyser"
          - type: contains_any
            name: "Has delay process"
            phrases: ["Delay Process", "delay notification", "Clause 4"]
          - type: contains_any
            name: "Has obligation tracker"
            phrases: ["Obligation Tracker", "| ID |", "| Reference |"]

      - content: >-
          Now summarise the key issues and identify all timeframes or
          notices required by either party.
        turn_assertions:
          - type: leading_question
            name: "Summary tables present"
            question: >-
              Does the response contain separate Markdown tables for each
              section (Delay, Change, Invoice, Subcontracting) summarising
              timeframes and notice requirements?
          - type: contains_any
            name: "Mentions specific timeframes"
            phrases: ["Business Days", "calendar days", "30 calendar days"]

      - content: >-
          Under what circumstances can the Client terminate this SOW, and
          what notice periods apply?
        turn_assertions:
          - type: leading_question
            name: "Termination grounds cited"
            question: >-
              Does the response identify both termination for convenience
              (60 calendar days' notice) and termination for cause (20
              Business Days to remedy), citing Clauses 8.1 and 8.2?
          - type: leading_question
            name: "Delay-based termination"
            question: >-
              Does the response mention the right to terminate after 40
              Business Days of unresolved delay under Clause 4.3?

    metrics:
      - faithfulness
      - conversation_completeness

    thresholds:
      faithfulness: 0.5
      conversation_completeness: 0.5

    leading_questions:
      - name: "Multi-Step Compliance"
        type: gating
        threshold: 0.5
        question: >-
          Does the conversation successfully complete all three steps:
          extraction, summary, and targeted insight?

      - name: "Grounded in Contract"
        type: gating
        threshold: 0.5
        question: >-
          Are all responses grounded in the uploaded contract without
          invented obligations or clauses?

      - name: "Professional Tone"
        question: >-
          Is the language precise and professionally framed throughout
          all turns, as expected of a legal professional?

  # ═══════════════════════════════════════════════════════════════════════════
  # Document 2: MSA — Cloud Platform Services
  # ═══════════════════════════════════════════════════════════════════════════

  case_3:
    name: "MSA full obligation extraction — cloud services"
    category: "Data Classification & Extraction"
    source_material: "documents/msa_cloud_services.md"
    chatbot_role: "A legal professional specialising in contract review for SoW and MSA documents"
    user_query: >-
      Review this Master Services Agreement and extract all obligations.
      Provide the Delay Process, Change Process, Invoice Process,
      Subcontracting Limitations, and Obligation Tracker.
    expected_output: >-
      Five structured sections each beginning with '---': (1) Delay Process
      citing Clauses 4.1–4.3 with notification within 3 Business Days,
      response within 5 Business Days, corrective actions within 10 Business
      Days, and Force Majeure provisions; (2) Change Process (Variations)
      citing Clause 5.1–5.2 with acknowledgement within 3 Business Days,
      response within 15 Business Days, written execution requirement, and
      emergency variation within 24 hours; (3) Invoice Process citing Clauses
      3.2–3.3 with invoicing on 1st Business Day in advance, payment within
      21 calendar days, dispute within 7 Business Days, and interest at 1.5%
      per month plus Mermaid flowchart; (4) Subcontracting Limitations citing
      Clauses 6.1–6.4 covering CIO approval, 30 Business Days notice, tripartite
      deed, and removal with 15/30 Business Days notice; (5) Obligation Tracker
      table with all time-bound obligations.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "contract-analyser"

    metrics:
      - task_completion
      - faithfulness

    thresholds:
      task_completion: 0.5
      faithfulness: 0.5

    leading_questions:
      - name: "Emergency Variation Captured"
        type: gating
        threshold: 0.5
        question: >-
          Does the Change Process section identify the emergency variation
          provision (Clause 5.2) requiring implementation within 24 hours
          and retrospective Variation Request within 5 Business Days?

      - name: "Subcontractor Removal Process"
        question: >-
          Does the Subcontracting section capture the Customer's right to
          require removal with 15 Business Days' notice and the Supplier's
          obligation to transition within 30 Business Days?

      - name: "Force Majeure Included"
        question: >-
          Does the Delay Process include the Force Majeure clause with
          notification within 2 Business Days and termination right after
          60 calendar days?

      - name: "Invoice Flowchart Accuracy"
        question: >-
          Does the Mermaid flowchart accurately represent invoicing in
          advance on the 1st Business Day, with clause references and
          no invented steps?

  case_4:
