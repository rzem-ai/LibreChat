  # ═══════════════════════════════════════════════════════════════════════════

  case_5:
    name: "SOW invoice and change process extraction — data analytics"
    category: "Data Classification & Extraction"
    source_material: "documents/sow_data_analytics.md"
    chatbot_role: "A legal professional specialising in contract review for SoW and MSA documents"
    user_query: >-
      Analyse this Statement of Work and extract all obligations including
      the Delay Process, Change Process, Invoice Process, Subcontracting
      Limitations, and Obligation Tracker.
    expected_output: >-
      Five structured sections: (1) Delay Process citing Clauses 4.1–4.3
      with notification within 2 Business Days, Client-caused delay extension
      plus cost reimbursement, Consultant remediation within 5 Business Days,
      and termination if delay exceeds 20 Business Days; (2) Change Process
      citing Clauses 3.1–3.2 with acknowledgement within 3 Business Days,
      response within 7 Business Days, signed Change Order requirement, and
      minor adjustment provision; (3) Invoice Process citing Clauses 2.2–2.3
      with milestone-based invoicing within 5 Business Days of acceptance,
      payment within 14 Business Days, dispute within 7 Business Days, and
      1% monthly late penalty plus Mermaid flowchart; (4) Subcontracting
      citing Clauses 5.1–5.3 with pre-approved subcontractors listed, 15
      Business Days notice for additional, and response within 10 Business
      Days; (5) Obligation Tracker with milestone dates and all time-bound
      obligations.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "contract-analyser"

    metrics:
      - task_completion
      - faithfulness

    thresholds:
      task_completion: 0.5
      faithfulness: 0.5

    leading_questions:
      - name: "Pre-Approved Subcontractors"
        type: gating
        threshold: 0.5
        question: >-
          Does the Subcontracting section identify the two pre-approved
          subcontractors (Quantix Data Engineering and Vizual Analytics Co)
          and note that additional subcontractors require separate approval?

      - name: "Milestone-Based Invoicing"
        question: >-
          Does the Invoice Process correctly identify that invoicing is
          milestone-based (within 5 Business Days of acceptance) rather
          than monthly, with the 20% upfront payment noted?

      - name: "Minor Adjustment Provision"
        question: >-
          Does the Change Process capture the minor adjustment provision
          (Clause 3.2) allowing email agreement for changes under 5
          Business Days timeline impact?

      - name: "Obligation Tracker Completeness"
        question: >-
          Does the Obligation Tracker include the specific milestone
          dates (D1 through D6) from Clause 1.2 as time-bound
          obligations?

  case_6:
