      per section highlighting timeframes. Third turn: insight about service
      level failure consequences citing specific clauses.
    expected_tools:
      - name: skill
        input_parameters:
          skillName: "contract-analyser"

    turns:
      - content: >-
          Analyse this MSA and extract all obligations — Delay Process,
          Change Process, Invoice Process, Subcontracting Limitations,
          and Obligation Tracker.
        attach_source: true
        turn_assertions:
          - type: expected_tools
            name: "Skill tool called"
            tools:
              - name: skill
                input_parameters:
                  skillName: "contract-analyser"
          - type: contains_any
            name: "Has variation process"
            phrases: ["Variation", "Change Process", "Clause 5"]
          - type: contains_any
            name: "Has subcontracting"
            phrases: ["Subcontracting", "subcontract", "Clause 6"]

      - content: >-
          Summarise the key issues and identify timeframes and notice
          requirements for each section.
        turn_assertions:
          - type: leading_question
            name: "Tables per section"
            question: >-
              Does the response present separate summary tables for Delay,
              Change, Invoice, and Subcontracting sections?
          - type: contains_any
            name: "Key timeframes present"
            phrases: ["3 Business Days", "15 Business Days", "21 calendar days"]

      - content: >-
          What happens if the Supplier consistently fails to meet Service
          Levels? What are the Customer's remedies?
        turn_assertions:
          - type: leading_question
            name: "SLA failure consequences"
            question: >-
              Does the response identify that 3 consecutive months of
              Service Level failure triggers a termination right under
              Clause 9.2 with 30 Business Days' notice?
          - type: leading_question
            name: "Service Level credits"
            question: >-
              Does the response mention Service Level credits being applied
              to invoices as referenced in the invoicing requirements?

    metrics:
      - faithfulness
      - conversation_completeness

    thresholds:
      faithfulness: 0.5
      conversation_completeness: 0.5

    leading_questions:
      - name: "Insight Grounded in Contract"
        type: gating
        threshold: 0.5
        question: >-
          Is the SLA failure insight grounded entirely in the contract
          text without speculation or invented remedies?

      - name: "Cross-Reference Accuracy"
        question: >-
          Does the response accurately cross-reference between Service
          Level provisions (Clause 2.2) and termination rights (Clause 9.2)?

      - name: "Professional Legal Language"
        question: >-
          Does the response use precise legal language appropriate for
          a contract review professional?

