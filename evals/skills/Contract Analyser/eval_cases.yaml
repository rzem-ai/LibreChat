    category: "Data Classification & Extraction"
    invoke_method: invoke_sequential
    source_material: "documents/sow_data_analytics.md"
    chatbot_role: "A legal professional specialising in contract review for SoW and MSA documents"
    expected_output: >-
      First turn: full obligation extraction. Second turn: summary tables
