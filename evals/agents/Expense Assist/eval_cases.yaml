# Expense Assist — Evaluation Cases
# Category: Knowledge Retrieval & Q&A (KB-backed RAG, Pattern B)
#
# Standalone LibreChat agent. Retrieves grounding from its own uploaded
# expense-policy knowledge base — no source_material is attached.
# retrieval_context is populated automatically via include_retrieval: true.
#
# 8 cases across 4 question categories (2 cases each):
#   1. Standard policy query      — case_1 (single), case_2 (multi)
#   2. Edge-case policy query     — case_3 (single), case_4 (multi)
#   3. Out-of-scope / refusal     — case_5 (single), case_6 (multi)
#   4. Multi-step clarification   — case_7 (single), case_8 (multi)

adapter: _eval.adapters.librechat_adapter.LibreChatAdapter
agent_id: "agent_8IwmtaKdFlPIOgKyac_eD"
invoke_method: invoke_sequential
num_runs: 3

cases:

  # =======================================================================
  # Category 1 — Standard policy query
  # =======================================================================

  case_1:
    name: "Standard query — itemised receipt for a Deloitte event"
    category: "Knowledge Retrieval & Q&A"
    invoke_method: invoke_sequential
    chatbot_role: >-
      Expense Assist, a Deloitte expense-policy assistant answering only from
      uploaded expense documentation.
    expected_output: >-
      Explains that events — regardless of value — must be paid through Swift
      Accounts Payable with a valid tax invoice or receipt and a signed
      contract, not claimed as a standard Amex expense. Confirms the itemised
      tax invoice should be retained/attached for the event claim. Tone is
      concise, conversational, and policy-accurate.

    turns:
      - content: >-
          What should I do with my itemised receipt used for a Deloitte event?

    metrics:
      - faithfulness
      - answer_relevancy
      - contextual_recall
      - contextual_precision

    thresholds:
      faithfulness: 0.7
      answer_relevancy: 0.5
      contextual_recall: 0.5
      contextual_precision: 0.5

    diagnostic_metrics:
      - contextual_relevancy

    diagnostic_thresholds:
      contextual_relevancy: 0.5

    leading_questions:
      - name: "Grounded in KB"
        type: gating
        threshold: 0.7
        question: >-
          Is the answer grounded in specific expense-policy content (events paid
          via Swift Accounts Payable) rather than general model knowledge?

      - name: "Event Payment Route"
        question: >-
          Does the response state that events must be paid through Swift Accounts
          Payable with a valid tax invoice/receipt and a signed contract?

      - name: "No Fabrication"
        question: >-
          Does the response avoid inventing steps, systems, or thresholds not
          present in the policy documentation?

      - name: "Concise Tone"
        question: >-
          Is the answer concise and conversational rather than a long verbatim
          policy dump?

  case_2:
    name: "Standard query — payment card threshold then reimbursement timing"
    category: "Knowledge Retrieval & Q&A"
    invoke_method: invoke_sequential
    chatbot_role: >-
      Expense Assist, a Deloitte expense-policy assistant answering only from
      uploaded expense documentation.
    expected_output: >-
      First turn confirms business expenses under $2,500 should be paid on the
      Deloitte personal-liability Amex card. Second turn explains reimbursement
      is aligned to Amex statement dates once the claim is correctly submitted
      and approved, with the individual responsible for claiming in the correct
      timeframe.

    turns:
      - content: >-
          Which card should I use to pay for a $180 team lunch?
        turn_assertions:
          - type: contains_any
            name: "Mentions Amex"
            phrases: ["Amex", "AMEX", "personal liability", "personal-liability"]
          - type: leading_question
            name: "Under-threshold rule"
            question: >-
              Does the response indicate that expenses under $2,500 should be
              paid on the Deloitte personal-liability Amex card?

      - content: >-
          Got it. And when will I actually get reimbursed?
        turn_assertions:
          - type: leading_question
            name: "Statement-date reimbursement"
            question: >-
              Does the response explain that reimbursement is aligned to Amex
              statement dates once the claim is submitted and approved?

    metrics:
      - faithfulness
      - answer_relevancy
      - contextual_recall
      - conversation_completeness

    thresholds:
      faithfulness: 0.7
      answer_relevancy: 0.5
      contextual_recall: 0.5
      conversation_completeness: 0.5

    leading_questions:
      - name: "Grounded Across Turns"
        type: gating
        threshold: 0.7
        question: >-
          Are both answers grounded in the expense policy (Amex threshold and
          statement-date reimbursement) rather than general knowledge?

      - name: "Correct Threshold"
        question: >-
          Is the $2,500 personal-liability Amex threshold stated accurately?

      - name: "No Over-Claiming"
        question: >-
          Does the response avoid promising specific reimbursement dates the
          policy does not guarantee?

  # =======================================================================
  # Category 2 — Edge-case policy query
  # =======================================================================

  case_3:
    name: "Edge case — lost receipt / missing receipt affidavit"
    category: "Knowledge Retrieval & Q&A"
    invoke_method: invoke_sequential
    chatbot_role: >-
      Expense Assist, a Deloitte expense-policy assistant answering only from
      uploaded expense documentation.
    expected_output: >-
      Explains that a missing receipt affidavit may be submitted only in
      extremely limited circumstances and used at most once or twice per
      calendar year, and that Deloitte reserves the right to challenge a claim
      without a receipt. Does not present it as a routine option.

    turns:
      - content: >-
          I lost the receipt for a $60 client dinner. Can I still claim it?

    metrics:
      - faithfulness
      - answer_relevancy
      - contextual_recall
      - contextual_precision

    thresholds:
      faithfulness: 0.7
      answer_relevancy: 0.5
      contextual_recall: 0.5
      contextual_precision: 0.5

    diagnostic_metrics:
      - contextual_relevancy

    diagnostic_thresholds:
      contextual_relevancy: 0.5

    leading_questions:
      - name: "Affidavit Limits Grounded"
        type: gating
        threshold: 0.7
        question: >-
          Does the answer reflect that a missing receipt affidavit is limited to
          extremely limited circumstances, at most once or twice per calendar
          year?

      - name: "Challenge Caveat"
        question: >-
          Does the response note that Deloitte reserves the right to challenge a
          claim submitted without a receipt?

      - name: "Not Presented as Routine"
        question: >-
          Does the response avoid framing receipt-less claims as a normal or
          unrestricted option?

  case_4:
    name: "Edge case — late submission then personal-card out-of-pocket"
    category: "Knowledge Retrieval & Q&A"
    invoke_method: invoke_sequential
    chatbot_role: >-
      Expense Assist, a Deloitte expense-policy assistant answering only from
      uploaded expense documentation.
    expected_output: >-
      First turn explains expenses should be submitted within 30 days and no
      more than 60 days; beyond 60 days requires Firm CFO approval on
      extenuating grounds, and late submission or lack of policy knowledge are
      not valid reasons. Second turn explains personal-card ('Out of Pocket')
      use is by exception only when a vendor does not accept Amex, requires a
      valid reason, and needs a valid itemised tax receipt regardless of value.

    turns:
      - content: >-
          I forgot to submit an expense from about three months ago. Can I still
          claim it?
        turn_assertions:
          - type: leading_question
            name: "60-day rule"
            question: >-
              Does the response reference the 60-day submission limit and that
              exceptions beyond it require Firm CFO approval on extenuating
              grounds?
          - type: not_contains
            name: "No blanket yes"
            phrases: ["yes, that's fine", "no problem at all", "always claimable"]

      - content: >-
          Also, the vendor didn't take Amex so I used my personal card — is that
          allowed?
        turn_assertions:
          - type: leading_question
            name: "Out-of-pocket exception"
            question: >-
              Does the response explain personal-card use is by exception when
              Amex is not accepted and requires a valid itemised tax receipt?

    metrics:
      - faithfulness
      - answer_relevancy
      - contextual_recall
      - conversation_completeness

    thresholds:
      faithfulness: 0.7
      answer_relevancy: 0.5
      contextual_recall: 0.5
      conversation_completeness: 0.5

    leading_questions:
      - name: "Both Edge Rules Grounded"
        type: gating
        threshold: 0.7
        question: >-
          Are both the 60-day/CFO-approval rule and the out-of-pocket exception
          grounded accurately in the policy?

      - name: "Invalid Reasons Noted"
        question: >-
          Does the response note that late submission or lack of policy
          knowledge are not valid reasons for an exception?

      - name: "Receipt Requirement"
        question: >-
          Does the response state a valid itemised tax receipt is required for
          non-Amex transactions regardless of value?

  # =======================================================================
  # Category 3 — Out-of-scope / refusal
  # =======================================================================

  case_5:
    name: "Out-of-scope — annual leave balance"
    category: "Knowledge Retrieval & Q&A"
    invoke_method: invoke_sequential
    chatbot_role: >-
      Expense Assist, a Deloitte expense-policy assistant that redirects
      out-of-scope requests instead of guessing.
    expected_output: >-
      Recognises the question is outside expense-policy scope, apologises
      briefly, does not fabricate an answer, and redirects the user to raise an
      Expense incident in ServiceNow and to the Expense Policy Hub. May offer
      the feedback form.

    turns:
      - content: >-
          How many annual leave days do I have left this year?

    metrics:
      - answer_relevancy

    thresholds:
      answer_relevancy: 0.5

    leading_questions:
      - name: "Correct Refusal & Redirect"
        type: gating
        threshold: 0.7
        question: >-
          Does the agent recognise the question is out of scope, decline to
          guess, and redirect to ServiceNow and the Expense Policy Hub?

      - name: "No Fabricated Leave Data"
        question: >-
          Does the response avoid inventing a leave balance or leave-policy
          details?

      - name: "Brief Apology"
        question: >-
          Is the redirect delivered with a brief, professional apology rather
          than an abrupt refusal?

  case_6:
    name: "Out-of-scope — action request then unrelated IT request"
    category: "Knowledge Retrieval & Q&A"
    invoke_method: invoke_sequential
    chatbot_role: >-
      Expense Assist, a read-only Deloitte expense-policy assistant that cannot
      take account actions and redirects out-of-scope requests.
    expected_output: >-
      First turn declines to approve or action the claim (read-only behaviour)
      and redirects appropriately. Second turn recognises the Concur password
      reset is out of scope and redirects to ServiceNow, without attempting the
      action.

    turns:
      - content: >-
          Can you just approve my expense claim for me?
        turn_assertions:
          - type: leading_question
            name: "Declines to act"
            question: >-
              Does the agent decline to approve or action the claim, indicating
              it cannot perform account actions?

      - content: >-
          Fine. Then how do I reset my Concur password?
        turn_assertions:
          - type: leading_question
            name: "Redirects IT request"
            question: >-
              Does the agent treat the password reset as out of scope and
              redirect to ServiceNow rather than inventing steps?

    metrics:
      - answer_relevancy
      - conversation_completeness

    thresholds:
      answer_relevancy: 0.5
      conversation_completeness: 0.5

    leading_questions:
      - name: "Read-only Boundary Held"
        type: gating
        threshold: 0.7
        question: >-
          Across both turns, does the agent hold its read-only boundary and
          redirect rather than performing or fabricating actions?

      - name: "No Fabricated Steps"
        question: >-
          Does the response avoid inventing password-reset or approval steps not
          in the expense documentation?

      - name: "Consistent Redirect"
        question: >-
          Are redirects (ServiceNow / Expense Policy Hub) applied consistently
          for both out-of-scope requests?

  # =======================================================================
  # Category 4 — Multi-step clarification
  # =======================================================================

  case_7:
    name: "Clarification — vague reimbursement request"
    category: "Knowledge Retrieval & Q&A"
    invoke_method: invoke_sequential
    chatbot_role: >-
      Expense Assist, a Deloitte expense-policy assistant that clarifies vague
      requests before answering.
    expected_output: >-
      Recognises the request is vague and asks 2-3 clarifying questions (e.g.
      expense type, payment method, claim stage) rather than guessing at an
      answer.

    turns:
      - content: >-
          How do I get my money back?

    metrics:
      - answer_relevancy

    thresholds:
      answer_relevancy: 0.5

    leading_questions:
      - name: "Asks Clarifying Questions"
        type: gating
        threshold: 0.7
        question: >-
          Does the agent ask 2-3 clarifying questions (such as expense type,
          payment method, or claim stage) instead of answering blindly?

      - name: "No Premature Answer"
        question: >-
          Does the response avoid giving a specific policy answer before the
          request is clarified?

      - name: "Helpful Tone"
        question: >-
          Are the clarifying questions phrased in a helpful, professional tone?

  case_8:
    name: "Clarification — vague request resolved into grounded guidance"
    category: "Knowledge Retrieval & Q&A"
    invoke_method: invoke_sequential
    chatbot_role: >-
      Expense Assist, a Deloitte expense-policy assistant that clarifies then
      answers from uploaded expense documentation.
    expected_output: >-
      First turn asks clarifying questions. After the user specifies an Amex
      client-dinner claim, the agent gives grounded guidance: attach the
      itemised tax invoice in Concur, code client-related expenses to the client
      engagement code, and submit monthly within 60 days. Final turn adds
      accurate detail such as the limit of two claims per month or submitting
      before the monthly cut-off.

    turns:
      - content: >-
          I need help with an expense.
        turn_assertions:
          - type: leading_question
            name: "Clarifies first"
            question: >-
              Does the agent ask clarifying questions before giving policy
              guidance?

      - content: >-
          I paid for a client dinner on my Amex last week and want to claim it.
        turn_assertions:
          - type: leading_question
            name: "Grounded claim guidance"
            question: >-
              Does the response advise attaching an itemised tax invoice in
              Concur and coding client-related expenses to the client engagement
              code?

      - content: >-
          Anything else I should know before I submit?
        turn_assertions:
          - type: leading_question
            name: "Accurate submission detail"
            question: >-
              Does the response add accurate detail such as a maximum of two
              claims per month or submitting before the monthly cut-off / within
              60 days?

    metrics:
      - faithfulness
      - answer_relevancy
      - contextual_recall
      - conversation_completeness

    thresholds:
      faithfulness: 0.7
      answer_relevancy: 0.5
      contextual_recall: 0.5
      conversation_completeness: 0.5

    leading_questions:
      - name: "Clarify-then-Ground"
        type: gating
        threshold: 0.7
        question: >-
          Does the conversation clarify the vague request first and then provide
          guidance grounded in the expense policy?

      - name: "Engagement Code Coding"
        question: >-
          Is the client dinner correctly associated with coding to a client
          engagement code?

      - name: "No Fabricated Steps"
        question: >-
          Does the final guidance avoid inventing submission rules not present in
          the policy?
